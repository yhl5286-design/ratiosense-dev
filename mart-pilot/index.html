<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마트의 비밀</title>
<style>
  :root{--bg:#f4f1ea;--card:#fff;--ink:#26303f;--sub:#6b7683;--line:#e6e1d6;--accent:#2e9e63;--gold:#e0a02a;--red:#c0392b;--r:16px;--shadow:0 6px 20px rgba(0,0,0,.07)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  .wrap{max-width:700px;margin:0 auto;padding:12px 12px 40px}
  h1{font-size:19px;margin:4px 0 2px}.muted{color:var(--sub);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:13px;margin:10px 0}
  .lbl{font-size:12.5px;color:var(--sub);margin-bottom:6px}.lbl b{color:var(--ink)}
  .seg{display:flex;gap:5px}.seg button{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 2px;font-weight:700;font-size:11px;cursor:pointer}
  .seg button.active{border-color:var(--ink);background:#fbf6e8}
  .readout{background:#1f2a3d;color:#fff;border:none;text-align:center}
  .readout .big{font-size:20px;font-weight:800;margin:2px 0}.readout .big b{color:#ffd966}.readout .nm{font-size:13px;color:#cdd6e4}
  .btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 13px;font-weight:700;cursor:pointer;font-size:13.5px}
  .btn:active{transform:translateY(1px)}
  .btn.big{font-size:15px;padding:11px 20px;background:#eaf7ef;border-color:var(--accent);color:#136a3d;font-weight:800}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
  .cap{font-size:12px;color:var(--sub);text-align:center;margin-top:8px}.cap b{color:var(--ink)}
  /* 달걀·묶음 */
  .eggs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:90px;align-items:center}
  .egg{font-size:26px}
  .pack{border:2.5px dashed #b99b5f;background:#fdf6e3;border-radius:12px;padding:6px 8px;display:flex;gap:2px;flex-wrap:wrap;max-width:120px;justify-content:center}
  /* 봉지 */
  .bags{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .bag{border:2px solid #7a9a5a;background:#f0f6e8;border-radius:12px 12px 14px 14px;padding:10px 12px;font-weight:800;cursor:pointer;text-align:center;font-size:14px;min-width:74px}
  .bag.opened{background:#d8ecc4;border-color:#4a7a2a}
  .jump{text-align:center;font-size:26px;font-weight:800;letter-spacing:2px;min-height:38px}
  .jump b{color:var(--accent)}
  /* 상품 카드 */
  .shop{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .item{border:2px solid var(--line);border-radius:14px;padding:12px 16px;text-align:center;min-width:150px;background:#fffdf7}
  .item .em{font-size:34px}.item .pr{font-weight:800;font-size:16px;margin-top:4px}
  .item.pick{cursor:pointer}.item.pick:active{background:#fbf6e8}
  .sale{display:inline-block;background:var(--red);color:#fff;font-weight:800;border-radius:8px;padding:2px 8px;font-size:13px}
  /* 계산기 */
  .calc{max-width:290px;margin:10px auto 4px}
  .calcdisp{background:#1f2a3d;color:#fff;font-size:26px;font-weight:800;text-align:right;padding:9px 15px;border-radius:10px;font-variant-numeric:tabular-nums;min-height:46px}
  .calcgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:7px}
  .cbtn{padding:13px 0;font-size:18px;font-weight:800;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer}
  .cbtn:active{background:#f0ece2;transform:translateY(1px)}
  .cbtn.op{background:#f7f0dd;border-color:#e0c98a}
  #banner{position:absolute;left:10px;right:10px;display:none;z-index:60;transform:translateY(-50%)}
  #banner.show{display:block}
  #banner .in{max-width:560px;margin:0 auto;padding:14px 16px;border-radius:16px;box-shadow:0 14px 44px rgba(0,0,0,.28);font-weight:700;background:#e7f7ee;color:#136a3d;border-top:3px solid var(--accent)}
  #banner .sub{font-weight:600;font-size:13px;margin-top:4px}#banner .acts{margin-top:10px}#banner .acts .btn{margin-right:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🛒 마트의 비밀</h1>
  <div class="muted">묶고, 풀고, 값을 매기고 — 마트 속에 숨은 <b>단위의 비밀</b>을 찾아요.</div>
  <div class="card"><div class="lbl">단계</div><div class="seg" id="stageSeg"></div></div>
  <div class="card readout" id="readout"></div>
  <div id="body"></div>
  <div class="muted" style="text-align:center;font-size:11px">마트의 비밀 · 단위화·단위비율·할인율 · 2026-07-07</div>
</div>
<div id="banner"><div class="in"><div id="bT"></div><div class="sub" id="bS"></div><div class="acts" id="bA"></div></div></div>

<script>
const $=s=>document.querySelector(s);
let stage=1;
function plog(ev,data){try{parent.postMessage({type:'pilotLog',lab:'mart',event:ev,data:Object.assign({stage},data||{})},'*');}catch(e){}}
const STAGES=[['1 · 묶어 세기',1],['2 · 뛰어 세기',2],['3 · 하나에 얼마?',3],['4 · 어디가 싸?',4],['5 · 할인의 비밀',5]];
function renderStage(){const el=$('#stageSeg');el.innerHTML='';STAGES.forEach(([x,s])=>{
  const b=document.createElement('button');b.className=stage===s?'active':'';b.textContent=x;b.onclick=()=>{stage=s;render();plog('enter');};el.appendChild(b);});}
function placeBanner(b){let y;try{const fe=window.frameElement;
  if(fe){const r=fe.getBoundingClientRect(),ph=window.parent.innerHeight;
    const vt=Math.max(0,-r.top),vb=Math.min(r.height,ph-r.top);y=vt+(vb-vt)*0.55;}
  else{y=window.scrollY+window.innerHeight*0.6;}}catch(e){y=window.scrollY+window.innerHeight*0.6;}
  b.style.top=Math.max(90,Math.round(y))+'px';}
function banner(t,s,acts){const b=$('#banner');b.className='show';placeBanner(b);$('#bT').innerHTML=t;$('#bS').innerHTML=s||'';const ae=$('#bA');ae.innerHTML='';(acts||[]).forEach(([x,fn])=>{const q=document.createElement('button');q.className='btn';q.innerHTML=x;q.onclick=fn;ae.appendChild(q);});}
function hideBanner(){$('#banner').className='';}
function won(n){return n.toLocaleString('ko-KR')+'원';}

/* ===== 계산기 (−, ×, ÷) ===== */
let cDisp='0', cAcc=null, cOp=null, cFresh=true;
function cShow(){const d=$('#cd');if(!d)return;
  let s;if(cOp&&cAcc!==null){s=cAcc+' '+cOp+(cFresh?'':' '+cDisp);}else s=cDisp;
  d.textContent=s;}
function cD(d){if(cFresh){cDisp=String(d);cFresh=false;}else{cDisp=(cDisp==='0'?'':cDisp)+d;}cShow();}
function cCompute(){const y=parseFloat(cDisp);let r=cAcc;
  if(cOp==='×')r=cAcc*y;else if(cOp==='÷')r=cAcc/y;else if(cOp==='−')r=cAcc-y;
  r=Math.round(r*1000)/1000;cDisp=String(r);cAcc=r;cShow();}
function cO(op){if(cOp!==null&&!cFresh)cCompute();cAcc=parseFloat(cDisp);cOp=op;cFresh=true;cShow();}
function cEq(){if(cOp!==null){cCompute();cOp=null;cFresh=true;cShow();}}
function cClear(){cDisp='0';cAcc=null;cOp=null;cFresh=true;cShow();}
function calcHTML(){const b=(x,f,c)=>`<button class="cbtn ${c||''}" onclick="${f}">${x}</button>`;
  return `<div class="calc"><div class="calcdisp" id="cd">${cDisp}</div><div class="calcgrid">
   ${b('7','cD(7)')}${b('8','cD(8)')}${b('9','cD(9)')}${b('÷',"cO('÷')",'op')}
   ${b('4','cD(4)')}${b('5','cD(5)')}${b('6','cD(6)')}${b('×',"cO('×')",'op')}
   ${b('1','cD(1)')}${b('2','cD(2)')}${b('3','cD(3)')}${b('−',"cO('−')",'op')}
   ${b('C','cClear()','op')}${b('0','cD(0)')}${b('00',"cD('00')")}${b('=','cEq()','op')}</div></div>`;}
function ckBtn(label,fn){return `<div style="text-align:center;margin-top:6px"><button class="btn big" onclick="${fn}">${label}</button></div>`;}

/* ===== 1단계 · 묶어 세기 ===== */
let g1={mode:0,m:0}; // m: 0=3개씩, 1=6개씩, 2=완료
function render1(){
  const M=[{k:3,ans:4},{k:6,ans:2}][Math.min(g1.m,1)];
  $('#readout').innerHTML= g1.m<2
    ? `<div class="nm">달걀 12개가 왔어요! 묶으면 세기 쉬워져요</div><div class="big">달걀을 <b>${M.k}개씩</b> 묶으면 몇 팩이 될까요?</div>`
    : `<div class="nm">묶어도 풀어도 달걀은 12개!</div><div class="big">묶음이 <b>클수록</b> 팩 수는 <b>줄어요</b></div>`;
  let eggs='';
  if(g1.mode===0){eggs=`<div class="eggs">${'<span class="egg">🥚</span>'.repeat(12)}</div>`;}
  else{const packs=12/g1.mode;eggs=`<div class="eggs">`+Array.from({length:packs},()=>`<div class="pack">${'<span class="egg">🥚</span>'.repeat(g1.mode)}</div>`).join('')+`</div>`;}
  let quiz='';
  if(g1.m<2&&g1.mode===M.k){
    quiz=`<div class="cap"><b>몇 팩</b>이 되었나요?</div><div class="row">`+[2,3,4,6].map(n=>`<button class="btn" style="font-size:16px;font-weight:800;min-width:56px" onclick="g1ans(${n})">${n}팩</button>`).join('')+`</div>`;}
  $('#body').innerHTML=`<div class="card">
    <div class="lbl">🥚 버튼을 눌러 묶거나 풀어 보세요</div>${eggs}
    <div class="row">
      <button class="btn" onclick="g1mode(3)">3개씩 묶기</button>
      <button class="btn" onclick="g1mode(6)">6개씩 묶기</button>
      <button class="btn" onclick="g1mode(4)">4개씩 묶기</button>
      <button class="btn" onclick="g1mode(0)">🧺 다시 풀기</button></div>
    ${quiz}
    <div class="cap">묶음 = 새로운 <b>단위</b>! 낱개로 세지 않고 <b>팩으로</b> 셀 수 있어요.</div></div>`;
}
function g1mode(k){g1.mode=k;plog('groupMode',{k});render1();}
function g1ans(n){const M=[{k:3,ans:4},{k:6,ans:2}][Math.min(g1.m,1)];
  plog(n===M.ans?'groupOk':'groupRetry',{k:M.k,pick:n});
  if(n===M.ans){
    if(g1.m===0){banner('맞았어요! 3개씩 4팩 🥚','12 = 3씩 <b>4묶음</b>. 이제 풀고, <b>6개씩</b>도 묶어 볼까요?',[['풀고 6개씩!',()=>{hideBanner();g1={mode:0,m:1};render1();}]]);}
    else{g1.m=2;banner('맞았어요! 6개씩 2팩 🥚','같은 12개인데 <b>3개씩=4팩, 6개씩=2팩</b> — 묶음이 클수록 팩 수는 줄어요! 묶어도 풀어도 달걀은 12개.',[['2단계로 →',()=>{hideBanner();stage=2;render();plog('enter');}]]);}
  } else banner('다시 한번 도전해볼까요?','팩(묶음)의 수를 세어 보세요.',[['다시',hideBanner]]);}

/* ===== 2단계 · 뛰어 세기 ===== */
let g2={opened:0,q:0};
function render2(){
  if(g2.q===0){
    $('#readout').innerHTML=`<div class="nm">사과가 <b>4개씩</b> 든 봉지 5개!</div><div class="big">봉지를 차례로 눌러 <b>묶음으로</b> 세어 보세요</div>`;
    const seq=Array.from({length:g2.opened},(_,i)=>(i+1)*4).join(' → ');
    $('#body').innerHTML=`<div class="card">
      <div class="bags">`+Array.from({length:5},(_,i)=>`<div class="bag ${i<g2.opened?'opened':''}" onclick="g2bag(${i})">🍎<br>4개</div>`).join('')+`</div>
      <div class="jump">${seq?seq.replace(/(\d+)$/,'<b>$1</b>'):' '}</div>
      ${g2.opened>=5?`<div class="cap">낱개로 안 세도 돼요! <b>사과는 모두 몇 개?</b></div>${calcHTML()}${ckBtn('확인','g2check(20)')}`:`<div class="cap">4, 8, 12, … <b>4씩 뛰어 세기</b>!</div>`}
    </div>`;
  } else {
    $('#readout').innerHTML=`<div class="nm">이번엔 반대로 — 낱개를 묶음으로!</div><div class="big">사과 <b>24개</b>를 <b>6개씩</b> 담으면 몇 봉지?</div>`;
    $('#body').innerHTML=`<div class="card"><div class="eggs">${'<span class="egg">🍎</span>'.repeat(24)}</div>
      <div class="cap">계산기로: 24 ÷ 6</div>${calcHTML()}${ckBtn('확인 (봉지)','g2check(4)')}</div>`;
  }
}
function g2bag(i){if(i===g2.opened&&g2.opened<5){g2.opened++;plog('bagOpen',{n:g2.opened});render2();}}
function g2check(ans){cEq();const v=Math.round(parseFloat(cDisp)||0);
  plog(v===ans?'jumpOk':'jumpRetry',{q:g2.q,val:v});
  if(v===ans){
    if(g2.q===0){banner('맞았어요! 4개씩 5봉지 = 20개 🍎','4×5=20 — <b>묶음으로 세면</b> 곱셈이 돼요!',[['다음 문제 →',()=>{hideBanner();g2.q=1;cClear();render2();}]]);}
    else{banner('맞았어요! 24÷6 = 4봉지 🍎','묶으면(÷) 봉지 수, 풀면(×) 낱개 수 — <b>서로 되돌릴 수 있어요!</b>',[['3단계로 →',()=>{hideBanner();stage=3;cClear();render();plog('enter');}]]);}
  } else banner('다시 한번 도전해볼까요?',g2.q===0?'봉지마다 4개씩, 봉지는 5개예요.':'24를 6씩 묶으면 몇 묶음일까요?',[['다시',hideBanner]]);}

/* 숫자 입력 패드(계산 기능 없음) */
let mAns='';
function ansHTML(){return `<div class="calc"><div class="calcdisp" id="ad">${mAns||'0'}</div><div class="calcgrid">`+
 ['7','8','9','4','5','6','1','2','3','0','00','⌫'].map(k=>`<button class="cbtn" onclick="aK('${k}')">${k}</button>`).join('')+`</div></div>`;}
function aK(k){if(k==='⌫')mAns=mAns.slice(0,-1);else if(mAns.length<6)mAns+=k;const d=$('#ad');if(d)d.textContent=mAns||'0';}

/* ===== 3단계 · 하나에 얼마? (단위비율·암산) ===== */
let g3={q:0};
function render3(){
  if(g3.q===0){
    $('#readout').innerHTML=`<div class="nm">가격표엔 묶음 값만 있네요!</div><div class="big">귤 <b>3개에 1,200원</b> — <b>1개</b>는 얼마?</div>`;
    $('#body').innerHTML=`<div class="card"><div class="shop"><div class="item"><div class="em">🍊🍊🍊</div><div class="pr">3개 ${won(1200)}</div></div></div>
      <div class="cap">계산기 없이 <b>머릿속으로</b>! 1,200원을 3으로 나누면? 답만 눌러요.</div>${ansHTML()}${ckBtn('확인 (원)','g3check(400)')}</div>`;
  } else {
    $('#readout').innerHTML=`<div class="nm">1개 값(단위 가격)을 알면 뭐든 구해요!</div><div class="big">그럼 귤 <b>5개</b>를 사면 얼마?</div>`;
    $('#body').innerHTML=`<div class="card"><div class="shop"><div class="item"><div class="em">🍊×5</div><div class="pr">1개 = ${won(400)}</div></div></div>
      <div class="cap">이번에도 머릿속으로! 400원이 5개면? 답만 눌러요.</div>${ansHTML()}${ckBtn('확인 (원)','g3check(2000)')}</div>`;
  }
}
function g3check(ans){const v=parseInt(mAns||'0',10);
  plog(v===ans?'unitOk':'unitRetry',{q:g3.q,val:v});
  if(v===ans){
    if(g3.q===0){banner('맞았어요! 1개 = 400원 🍊','1200÷3=400 — 이게 <b>1개의 값(단위 가격)</b>이에요!',[['다음 →',()=>{hideBanner();g3.q=1;mAns='';render3();}]]);}
    else{banner('맞았어요! 5개 = 2,000원 🍊','1개 값만 알면 <b>몇 개든</b> 구할 수 있어요 (400×5).',[['4단계로 →',()=>{hideBanner();stage=4;mAns='';cClear();render();plog('enter');}]]);}
  } else banner('다시 한번 도전해볼까요?',g3.q===0?'3개가 1,200원 — 1개는 나누면?':'1개 400원이 12개!',[['다시',hideBanner]]);}

/* ===== 4단계 · 어디가 더 싸? ===== */
const G4=[
 {em:'🥛',name:'우유',a:{n:5,p:4500},b:{n:7,p:5950},ansB:true},   // 900 vs 850 → B
 {em:'🧃',name:'주스',a:{n:4,p:3200},b:{n:5,p:4250},ansB:false},  // 800 vs 850 → A
];
let g4={q:0};
function render4(){
  const P=G4[g4.q];
  $('#readout').innerHTML=`<div class="nm">진짜 마트 문제! (${g4.q+1}/2)</div><div class="big">${P.name}, <b>어느 마트</b>가 더 쌀까요?</div>`;
  $('#body').innerHTML=`<div class="card"><div class="shop">
      <div class="item pick" onclick="g4pick(false)"><div class="em">${P.em}</div><div class="lbl">A마트</div><div class="pr">${P.a.n}개 ${won(P.a.p)}</div></div>
      <div class="item pick" onclick="g4pick(true)"><div class="em">${P.em}</div><div class="lbl">B마트</div><div class="pr">${P.b.n}개 ${won(P.b.p)}</div></div></div>
    <div class="cap"><b>1개 값</b>을 계산해서 비교해 보고, 더 싼 마트를 눌러요!</div>
    ${calcHTML()}</div>`;
}
function g4pick(isB){const P=G4[g4.q];const ok=(isB===P.ansB);
  const ua=P.a.p/P.a.n,ub=P.b.p/P.b.n;
  plog(ok?'compareOk':'compareRetry',{q:g4.q,pick:isB?'B':'A'});
  if(ok){
    const nxt=g4.q+1<G4.length;
    banner(`맞았어요! ${isB?'B':'A'}마트가 더 싸요 ${P.em}`,`1개 값: A ${won(ua)} vs B ${won(ub)} — <b>단위 가격</b>으로 만들면 비교할 수 있어요!`,
      nxt?[['다음 문제 →',()=>{hideBanner();g4.q++;cClear();render4();}]]:[['5단계 — 할인의 비밀 →',()=>{hideBanner();stage=5;cClear();render();plog('enter');}]]);
  } else banner('다시 한번 도전해볼까요?',`두 마트의 <b>1개 값</b>을 각각 계산해 비교해 보세요.`,[['다시',hideBanner]]);}

/* ===== 5단계 · 할인의 비밀 (백분율) ===== */
let g5={q:0,step:0};
function render5(){
  if(g5.q===0){
    if(g5.step===0){
      $('#readout').innerHTML=`<div class="nm">오늘의 특가! <span class="sale">25% 할인</span></div><div class="big">${won(4000)} 우유 — <b>얼마나</b> 깎아 줄까요?</div>`;
      $('#body').innerHTML=`<div class="card"><div class="shop"><div class="item"><div class="em">🥛</div><div class="pr">${won(4000)} <span class="sale">25%↓</span></div></div></div>
        <div class="cap">할인율은 <b>원래 가격을 100</b>으로 볼 때 깎는 부분! 4000 × 25 ÷ 100</div>${calcHTML()}${ckBtn('확인 — 할인 금액(원)','g5check(1000)')}</div>`;
    } else {
      $('#readout').innerHTML=`<div class="nm">할인 금액은 1,000원!</div><div class="big">그럼 <b>얼마를 내면</b> 될까요?</div>`;
      $('#body').innerHTML=`<div class="card"><div class="shop"><div class="item"><div class="em">🥛</div><div class="pr"><s style="color:#999">${won(4000)}</s> − ${won(1000)}</div></div></div>
        <div class="cap">계산기로: 4000 − 1000</div>${calcHTML()}${ckBtn('확인 — 낼 돈(원)','g5check(3000)')}</div>`;
    }
  } else {
    if(g5.step===0){
      $('#readout').innerHTML=`<div class="nm">이번엔 반대로! 가방이 ${won(5000)} → ${won(4000)}</div><div class="big">얼마나 <b>깎였나요</b>?</div>`;
      $('#body').innerHTML=`<div class="card"><div class="shop"><div class="item"><div class="em">🎒</div><div class="pr"><s style="color:#999">${won(5000)}</s> → ${won(4000)}</div></div></div>
        <div class="cap">계산기로: 5000 − 4000</div>${calcHTML()}${ckBtn('확인 — 할인 금액(원)','g5check(1000)')}</div>`;
    } else {
      $('#readout').innerHTML=`<div class="nm">1,000원이 깎였어요</div><div class="big">할인율은 <b>몇 %</b>일까요?</div>`;
      $('#body').innerHTML=`<div class="card"><div class="shop"><div class="item"><div class="em">🎒</div><div class="pr">${won(1000)} ÷ ${won(5000)}</div></div></div>
        <div class="cap">원래 가격(5000)을 100으로! 1000 ÷ 5000 × 100</div>${calcHTML()}${ckBtn('확인 — 할인율(%)','g5check(20)')}</div>`;
    }
  }
}
function g5check(ans){cEq();const v=Math.round(parseFloat(cDisp)||0);
  plog(v===ans?'discountOk':'discountRetry',{q:g5.q,step:g5.step,val:v});
  if(v!==ans){banner('다시 한번 도전해볼까요?','안내된 식을 계산기로 눌러 보세요. (C로 지우기)',[['다시',hideBanner]]);return;}
  if(g5.q===0&&g5.step===0){banner('맞았어요! 할인 금액 1,000원','25%란 <b>100으로 나눈 것 중 25</b> — 4000×25÷100=1000!',[['계속 →',()=>{hideBanner();g5.step=1;cClear();render5();}]]);}
  else if(g5.q===0){banner('맞았어요! 3,000원만 내면 돼요 🥛','4000−1000=3000. 할인 금액을 빼면 <b>낼 돈</b>!',[['다음 문제 →',()=>{hideBanner();g5={q:1,step:0};cClear();render5();}]]);}
  else if(g5.step===0){banner('맞았어요! 1,000원 깎였어요','이제 이 1,000원이 원래 가격의 <b>몇 %</b>인지 구해요.',[['계속 →',()=>{hideBanner();g5.step=1;cClear();render5();}]]);}
  else{try{parent.postMessage({type:'martLabDone'},'*');}catch(e){}
    banner('맞았어요! 20% 할인 🎉','1000÷5000×100=20 — <b>원래 가격을 100으로</b> 볼 때 20만큼! 색상 실험실의 100칸과 같은 비밀이죠.',[['마트의 비밀 완성! 🛒',hideBanner]]);}}

function render(){renderStage();({1:render1,2:render2,3:render3,4:render4,5:render5}[stage])();}
render();
</script>
