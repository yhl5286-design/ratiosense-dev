<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>소리의 비밀 찾기</title>
<style>
  :root{--bg:#f4f1ea;--card:#fff;--ink:#26303f;--sub:#6b7683;--line:#e6e1d6;--accent:#2e9e63;--gold:#e0a02a;--r:16px;--shadow:0 6px 20px rgba(0,0,0,.07)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  .wrap{max-width:700px;margin:0 auto;padding:12px 12px 40px}
  h1{font-size:19px;margin:4px 0 2px}.muted{color:var(--sub);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:13px;margin:10px 0}
  .lbl{font-size:12px;color:var(--sub);margin-bottom:6px}
  .seg{display:flex;gap:6px}.seg button{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 4px;font-weight:700;font-size:12px;cursor:pointer}
  .seg button.active{border-color:var(--ink);background:#fbf6e8}
  .readout{background:#1f2a3d;color:#fff;border:none;text-align:center}
  .readout .big{font-size:21px;font-weight:800;margin:2px 0}.readout .big b{color:#ffd966}.readout .nm{font-size:13px;color:#cdd6e4}
  .keys8{display:flex;gap:4px;justify-content:center;margin-top:8px}
  .k8{flex:1;max-width:62px;height:96px;border:1px solid #cdc6b8;border-radius:0 0 8px 8px;background:linear-gradient(#fff,#f3efe6);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:8px;cursor:pointer;font-weight:800;transition:.08s}
  .k8:active,.k8.play{background:linear-gradient(#fff6df,#ffe9ad);transform:translateY(2px)}.k8 .do{color:#c0392b}.k8 .hz{font-size:10px;color:var(--sub);font-weight:600;margin-top:3px}
  .piano1{position:relative;margin:0 auto}
  .wkey1{position:absolute;bottom:0;width:40px;height:112px;border:1px solid #cdc6b8;border-top:none;border-radius:0 0 7px 7px;background:linear-gradient(#fff,#f1ede4);cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:9px;font-weight:800;font-size:13px;transition:.06s}
  .wkey1:active,.wkey1.play{background:linear-gradient(#fff2cf,#ffe39c);transform:translateY(2px)}
  .wkey1 .do{color:#c0392b}
  .bkey1{position:absolute;top:0;width:26px;height:68px;background:linear-gradient(#3a3f47,#191d23);border-radius:0 0 4px 4px;z-index:3;pointer-events:none}
  .pianoWrap{overflow-x:auto;padding:4px 2px}
  .piano2{position:relative;height:150px;display:inline-block}
  .wkey{position:absolute;bottom:0;width:30px;height:150px;border:1px solid #cdc6b8;border-radius:0 0 6px 6px;background:linear-gradient(#fff,#f3efe6);cursor:pointer;transition:.08s;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:6px;font-size:11px;font-weight:700}
  .wkey:active,.wkey.play{background:linear-gradient(#fff6df,#ffe9ad)}
  .wkey.base{background:linear-gradient(#eaf7ef,#d6efdf);box-shadow:inset 0 0 0 3px var(--accent)}.wkey.sel{box-shadow:inset 0 0 0 3px var(--gold)}.wkey .do{color:#c0392b}
  .basetag{position:absolute;top:-1px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;font-size:9px;font-weight:800;padding:2px 5px;border-radius:6px;white-space:nowrap;z-index:5}
  .bkey{position:absolute;top:0;width:20px;height:92px;background:linear-gradient(#3a3f47,#20242b);border-radius:0 0 4px 4px;z-index:3;opacity:.85;pointer-events:none}
  .graph{display:flex;gap:2px;align-items:flex-end;height:140px;padding:6px 2px;overflow-x:auto;border-bottom:2px solid var(--line)}
  .bar{flex:0 0 auto;width:30px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
  .bar .b{width:20px;border-radius:5px 5px 0 0;background:#8fb0dd}.bar.base .b{background:var(--accent)}.bar.sel .b{background:var(--gold)}
  .bar .rt{font-size:9px;color:var(--sub);margin-bottom:2px}.bar .nm{font-size:10px;font-weight:700;margin-top:3px}
  table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid var(--line);padding:4px 5px;text-align:center}th{background:#f7f5ef;color:var(--sub)}td.simple{background:#eef7f1;font-weight:700;color:#136a3d}
  .cap{font-size:12px;color:var(--sub);text-align:center;margin-top:8px}.cap b{color:var(--ink)}
  canvas{width:100%;height:230px;display:block;background:#fbfaf6;border-radius:12px;border:1px solid var(--line)}
  input[type=range]{width:100%}
  .dialv{text-align:center;font-size:24px;font-weight:800;margin:4px}
  .meetinfo{text-align:center;font-size:15px;font-weight:700;margin-top:8px}.meetinfo b{color:var(--accent)}
  .btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 11px;font-weight:600;cursor:pointer;font-size:13px}
  .r3:hover{background:#fbf6e8}
  .calc{max-width:290px;margin:12px auto 4px}
  .calcdisp{background:#1f2a3d;color:#fff;font-size:28px;font-weight:800;text-align:right;padding:10px 16px;border-radius:10px;font-variant-numeric:tabular-nums;min-height:48px}
  .calcgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}
  .cbtn{padding:15px 0;font-size:19px;font-weight:800;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer}
  .cbtn:active{background:#f0ece2;transform:translateY(1px)}
  .cbtn.op{background:#f7f0dd;border-color:#e0c98a}
  .cbtn.wide{grid-column:span 2}
  #banner{position:absolute;left:10px;right:10px;display:none;z-index:60;transform:translateY(-50%)}
  #banner .in{max-width:700px;margin:0 auto;padding:14px 16px;border-radius:16px;box-shadow:0 14px 44px rgba(0,0,0,.28);font-weight:700;background:#e7f7ee;color:#136a3d;border-top:3px solid var(--accent)}
  #banner.show{display:block}#banner .sub{font-weight:600;font-size:13px;margin-top:4px}#banner .acts{margin-top:10px}

/* 3단계 하프 공방 */
.harp{background:#241a10;border-radius:14px;padding:14px 10px 10px;margin-top:8px}
.hbeam{height:13px;background:linear-gradient(#d9b26a,#8a6a34);border-radius:7px;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.hrow{display:flex;justify-content:space-around;align-items:flex-start;padding:0 6px}
.hcol{display:flex;flex-direction:column;align-items:center;width:44px}
.hs{width:4px;background:linear-gradient(#fff6dd,#c9b98a);border-radius:2px;cursor:pointer;box-shadow:0 0 4px rgba(255,240,200,.35)}
.hs.ghost{background:none;border-left:3px dashed #5a4a30;cursor:default;box-shadow:none}
.hs.test{background:linear-gradient(#ffe9a8,#e0a02a)}
.hs.pluck{animation:wig .35s}
@keyframes wig{20%{transform:translateX(3px)}50%{transform:translateX(-3px)}80%{transform:translateX(1.5px)}}
.hlab{margin-top:6px;font-size:13.5px;font-weight:800;color:#f0e9d8;text-align:center;line-height:1.3}
.hlab span{font-size:12px;color:#cbbfa8}
.hlab.ghost{color:#6a583a}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎼 소리의 비밀 찾기</h1>
  <div class="card"><div class="lbl">단계</div><div class="seg" id="stageSeg"></div></div>
  <div class="card readout" id="readout"></div>
  <div id="body"></div>
  <div class="muted" style="text-align:center;font-size:11px">소리의 비밀 찾기 · 순정률 · 2026-07-07</div>
</div>
<div id="banner"><div class="in"><div id="bT"></div><div class="sub" id="bS"></div><div class="acts" id="bA"></div></div></div>

<script>
const NAMES=['도','레','미','파','솔','라','시'];
const DEG=[[1,1],[9,8],[5,4],[4,3],[3,2],[5,3],[15,8]];
const OCTS=[['낮은',1,2],['가운데',1,1]]; // 도레미파솔라시 ×2 (가운데 도 기준)
let NOTE=[]; OCTS.forEach(([lab,nm,dm])=>DEG.forEach(([n,d],i)=>NOTE.push({name:NAMES[i],oct:lab,num:n*nm,den:d*dm})));
NOTE.push({name:'도',oct:'높은',num:2,den:1});
const MIDDO=NOTE.findIndex(x=>x.oct==='가운데'&&x.name==='도');
const BLACK_AFTER=[0,1,3,4,5];
function gcd(a,b){return b?gcd(b,a%b):a;}
function reduce(n,d){const g=gcd(Math.round(n),Math.round(d))||1;return[Math.round(n)/g,Math.round(d)/g];}
const MIDHZ=262;
function freq(i){return MIDHZ*NOTE[i].num/NOTE[i].den;}
function baseToNote(i){const b=NOTE[baseIdx];return reduce(b.num*NOTE[i].den,NOTE[i].num*b.den);}
const INTV={'1:1':'유니즌','1:2':'옥타브','2:3':'완전5도','3:4':'완전4도','4:5':'장3도','5:6':'단3도','3:5':'장6도','5:8':'단6도','8:9':'장2도','8:15':'장7도','1:3':'옥타브+5도','1:4':'2옥타브','2:5':'옥타브+장3도','3:8':'옥타브+4도'};
let stage=1, baseIdx=MIDDO, sel=-1;
const $=s=>document.querySelector(s);
function jz(w,a,b){const c=w.charCodeAt(w.length-1);return ((c-0xAC00)%28>0)?a:b;}
function plog(ev,data){try{parent.postMessage({type:'pilotLog',lab:'harmony',event:ev,data:Object.assign({stage},data||{})},'*');}catch(e){}}
function keyLabel(i){const n=NOTE[i];return n.name+({'낮은':'˷','가운데':'','높은':'′','맨위':'″'}[n.oct]||'');}

function renderStage(){const el=$('#stageSeg');el.innerHTML='';
  [['1 · 진동수 느끼기',1],['2 · 화음의 비밀',2],['3 · 하프 공방',3]].forEach(([t,s])=>{
    const b=document.createElement('button');b.className=stage===s?'active':'';b.textContent=t;b.onclick=()=>{stage=s;sel=-1;liveOff();stopAll2();stop1();render();plog('enter');};el.appendChild(b);});}

/* ===== 파동 그리기 ===== */
function drawSine(ctx,cycles,x0,W,mid,amp,color,phase){ctx.beginPath();ctx.lineWidth=4;ctx.strokeStyle=color;
  for(let x=0;x<=W;x++){const y=mid-amp*Math.sin(x/W*cycles*2*Math.PI+(phase||0));x?ctx.lineTo(x0+x,y):ctx.moveTo(x0+x,y);}ctx.stroke();}
function drawMeet(cvId,a,b){const cv=$('#'+cvId);if(!cv)return;const rect=cv.getBoundingClientRect();
  const W=cv.width=Math.round(rect.width*2),H=cv.height=460;const ctx=cv.getContext('2d');ctx.clearRect(0,0,W,H);
  const pad=36,GW=W-pad*2,mid=H/2,amp=H*0.30;const periods=(a*b<=12)?2:1;
  drawSine(ctx,a*periods,pad,GW,mid-amp*0.55,amp,'#2e9e63');
  drawSine(ctx,b*periods,pad,GW,mid+amp*0.55,amp,'#e0a02a');
  ctx.setLineDash([8,8]);ctx.strokeStyle='#c0392b';ctx.lineWidth=2;ctx.fillStyle='#c0392b';
  for(let p=0;p<=periods;p++){const x=pad+GW*p/periods;ctx.beginPath();ctx.moveTo(x,16);ctx.lineTo(x,H-26);ctx.stroke();
    ctx.setLineDash([]);ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText('🤝',x,H-6);ctx.setLineDash([8,8]);}
  ctx.setLineDash([]);ctx.fillStyle='#2e9e63';ctx.font='bold 16px sans-serif';ctx.textAlign='left';ctx.fillText('기준음',pad+4,28);
  ctx.fillStyle='#b5810f';ctx.fillText('선택음',pad+4,H-32);}

/* ===== 1단계: 진동수 느끼기 ===== */
const OCT1=[['도',262],['레',295],['미',328],['파',349],['솔',393],['라',437],['시',491],['도',524]];
let f1=262, s1Req=null, s1T=0, plucks=[0,0,0,0,0,0,0,0], lastPluck=0;
const S1WW=40,S1GAP=3,S1STEP=43,S1PW=344; // 8*43
function render1(){
  $('#readout').innerHTML='<div class="nm">소리는 <b>떨림</b>이에요. 건반을 누르면 뒤쪽 현이 떨려요!</div><div class="big">진동수 = 1초에 떨린 <b>횟수</b></div>';
  let white='',black='';
  OCT1.forEach((o,i)=>{white+=`<div class="wkey1" style="left:${i*S1STEP}px" onclick="press1(${i})"><span class="${o[0]==='도'?'do':''}">${o[0]}</span></div>`;});
  [0,1,3,4,5].forEach(w=>{black+=`<div class="bkey1" style="left:${w*S1STEP+S1WW-9+S1GAP}px"></div>`;});
  $('#body').innerHTML=`<div class="card"><div class="lbl">🎹 그랜드 피아노 — 건반을 누르면 <b>뒤쪽 현</b>이 떨려요 (높은음 = 짧고 빠른 현)</div>
     <canvas id="harp" style="height:210px;width:${S1PW}px;display:block;margin:0 auto;background:#241610;border-radius:12px 12px 0 0"></canvas>
     <div class="piano1" style="width:${S1PW}px;height:112px">${white}${black}</div></div>
   <div class="card"><div class="lbl">🌊 그 떨림이 만드는 <b>파동</b> — 왼쪽에서 오른쪽으로 흘러요</div>
     <canvas id="w1" style="height:150px"></canvas>
     <div class="dialv" id="hz1" style="font-size:20px">이 음은 1초에 <b>${OCT1[lastPluck][1]}번</b> 떨려요</div>
     <div class="cap">실제론 너무 빨라서(1초에 수백 번!) <b>천천히</b> 보여드려요.</div></div>`;
  start1();
}
function updateHz1(){const h=$('#hz1');if(h)h.innerHTML=`이 음은 1초에 <b>${Math.round(f1)}번</b> 떨려요`;}
function start1(){if(s1Req)cancelAnimationFrame(s1Req);s1T=0;loop1();}
function stop1(){if(s1Req){cancelAnimationFrame(s1Req);s1Req=null;}}
function loop1(){s1T++;for(let i=0;i<8;i++)if(plucks[i]>.001)plucks[i]*=.988;drawHarp();drawW1();s1Req=requestAnimationFrame(loop1);}
function drawHarp(){const cv=$('#harp');if(!cv)return;const rect=cv.getBoundingClientRect();const W=cv.width=Math.round(rect.width*2),H=cv.height=Math.round(rect.height*2);const ctx=cv.getContext('2d');ctx.clearRect(0,0,W,H);
  const sc=W/S1PW,yBot=H-14,maxLen=H-28;
  ctx.fillStyle='#6b4a2a';ctx.fillRect(0,yBot,W,H-yBot);
  OCT1.forEach((o,i)=>{const f=o[1],cx=(i*S1STEP+S1WW/2)*sc,len=maxLen*(262/f),yTop=yBot-len,amp=S1WW*0.5*sc*plucks[i],vf=f/45,ph=2*Math.PI*vf*(s1T/60),active=plucks[i]>.03;
    ctx.beginPath();ctx.lineWidth=active?3.5:2;ctx.strokeStyle=active?'#ffd24a':'#9c8557';
    for(let y=yTop;y<=yBot;y++){const dx=amp*Math.sin(Math.PI*(y-yTop)/len)*Math.cos(ph);(y===yTop)?ctx.moveTo(cx+dx,y):ctx.lineTo(cx+dx,y);}ctx.stroke();
    ctx.fillStyle='#cdb98a';ctx.beginPath();ctx.arc(cx,yTop,4,0,7);ctx.fill();});}
function drawW1(){const cv=$('#w1');if(!cv)return;const rect=cv.getBoundingClientRect();const W=cv.width=Math.round(rect.width*2),H=cv.height=300;const ctx=cv.getContext('2d');ctx.clearRect(0,0,W,H);
  const mid=H/2,amp=H*0.34,pad=24,L=W-pad*2,cycles=Math.max(3,Math.round(f1/45)),color=f1>360?'#c0392b':(f1>240?'#e0a02a':'#3b6db5');
  const shift=(s1T*2.4)%(L/cycles);
  ctx.beginPath();ctx.lineWidth=4;ctx.strokeStyle=color;
  for(let x=0;x<=L;x++){const y=mid-amp*Math.sin((x-shift)/L*cycles*2*Math.PI);x?ctx.lineTo(pad+x,y):ctx.moveTo(pad+x,y);}ctx.stroke();}
function press1(i){f1=OCT1[i][1];plucks[i]=1;lastPluck=i;updateHz1();tone(f1,0,1.1);plog('key1',{note:OCT1[i][0],hz:OCT1[i][1]});
  const k=document.querySelectorAll('.wkey1')[i];if(k){k.classList.add('play');setTimeout(()=>k.classList.remove('play'),160);}}

/* ===== 2단계: 피아노 + 비 + 만남점 ===== */
function render2(){const WW=30,GAP=2,STEP=WW+GAP;
  let white='';NOTE.forEach((n,i)=>{const left=i*STEP;
    white+=`<div class="wkey ${i===baseIdx?'base':''} ${i===sel?'sel':''}" style="left:${left}px" onclick="pick2(${i})">${i===baseIdx?'<span class="basetag">★기준</span>':''}<span class="${n.name==='도'?'do':''}">${n.name}</span></div>`;});
  let black='';NOTE.forEach((n,i)=>{const oi=OCTS.findIndex(o=>o[0]===n.oct);const within=NAMES.indexOf(n.name);
    if(oi>=0&&BLACK_AFTER.includes(within))black+=`<div class="bkey" style="left:${i*STEP+WW-10+GAP}px"></div>`;});
  const piano=`<div class="pianoWrap"><div class="piano2" style="width:${NOTE.length*STEP+6}px">${white}${black}</div></div>`;
  const hasSel=sel>=0;
  const meet=hasSel?`<div class="card"><div class="lbl">🌊 흐르는 만남점 — <b>잘 어울릴수록 🤝 만남점이 자주 지나가요</b> (누르면 1초 쉬고 2초 울려요)</div>
     <canvas id="cv2"></canvas>
     <div id="verdict2" style="text-align:center;margin-top:8px"></div>
     <div class="meetinfo" id="mi2"></div>
     <div class="cap">숫자가 <b>작을수록(자주 만날수록) 잘 어울려요</b>. 큰 숫자 = 가끔 만남 = 거칠어요.</div></div>`
    :`<div class="card"><div class="cap">흰 건반을 누르면 <b>1초 쉬고 2초 동안</b> 기준음과 선택음이 함께 울리고, 파동이 왼쪽에서 오른쪽으로 흘러요.</div></div>`;
  $('#body').innerHTML=`<div class="card">
     <div style="font-size:17px;font-weight:800;line-height:1.6;margin-bottom:8px">Ⓠ <b style="color:var(--accent)">★가운데 도</b>를 기준으로 <b>진동수의 비</b>가 어떻게 되는지 건반을 눌러 보세요!</div>
     <div class="lbl">흰 건반만 눌러요 — 누르면 가운데 도와 함께 울려요.</div>${piano}</div>
   ${meet}`;
  updateReadout();
  if(hasSel)drawMeetAnim();
}
let seqT1=null;
function pick2(i){sel=i;render();scheduleSeq();const r=baseToNote(i);plog('pick',{note:keyLabel(i),base:keyLabel(baseIdx),ratio:r[0]+':'+r[1]});}
function scheduleSeq(){stopSeq();const bf=freq(baseIdx),nf=sel!==baseIdx?freq(sel):null;
  seqT1=setTimeout(()=>{seqT1=null;playChord3(bf,nf);startAnim();},1000);}
function stopSeq(){if(seqT1){clearTimeout(seqT1);seqT1=null;}stopAnim();stopChord3();}
function setBase(){if(sel>=0){stopAll2();baseIdx=sel;sel=-1;render();plog('setBase',{base:keyLabel(baseIdx)});}}
function updateReadout(){if(sel>=0){const [a,b]=baseToNote(sel);const nm=INTV[`${Math.min(a,b)}:${Math.max(a,b)}`]||'';const hb=Math.round(freq(baseIdx)),hn=Math.round(freq(sel));
    $('#readout').innerHTML=`<div class="nm">★기준 ${keyLabel(baseIdx)} ${hb}Hz 과 ${keyLabel(sel)} ${hn}Hz</div><div class="big">${hb} : ${hn} = <b>${a} : ${b}</b>${nm?' · '+nm:''}</div>`;}
  else $('#readout').innerHTML=`<div class="nm">★기준음 = ${keyLabel(baseIdx)} ${Math.round(freq(baseIdx))}Hz · 다른 흰 건반을 눌러 화음과 파동을 보세요</div><div class="big">기준음과의 비</div>`;}
/* 흐르는 만남점 애니메이션 */
let animReq=null, animT=0, animTimer=null;
function startAnim(){stopAnim();animT=0;animLoop();animTimer=setTimeout(stopAnim,2000);}
function stopAnim(){if(animReq){cancelAnimationFrame(animReq);animReq=null;}if(animTimer){clearTimeout(animTimer);animTimer=null;}}
function animLoop(){animT+=2.2;drawMeetAnim();animReq=requestAnimationFrame(animLoop);}
function stopAll2(){stopSeq();chordOff();}
function consonance(a,b){const p=a*b;
  if(p<=6)return{e:'😍',t:'아주 잘 어울려요',c:'#2e9e63',lv:3};
  if(p<=20)return{e:'😊',t:'잘 어울려요',c:'#4a9e63',lv:2};
  if(p<=42)return{e:'😐',t:'조금 거칠어요',c:'#e0a02a',lv:1};
  return{e:'😖',t:'거칠어요 (안 어울림)',c:'#c0392b',lv:0};}
function drawMeetAnim(){const cv=$('#cv2');if(!cv||sel<0){stopAnim();return;}
  const rect=cv.getBoundingClientRect();const W=cv.width=Math.round(rect.width*2),H=cv.height=440;const ctx=cv.getContext('2d');ctx.clearRect(0,0,W,H);
  const [a,b]=baseToNote(sel);const pad=30,GW=W-pad*2,mid=H/2,amp=H*0.28;
  const BC=8,tau=animT/70; // 창에 기준음 진동 8번 고정 → 협화도에 따라 만남점 밀도가 달라짐. 오른쪽으로 흐름
  function cx(x){return tau+BC*(1-x/GW);}
  function wave(rate,color,ys){ctx.beginPath();ctx.lineWidth=4;ctx.strokeStyle=color;for(let x=0;x<=GW;x++){const y=mid+ys-amp*Math.sin(2*Math.PI*cx(x)*rate);x?ctx.lineTo(pad+x,y):ctx.moveTo(pad+x,y);}ctx.stroke();}
  wave(1,'#2e9e63',-amp*0.6);wave(b/a,'#e0a02a',amp*0.6);
  ctx.setLineDash([7,7]);ctx.strokeStyle='#c0392b';ctx.lineWidth=2;ctx.fillStyle='#c0392b';
  const mS=Math.ceil(tau/a),mE=Math.floor((tau+BC)/a);
  for(let m=mS;m<=mE;m++){const c=m*a,x=(1-(c-tau)/BC)*GW;if(x<0||x>GW)continue;ctx.beginPath();ctx.moveTo(pad+x,14);ctx.lineTo(pad+x,H-26);ctx.stroke();ctx.setLineDash([]);ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.fillText('🤝',pad+x,H-4);ctx.setLineDash([7,7]);}
  ctx.setLineDash([]);ctx.fillStyle='#2e9e63';ctx.font='bold 15px sans-serif';ctx.textAlign='left';ctx.fillText('기준음 '+Math.round(freq(baseIdx))+'Hz',pad+4,26);
  ctx.fillStyle='#b5810f';ctx.fillText('선택음 '+Math.round(freq(sel))+'Hz',pad+4,H-30);
  const con=consonance(a,b),nm=INTV[`${Math.min(a,b)}:${Math.max(a,b)}`]||'';
  const v=$('#verdict2');if(v){const w=Math.max(6,Math.min(100,Math.round(100-Math.log2(a*b)*15)));
    v.innerHTML=`<div style="font-size:20px;font-weight:800;color:${con.c}">${con.e} ${con.t}</div><div style="height:12px;border-radius:6px;background:#ececec;overflow:hidden;margin:6px auto 0;max-width:280px"><div style="height:100%;width:${w}%;background:${con.c};transition:.2s"></div></div>`;}
  const mi=$('#mi2');if(mi)mi.innerHTML=`기준 <b>${a}번</b>·선택 <b>${b}번</b>마다 만남 → <b>${a}:${b}</b>${nm?' · '+nm:''} — ${con.lv>=2?'<b style="color:#2e9e63">자주 만나요</b>':'<b style="color:#c0392b">가끔 만나요</b>'}`;}

/* ===== 계산기 (공용) ===== */
let cDisp='0', cAcc=null, cOp=null, cFresh=true;
function cShow(){const d=$('#cd');if(d)d.textContent=cDisp;}
function cD(d){if(cFresh){cDisp=String(d);cFresh=false;}else{cDisp=(cDisp==='0'?'':cDisp)+d;}cShow();}
function cDot(){if(cFresh){cDisp='0.';cFresh=false;}else if(!cDisp.includes('.'))cDisp+='.';cShow();}
function cCompute(){const y=parseFloat(cDisp);let r=cAcc;if(cOp==='×')r=cAcc*y;else if(cOp==='÷')r=cAcc/y;r=Math.round(r*1000)/1000;cDisp=String(r);cAcc=r;cShow();}
function cO(op){if(cOp!==null&&!cFresh)cCompute();cAcc=parseFloat(cDisp);cOp=op;cFresh=true;}
function cEq(){if(cOp!==null){cCompute();cOp=null;cFresh=true;cShow();}}
function cClear(){cDisp='0';cAcc=null;cOp=null;cFresh=true;cShow();}
function calcHTML(){const b=(x,f,c)=>`<button class="cbtn ${c||''}" onclick="${f}">${x}</button>`;
  return `<div class="calc"><div class="calcdisp" id="cd">${cDisp}</div><div class="calcgrid">
   ${b('7','cD(7)')}${b('8','cD(8)')}${b('9','cD(9)')}${b('÷',"cO('÷')",'op')}
   ${b('4','cD(4)')}${b('5','cD(5)')}${b('6','cD(6)')}${b('×',"cO('×')",'op')}
   ${b('1','cD(1)')}${b('2','cD(2)')}${b('3','cD(3)')}${b('C','cClear()','op')}
   ${b('0','cD(0)')}${b('.','cDot()')}${b('=','cEq()','op wide')}</div></div>`;}

/* ===== 3단계: 하프 공방 — 5음계 줄 만들기 ===== */
const HBASE=81; // 도 줄 길이(cm) — 분수 계산이 딱 떨어지는 마법의 수
const HP=[{n:'레',a:8,b:9},{n:'미',a:64,b:81},{n:'솔',a:2,b:3},{n:'라',a:16,b:27},{n:'도′',a:1,b:2}];
let hDone=[], hI=0, tstL=81;
function hLen(i){return HBASE*HP[i].a/HP[i].b;}
function hFreq(L){return Math.round(262*HBASE/L);}
function pluck(f,w){const c=ac(),t0=c.currentTime+(w||0);
  [[f,.22],[f*2,.07],[f*3,.03]].forEach(([ff,v])=>{const o=c.createOscillator(),g=c.createGain();
    o.type='triangle';o.frequency.value=ff;o.connect(g);g.connect(c.destination);
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.008);
    g.gain.exponentialRampToValueAtTime(.001,t0+1.3);o.start(t0);o.stop(t0+1.35);});}
function hPluck(el,L,name){pluck(hFreq(L));plog('hPluck',{name});
  if(el){el.classList.remove('pluck');void el.offsetWidth;el.classList.add('pluck');}}
function fmtL(L){return (Math.round(L*10)/10)+'cm';}
function harpHTML(){
  const items=[{n:'도',L:HBASE,made:true,frac:'1'}].concat(HP.map((p,i)=>({n:p.n,L:hLen(i),made:hDone.includes(i),frac:p.a+'/'+p.b})));
  return `<div class="harp"><div class="hbeam"></div><div class="hrow">`+
    items.map(it=>`<div class="hcol">${it.made
      ?`<div class="hs" style="height:${Math.round(it.L*2.6)}px" onclick="hPluck(this,${it.L},'${it.n}')"></div><div class="hlab">${it.n}<br><span>${fmtL(it.L)}</span></div>`
      :`<div class="hs ghost" style="height:${Math.round(it.L*2.6)}px"></div><div class="hlab ghost">?<br><span>${it.frac}</span></div>`}</div>`).join('')+
  `</div></div>`;}
function tstUpd(v){tstL=+v;const e=$('#tst');if(e){e.style.height=Math.round(tstL*2.6)+'px';}
  const l=$('#tstlab');if(l)l.textContent=tstL+'cm';
  liveOn(262*HBASE/tstL);}
function render4(){
  const done=hDone.length,cur=HP[hI];
  $('#readout').innerHTML=`<div class="nm">🪕 하프 공방 — 도 줄 <b>${HBASE}cm</b>에서 시작! 5음계 줄을 만들어요 (${done}/${HP.length})</div><div class="big">${cur?`<b>${cur.n}</b> 줄은 도 줄의 <b>${cur.a}/${cur.b}</b> — <b>몇 cm</b>로 만들어야 할까요?`:'5음계 하프 완성!'}</div>`;
  if(done>=HP.length){
    $('#body').innerHTML=`<div class="card"><div class="lbl">🪕 완성! 줄을 눌러 연주해 보세요 — 짧을수록 높은 음!</div>${harpHTML()}
      <div style="text-align:center;margin-top:10px"><button class="btn" style="font-size:15px;padding:11px 20px" onclick="hSong()">🎶 아리랑 연주</button></div>
      <div class="cap">아리랑은 <b>5음계</b> 노래 — 내가 만든 하프로 진짜 노래가 돼요!</div></div>`;
    return;}
  $('#body').innerHTML=`<div class="card"><div class="lbl">🪕 나의 하프 — 만든 줄은 눌러서 소리 확인!</div>${harpHTML()}</div>
   <div class="card"><div class="lbl">🎚 시험 줄 — 손잡이를 움직여 <b>길이에 따라 음이 어떻게 변하는지</b> 들어 보세요</div>
     <div class="harp" style="display:inline-block;padding:12px 26px 8px;margin-left:calc(50% - 60px)"><div class="hbeam" style="width:60px"></div>
       <div class="hcol" style="width:60px"><div class="hs test" id="tst" style="height:${Math.round(tstL*2.6)}px"></div><div class="hlab" id="tstlab">${tstL}cm</div></div></div>
     <input type="range" id="tr" min="35" max="81" step="1" value="${tstL}" style="width:82%;display:block;margin:10px auto 2px">
   </div>
   <div class="card"><div style="background:#f4f0fb;border:1.5px solid #cbb8ec;border-radius:12px;padding:12px 14px;font-size:15.5px;line-height:1.9">
      ① <b>${cur.n}</b> 줄의 길이는 도 줄(<b>${HBASE}cm</b>)의 <b>${cur.b}분의 ${cur.a}</b>(${cur.a}/${cur.b})이에요.<br>
      ② <b style="font-size:17px;color:var(--ink)">${cur.n} = ${HBASE} × ${cur.a} ÷ ${cur.b} = ? cm</b></div>
    <div class="lbl" style="margin-top:8px">계산기로 구해 입력하면 줄이 매달려요!</div>
    ${calcHTML()}
    <div style="text-align:center;margin-top:6px"><button class="btn" style="font-size:15px;padding:11px 20px;background:#eaf7ef;border-color:#2e9e63;color:#136a3d;font-weight:800" onclick="hCut()">🪕 이 길이로 줄 매달기</button></div></div>`;
  const tr=$('#tr');
  if(tr){tr.oninput=e=>tstUpd(e.target.value);
    tr.onchange=()=>liveOff();tr.onpointerup=()=>liveOff();tr.onmouseup=()=>liveOff();tr.ontouchend=()=>liveOff();}
  cShow();
}
function hCut(){cEq();const cur=HP[hI],ex=hLen(hI),val=parseFloat(cDisp)||0;
  const ok=Math.abs(val-ex)<=0.3;
  plog(ok?'hOk':'hRetry',{note:cur.n,val,exact:Math.round(ex*10)/10});
  if(ok){hDone.push(hI);pluck(hFreq(ex));cClear();
    const last=hDone.length>=HP.length;
    if(last){try{parent.postMessage({type:'harmonyLabDone'},'*');}catch(e){}}
    banner(`${cur.n} 줄 완성! 🪕 ${Math.round(ex*10)/10}cm`,`도 줄 ${HBASE}cm의 ${cur.a}/${cur.b} = ${Math.round(ex*10)/10}cm — 뜯으면 딱 ${cur.n}!`,
      last?[['하프 완성! 🪕',()=>{hideBanner();render();}]]:[['다음 줄 →',()=>{hideBanner();hI++;render();}]]);}
  else banner('다시 계산해 볼까요?',`계산기로 <b>${HBASE} × ${cur.a} ÷ ${cur.b}</b> 를 눌러 보세요. (C로 지우기)`,[['다시',hideBanner]]);}
const MEL=[[332,.7],[442,.7],[442,.7],[393,.35],[442,.35],[524,.7],[442,.35],[524,.35],[442,.7],[393,.35],[332,.35],[295,.7],[262,1.1]];
function hSong(){let w=0;MEL.forEach(([f,d])=>{pluck(f,w);w+=d;});plog('hPlay',{});}

function render(){renderStage();({1:render1,2:render2,3:render4}[stage])();}
function placeBanner(b){let y;try{const fe=window.frameElement;
  if(fe){const r=fe.getBoundingClientRect(),ph=window.parent.innerHeight;
    const vt=Math.max(0,-r.top),vb=Math.min(r.height,ph-r.top);y=vt+(vb-vt)*0.55;}
  else{y=window.scrollY+window.innerHeight*0.6;}}catch(e){y=window.scrollY+window.innerHeight*0.6;}
  b.style.top=Math.max(90,Math.round(y))+'px';}
function banner(t,s,acts){const b=$('#banner');b.className='show';placeBanner(b);$('#bT').innerHTML=t;$('#bS').innerHTML=s||'';const ae=$('#bA');ae.innerHTML='';(acts||[]).forEach(([x,fn])=>{const q=document.createElement('button');q.className='btn';q.textContent=x;q.onclick=fn;ae.appendChild(q);});}
function hideBanner(){$('#banner').className='';}
/* 오디오 */
let AC;const ac=()=>AC||(AC=new(window.AudioContext||window.webkitAudioContext)());
function tone(f,w,d){const c=ac(),o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,c.currentTime+w);g.gain.linearRampToValueAtTime(.16,c.currentTime+w+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+w+d);o.start(c.currentTime+w);o.stop(c.currentTime+w+d);}
let lOsc,lGain;
function liveOn(f){const c=ac();if(!lOsc){lOsc=c.createOscillator();lGain=c.createGain();lGain.gain.value=0;lOsc.type='triangle';lOsc.connect(lGain);lGain.connect(c.destination);lOsc.start();}
  lOsc.frequency.setTargetAtTime(f,c.currentTime,.01);lGain.gain.setTargetAtTime(.16,c.currentTime,.01);}
function liveOff(){if(lGain)lGain.gain.setTargetAtTime(0,ac().currentTime,.06);}
function playChord(fA,fB,dur){const c=ac();dur=dur||1.3;[[fA,.18],[fB,.15]].forEach(([f,v])=>{if(!f)return;const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,c.currentTime);g.gain.linearRampToValueAtTime(v,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);o.start(c.currentTime);o.stop(c.currentTime+dur);});}
let cA,cB,cG;
function chordOn(fA,fB){const c=ac();if(!cA){cA=c.createOscillator();cB=c.createOscillator();cG=c.createGain();cG.gain.value=0;cA.type=cB.type='triangle';cA.connect(cG);cB.connect(cG);cG.connect(c.destination);cA.start();cB.start();}
  cA.frequency.setTargetAtTime(fA,c.currentTime,.008);cB.frequency.setTargetAtTime(fB,c.currentTime,.008);cG.gain.setTargetAtTime(.12,c.currentTime,.01);}
function chordOff(){if(cG)cG.gain.setTargetAtTime(0,ac().currentTime,.08);}
let chordNodes=null;
function playChord3(fA,fB){const c=ac();stopChord3();const dur=2,t=c.currentTime;const g=c.createGain();g.connect(c.destination);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.15,t+.03);g.gain.setValueAtTime(.15,t+dur-.35);g.gain.linearRampToValueAtTime(.0001,t+dur);
  const os=[];[fA,fB].forEach(f=>{if(!f)return;const o=c.createOscillator();o.type='triangle';o.frequency.value=f;o.connect(g);o.start(t);o.stop(t+dur+.05);os.push(o);});
  chordNodes={g,os};}
function stopChord3(){if(chordNodes){try{const c=ac();chordNodes.g.gain.cancelScheduledValues(c.currentTime);chordNodes.g.gain.setTargetAtTime(0,c.currentTime,.02);}catch(e){}chordNodes=null;}}
window.addEventListener('resize',()=>{if(stage===2&&sel>=0)drawMeetAnim();if(stage===1)drawW1();});
render();
</script>
