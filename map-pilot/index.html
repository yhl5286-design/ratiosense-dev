<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지도의 비밀</title>
<style>
  :root{--bg:#f4f1ea;--card:#fff;--ink:#26303f;--sub:#6b7683;--line:#e6e1d6;--accent:#2e9e63;--gold:#e0a02a;--blue:#3b6db5;--red:#c0392b;--r:16px;--shadow:0 6px 20px rgba(0,0,0,.07)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  .wrap{max-width:700px;margin:0 auto;padding:12px 12px 40px}
  h1{font-size:19px;margin:4px 0 2px}.muted{color:var(--sub);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:13px;margin:10px 0}
  .lbl{font-size:12.5px;color:var(--sub);margin-bottom:6px}.lbl b{color:var(--ink)}
  .seg{display:flex;gap:6px}.seg button{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 3px;font-weight:700;font-size:11.5px;cursor:pointer}
  .seg button.active{border-color:var(--ink);background:#fbf6e8}
  .readout{background:#1f2a3d;color:#fff;border:none;text-align:center}
  .readout .big{font-size:20px;font-weight:800;margin:2px 0}.readout .big b{color:#ffd966}.readout .nm{font-size:13px;color:#cdd6e4}
  canvas{display:block;max-width:100%}
  input[type=range]{width:100%}
  .dialv{text-align:center;font-size:17px;font-weight:800;margin:2px 0}
  .btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 13px;font-weight:700;cursor:pointer;font-size:13.5px}
  .btn:active{transform:translateY(1px)}
  .btn.big{font-size:15px;padding:11px 20px;background:#eaf7ef;border-color:var(--accent);color:#136a3d;font-weight:800}
  .choice{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 13px;border:2px solid var(--line);border-radius:12px;background:#fff;font-weight:700;font-size:13.5px;cursor:pointer}
  .choice:active{background:#fbf6e8}
  .cap{font-size:12px;color:var(--sub);text-align:center;margin-top:8px}.cap b{color:var(--ink)}
  .status{text-align:center;font-size:16px;font-weight:800;margin-top:8px}
  /* 계산기 */
  .calc{max-width:280px;margin:10px auto 4px}
  .calcdisp{background:#1f2a3d;color:#fff;font-size:26px;font-weight:800;text-align:right;padding:9px 15px;border-radius:10px;font-variant-numeric:tabular-nums;min-height:46px}
  .calcgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:7px}
  .cbtn{padding:13px 0;font-size:18px;font-weight:800;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer}
  .cbtn:active{background:#f0ece2;transform:translateY(1px)}
  .cbtn.op{background:#f7f0dd;border-color:#e0c98a}.cbtn.wide{grid-column:span 2}
  /* 지도(2단계) */
  .mapbox{position:relative;overflow:hidden;border:2px solid #cdc6b8;border-radius:12px;background:#eef3e4}
  .mapgrid{position:absolute;inset:0;pointer-events:none;z-index:3;
    background-image:linear-gradient(rgba(60,90,140,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(60,90,140,.18) 1px,transparent 1px)}
  .mapcontent{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform .5s}
  .mobj{position:absolute;display:flex;align-items:center;justify-content:center;font-weight:800;border-radius:6px;font-size:12px}
  .scalebar{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;margin-top:8px}
  .scalebar .sc{background:#fbf6e8;border:1.5px solid var(--gold);border-radius:9px;padding:5px 11px}
  /* 복사기(3단계) */
  .copier{display:flex;gap:12px;align-items:stretch;justify-content:center;flex-wrap:wrap}
  .tray{flex:1;min-width:150px;border:2px dashed var(--line);border-radius:12px;padding:10px;text-align:center;background:#fbfaf6}
  .tray .tt{font-size:11px;color:var(--sub);font-weight:700;margin-bottom:6px}
  .pctrow{display:flex;gap:7px;justify-content:center;margin:10px 0 4px;flex-wrap:wrap}
  .pctbtn{border:2px solid var(--line);background:#fff;border-radius:11px;padding:9px 14px;font-weight:800;font-size:14px;cursor:pointer}
  .pctbtn.active{border-color:var(--accent);background:#eaf7ef;color:#136a3d}
  #banner{position:absolute;left:10px;right:10px;display:none;z-index:60;transform:translateY(-50%)}
  #banner .in{max-width:700px;margin:0 auto;padding:14px 16px;border-radius:16px;box-shadow:0 14px 44px rgba(0,0,0,.28);font-weight:700;background:#e7f7ee;color:#136a3d;border-top:3px solid var(--accent)}
  #banner.show{display:block}#banner .sub{font-weight:600;font-size:13px;margin-top:4px}#banner .acts{margin-top:10px}#banner .acts .btn{margin-right:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🗺️ 지도의 비밀</h1>
  <div class="muted">작은 지도에서 시작해 <b>지구 지도</b>까지 — 비·비율·백분율로 세상을 종이에 담아요.</div>
  <div class="card"><div class="lbl">단계</div><div class="seg" id="stageSeg"></div></div>
  <div class="card readout" id="readout"></div>
  <div id="body"></div>
  <div class="muted" style="text-align:center;font-size:11px">지도의 비밀 · 닮음·축척·백분율·지구 · 2026-07-06</div>
</div>
<div id="banner"><div class="in"><div id="bT"></div><div class="sub" id="bS"></div><div class="acts" id="bA"></div></div></div>

<script>
const $=s=>document.querySelector(s);
let stage=1;
let _ac;function _a(){return _ac||(_ac=new(window.AudioContext||window.webkitAudioContext)());}
function chime(){try{const c=_a();[[523,0,.2],[659,.2,.2],[784,.4,.42]].forEach(([f,w,d])=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,c.currentTime+w);g.gain.linearRampToValueAtTime(.15,c.currentTime+w+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+w+d);o.start(c.currentTime+w);o.stop(c.currentTime+w+d+.05);});}catch(e){}}
function plog(ev,data){try{parent.postMessage({type:'pilotLog',lab:'map',event:ev,data:Object.assign({stage},data||{})},'*');}catch(e){}}
const STAGES=[['1 · 축척의 비밀',1],['2 · 지도 확대해보기',2],['3 · 지구 재기',4]];
function renderStage(){const el=$('#stageSeg');el.innerHTML='';STAGES.forEach(([t,s])=>{
  const b=document.createElement('button');b.className=stage===s?'active':'';b.textContent=t;b.onclick=()=>{stage=s;render();plog('enter');};el.appendChild(b);});}
function placeBanner(b){let y;try{const fe=window.frameElement;
  if(fe){const r=fe.getBoundingClientRect(),ph=window.parent.innerHeight;
    const vt=Math.max(0,-r.top),vb=Math.min(r.height,ph-r.top);y=vt+(vb-vt)*0.55;}
  else{y=window.scrollY+window.innerHeight*0.6;}}catch(e){y=window.scrollY+window.innerHeight*0.6;}
  b.style.top=Math.max(90,Math.round(y))+'px';}
function banner(t,s,acts){const b=$('#banner');b.className='show';placeBanner(b);$('#bT').innerHTML=t;$('#bS').innerHTML=s||'';const ae=$('#bA');ae.innerHTML='';(acts||[]).forEach(([x,fn])=>{const q=document.createElement('button');q.className='btn';q.textContent=x;q.onclick=fn;ae.appendChild(q);});}
function hideBanner(){$('#banner').className='';}
function reduce(a,b){const g=(x,y)=>y?g(y,x%y):x;const k=g(Math.round(a*2),Math.round(b*2));return [Math.round(a*2)/k,Math.round(b*2)/k];}

/* ══════ 1단계 · 축척의 비밀 — 실제를 비에 맞게 줄여 지도에 담기 ══════ */
const CELL2=34;
const SC1=[
 {em:'🌉',n:'다리',real:300,cells:3,x:2,y:4,color:'#9a7b4f'},
 {em:'🏫',n:'학교 운동장',real:100,cells:1,x:6,y:2,color:'#c96b6b'},
 {em:'🛣',n:'큰길',real:500,cells:5,x:1,y:6,color:'#8f9aa8'}
];
let s1done=[], s1idx=0;
function townMap(f){f=f||1;const C=CELL2*f;
  let objs='';
  SC1.forEach((o,i)=>{if(stage!==1||s1done.includes(i)){
    objs+=`<div class="mobj" style="left:${C*o.x}px;top:${C*o.y}px;width:${C*o.cells}px;height:${C*0.8}px;background:${o.color};color:#fff;font-size:${12*f}px">${o.em} ${o.n} ${o.cells}칸</div>`;}});
  return `<div class="mapbox" style="width:${C*8+4}px;height:${C*8+4}px;margin:0 auto;max-width:100%;overflow:auto">
    <div class="mapgrid" style="background-size:${C}px ${C}px;width:${C*8}px;height:${C*8}px"></div>${objs}</div>`;}
function renderScale(){
  const done=s1done.length, cur=SC1[s1idx];
  $('#readout').innerHTML=`<div class="nm">마을을 종이에 담아요 — 축척의 비밀! (${done}/${SC1.length})</div><div class="big">${cur?`${cur.em} <b>${cur.n}</b>(실제 <b>${cur.real}m</b>)는 지도에서 <b>몇 칸</b>일까요?`:'축척 지도 완성!'}</div>`;
  let body=`<div class="card">
    <div style="background:#fbf6e8;border:1.5px solid #e0c98a;border-radius:12px;padding:10px 14px;font-size:14.5px;line-height:1.9">
      우리 마을을 종이에 그리고 싶어요. 그런데 다리만 해도 <b>300m</b> — 진짜 크기로는 종이에 못 그려요!<br>
      그래서 약속해요: <b>실제 100m를 지도 1칸으로</b> 줄이기. 무엇이든 <b>같은 비(1:10,000)</b>로 줄여요 — 이 약속이 <b>축척</b>이에요.</div></div>
   <div class="card"><div class="lbl">🗺️ 우리 마을 지도 — 정답을 맞히면 지도에 그려져요!</div>
    ${townMap(1)}
    <div class="scalebar"><span class="sc">축척 1 : 10,000</span><span>1칸 = 100 m</span></div></div>`;
  if(cur){
    const opts={300:[['3칸',true],['30칸',false],['5칸',false]],100:[['1칸',true],['10칸',false],['2칸',false]],500:[['5칸',true],['50칸',false],['4칸',false]]}[cur.real];
    body+=`<div class="card"><div class="lbl">💡 실제 ${cur.real}m ÷ 100m = ? — 100m가 1칸이니까!</div>
      ${mc4(opts,'s1pick')}</div>`;
  } else {
    body+=`<div class="card" style="text-align:center"><div class="cap">모든 것을 <b>같은 비</b>로 줄였더니 마을이 종이 한 장에 쏙!</div>
      <button class="btn big" onclick="stage=2;render();plog('enter')" style="margin-top:6px">2단계 — 지도 확대해보기 →</button></div>`;
  }
  $('#body').innerHTML=body;
}
function s1pick(el){const ok=el.dataset.ok==='1';const cur=SC1[s1idx];
  plog(ok?'scaleOk':'scaleRetry',{obj:cur.n,pick:el.textContent});
  if(ok){s1done.push(s1idx);chime();
    banner(`맞았어요! ${cur.em} ${cur.n} = ${cur.cells}칸 🎯`,`${cur.real}m ÷ 100 = <b>${cur.cells}칸</b> — 실제를 <b>비에 맞게 줄여서</b> 지도에 그렸어요!`,
      [[s1done.length<SC1.length?'다음 →':'지도 완성!',()=>{hideBanner();s1idx++;render();}]]);}
  else banner('다시 한번 도전해볼까요?',`100m가 1칸 — <b>${cur.real} ÷ 100</b> 을 생각해 보세요.`,[['다시',hideBanner]]);}

/* ══════ 2단계 · 지도 확대해보기 — 비율로 확대 시뮬레이션 ══════ */
let z2=100, z2q=0;
function renderZoom(){
  const f=z2/100;
  const qs=[
   {q:'<b>200%</b>로 확대하면, 지도 위 다리(3cm)는 몇 cm가 될까요?',opts:[['6cm',true],['3cm',false],['12cm',false]],
    ok:'200% = ×2 — 지도 위 길이가 <b>2배</b>! 3cm → <b>6cm</b>.'},
   {q:'지도를 아무리 확대해도 <b>변하지 않는 것</b>은?',opts:[['다리의 실제 길이',true],['지도 위 다리의 길이',false],['지도 1칸의 크기',false]],
    ok:'확대는 <b>그림</b>만 커지는 것 — <b>실제 마을</b>은 그대로예요!'}
  ];
  const cur=qs[z2q];
  $('#readout').innerHTML=`<div class="nm">지도가 작아서 잘 안 보여요 — 크게 보고 싶어요!</div><div class="big">배율(%)을 눌러 <b>지도를 확대</b>해 보세요</div>`;
  $('#body').innerHTML=`<div class="card"><div class="lbl">🔍 배율을 고르면 지도의 <b>모든 길이가 같은 비</b>로 커져요</div>
    <div class="pctrow">${[100,200,400].map(p=>`<button class="pctbtn ${z2===p?'active':''}" onclick="z2=${p};render();plog('zoom',{p:${p}})">${p}%</button>`).join('')}</div>
    <div style="max-height:330px;overflow:auto;border-radius:12px">${townMap(f)}</div>
    <div class="scalebar"><span class="sc">배율 ${z2}% = ×${f}</span><span>지도 위 다리: 3cm × ${f} = <b>${3*f}cm</b></span></div>
    <div class="cap">커진 지도에서는 같은 100m가 더 <b>길게</b> 그려져요 → 축척은 1 : ${(10000/f).toLocaleString('ko-KR')}</div></div>
   ${cur?`<div class="card"><div class="lbl">Ⓠ 문제 ${z2q+1}/2</div>
    <div style="font-size:16px;font-weight:800;margin:4px 0 2px">${cur.q}</div>
    ${mc4(cur.opts,'z2pick')}</div>`
   :`<div class="card" style="text-align:center"><div class="cap"><b>비율(%)</b>은 모든 길이를 같은 배로 바꾸는 약속 — 지도를 크게 봐도 <b>실제 세상은 그대로</b>!</div>
    <button class="btn big" onclick="stage=4;render();plog('enter')" style="margin-top:6px">3단계 — 지구 재기! →</button></div>`}`;
}
function z2pick(el){const ok=el.dataset.ok==='1';
  const qs=['zoomLen','zoomInvariant'];
  plog(ok?qs[z2q]+'Ok':qs[z2q]+'Retry',{pick:el.textContent});
  const oks=['200% = ×2 — 지도 위 길이가 <b>2배</b>! 3cm → <b>6cm</b>.','확대는 <b>그림</b>만 커지는 것 — <b>실제 마을</b>은 그대로예요!'];
  if(ok){chime();const last=z2q>=1;
    banner('맞았어요! 🔍',oks[z2q],[[last?'좋아요!':'다음 문제 →',()=>{hideBanner();z2q++;render();}]]);}
  else banner('다시 한번 도전해볼까요?',z2q===0?'배율 버튼을 눌러 <b>지도 위 다리 길이</b>가 어떻게 변하는지 관찰해 보세요.':'확대했을 때 <b>진짜 마을</b>도 커질까요? 생각해 보세요.',[['다시',hideBanner]]);}

/* ══════ 4단계 · 지구를 재는 미션 (비례식) ══════ */
let m4step=1; // 1: 몇 배?, 2: 둘레, 3: 완성
function mc4(opts,fn){const o=opts.map(x=>x.slice());o.sort(()=>Math.random()-0.5);
  return `<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px">`+o.map(([lb,ok])=>
    `<button class="btn big" data-ok="${ok?1:0}" onclick="${fn}(this)" style="font-size:16px;font-weight:800;padding:11px 18px;min-width:104px">${lb}</button>`).join('')+`</div>`;}
function render4(){
  if(m4step===1){
    $('#readout').innerHTML=`<div class="nm">마지막 지도: 지구 🌍 — 막대기 하나로 지구 둘레를 재요!</div><div class="big">한 바퀴 <b>360°</b>는 <b>7.2°</b>의 <b>몇 배</b>일까요?</div>`;
    $('#body').innerHTML=`<div class="card">
      <div class="lbl">📜 2200년 전, 에라토스테네스의 발견 — 같은 시각, 두 도시</div>
      <canvas id="cv4" style="width:100%;height:270px"></canvas>
      <div style="background:#fbf6e8;border:1.5px solid #e0c98a;border-radius:12px;padding:10px 14px;font-size:14.5px;line-height:1.9;margin-top:8px">
        ① 같은 시각 — <b>시에네</b>는 그림자가 없고(0°), <b>알렉산드리아</b>는 그림자가 <b>7.2°</b> 기울어요.<br>
        ② 지구가 둥글기 때문! 지구 <b>중심에서 두 도시가 벌어진 각</b>이 바로 <b>7.2°</b>예요.<br>
        ③ 두 도시 사이의 거리(빨간 호)는 <b>800 km</b>. <span class="cap" style="display:inline">(그림은 각도를 크게 과장했어요)</span></div></div>
     <div class="card"><div class="lbl">💡 식 세우기 첫걸음 — 한 바퀴는 360°니까, <b>360 ÷ 7.2</b> 계산!</div>
      ${calcHTML()}
      <div class="cap">360°는 7.2°의 <b>몇 배</b>?</div>
      ${mc4([['50배',true],['5배',false],['500배',false]],'e4pick1')}</div>`;
    draw4(); cShow();
  } else if(m4step===2){
    $('#readout').innerHTML=`<div class="nm">각도가 50배면, 거리도 50배!</div><div class="big">그럼 <b>지구 둘레</b>는 몇 km?</div>`;
    $('#body').innerHTML=`<div class="card">
      <div class="lbl">🧮 비례식 세우기 — 각도의 비 = 거리의 비</div>
      <div style="background:#eef4fb;border:1.5px solid #b8cfec;border-radius:12px;padding:14px;text-align:center">
        <table style="margin:0 auto;border-collapse:collapse;font-size:17px;font-weight:800">
          <tr><td style="padding:4px 10px;color:#6b7683;font-size:13px;font-weight:700">각도의 비</td><td></td><td style="padding:4px 10px;color:#6b7683;font-size:13px;font-weight:700">거리의 비</td></tr>
          <tr><td style="padding:4px 10px">7.2° : 360°</td><td style="padding:4px 6px">=</td><td style="padding:4px 10px">800 km : <span style="color:#c0392b">❓</span></td></tr>
          <tr><td style="padding:2px 10px;color:#2e9e63;font-size:14px">↓ ×50</td><td></td><td style="padding:2px 10px;color:#2e9e63;font-size:14px">↓ ×50</td></tr>
          <tr><td style="padding:4px 10px">360°</td><td></td><td style="padding:4px 10px;color:#c0392b">❓ km</td></tr>
        </table>
        <div class="cap" style="margin-top:8px">7.2°에 <b>50을 곱하면</b> 한 바퀴(360°) → <b>800 km에도 똑같이 50을 곱하면</b> 지구 둘레!</div>
      </div>
      <canvas id="cvPie" style="width:100%;height:190px;margin-top:8px"></canvas></div>
     <div class="card"><div class="lbl">💡 계산기로: 800 × 50</div>${calcHTML()}
      <div class="cap">지구 둘레는?</div>
      ${mc4([['40,000 km',true],['4,000 km',false],['400,000 km',false]],'e4pick2')}</div>`;
    drawPie(); cShow();
  } else {
    $('#readout').innerHTML=`<div class="nm">🎉 지도의 비밀 — 모두 풀었어요!</div><div class="big">지구 둘레 = <b>40,000 km</b></div>`;
    $('#body').innerHTML=`<div class="card" style="text-align:center">
      <div style="font-size:64px;margin:6px">🌍</div>
      <div style="font-weight:800;font-size:17px">세계 지도 완성!</div>
      <div class="sc" style="display:inline-block;background:#fbf6e8;border:1.5px solid var(--gold);border-radius:9px;padding:6px 14px;margin:10px 0;font-weight:800">축척 1 : 40,000,000</div>
      <div class="cap">실제 지구 둘레는 40,075 km — 막대기 하나와 <b>'비'</b>만으로 2200년 전에 지구를 쟀어요.<br>
      확대(1) → 축척(2) → 복사기 %(3) → 지구(4)… 전부 <b>같은 비의 비밀</b>이었죠!</div>
      <button class="btn big" onclick="m4step=1;stage=1;sx=1;sy=1;m1idx=0;m1done=[];m2idx=0;m2done=[];zoom=1;m3idx=0;m3done=[];pct=100;cClear();render()" style="margin-top:8px">처음부터 다시 탐험</button></div>`;
  }
}
function draw4(){const cv=$('#cv4');if(!cv)return;const rect=cv.getBoundingClientRect();
  if(rect.width<8)return;
  const W=cv.width=Math.round(rect.width*2),H=cv.height=540;const ctx=cv.getContext('2d');ctx.clearRect(0,0,W,H);
  const cx=W*0.40, cy=H*0.54, R=H*0.40, EX=0.55; // EX: 과장 각(라디안)
  // 지구
  ctx.fillStyle='#bfe0c2';ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();
  ctx.strokeStyle='#7fae84';ctx.lineWidth=4;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();
  // 두 도시 각도 (수직 위 = 시에네, 과장각만큼 왼쪽 = 알렉산드리아)
  const aS=-Math.PI/2, aA=-Math.PI/2-EX;
  const sx1=cx+R*Math.cos(aS), sy1=cy+R*Math.sin(aS);
  const ax1=cx+R*Math.cos(aA), ay1=cy+R*Math.sin(aA);
  // 중심각(부채꼴 표시)
  ctx.fillStyle='rgba(224,160,42,.20)';ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R*0.55,aA,aS);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#8a6a34';ctx.lineWidth=3;ctx.setLineDash([8,6]);
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(sx1,sy1);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(ax1,ay1);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#8a6a34';ctx.font='bold 26px sans-serif';ctx.textAlign='center';
  ctx.fillText('7.2°',cx+R*0.30*Math.cos((aS+aA)/2),cy+R*0.30*Math.sin((aS+aA)/2)+8);
  ctx.font='bold 20px sans-serif';ctx.fillText('지구 중심',cx,cy+30);
  ctx.fillStyle='#26303f';ctx.beginPath();ctx.arc(cx,cy,7,0,7);ctx.fill();
  // 빨간 호 = 800km
  ctx.strokeStyle='#c0392b';ctx.lineWidth=9;ctx.beginPath();ctx.arc(cx,cy,R,aA,aS);ctx.stroke();
  ctx.fillStyle='#c0392b';ctx.font='bold 24px sans-serif';
  ctx.fillText('800 km',cx+R*1.06*Math.cos((aS+aA)/2)-10,cy+R*1.12*Math.sin((aS+aA)/2));
  // 막대 + 그림자
  function stick(a,label,shadow){
    const bx=cx+R*Math.cos(a),by=cy+R*Math.sin(a);
    const tx=cx+(R+H*0.11)*Math.cos(a),ty=cy+(R+H*0.11)*Math.sin(a);
    ctx.strokeStyle='#26303f';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(tx,ty);ctx.stroke();
    if(shadow){ctx.strokeStyle='#e0a02a';ctx.lineWidth=4;ctx.setLineDash([2,4]);
      ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(bx-H*0.085,by-H*0.01);ctx.stroke();ctx.setLineDash([]);
      ctx.strokeStyle='#c0392b';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx-H*0.085,by-H*0.01);ctx.stroke();}
    ctx.fillStyle='#26303f';ctx.font='bold 22px sans-serif';
    if(shadow){ctx.textAlign='center';ctx.fillText(label,tx,ty-14);}
    else{ctx.textAlign='left';ctx.fillText(label,tx+14,ty+22);}}
  stick(aA,'알렉산드리아',true);
  stick(aS,'시에네',false);
  // 평행 햇살
  ctx.strokeStyle='#e0a02a';ctx.lineWidth=3;
  for(let i=0;i<5;i++){const y=H*0.06+i*H*0.10;
    ctx.beginPath();ctx.moveTo(W*0.98,y);ctx.lineTo(W*0.72,y+H*0.05);ctx.stroke();
    ctx.beginPath();ctx.moveTo(W*0.72,y+H*0.05);ctx.lineTo(W*0.75,y+H*0.028);ctx.stroke();}
  ctx.fillStyle='#e0a02a';ctx.font='bold 26px sans-serif';ctx.textAlign='right';ctx.fillText('☀️ 햇빛은 평행!',W*0.98,H*0.045);
}
function drawPie(){const cv=$('#cvPie');if(!cv)return;const rect=cv.getBoundingClientRect();
  if(rect.width<8)return;
  const W=cv.width=Math.round(rect.width*2),H=cv.height=380;const ctx=cv.getContext('2d');ctx.clearRect(0,0,W,H);
  const cx=W/2,cy=H/2,R=H*0.40;
  ctx.fillStyle='#dfe9f5';ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();
  // 50조각 눈금
  ctx.strokeStyle='#b9c9de';ctx.lineWidth=2;
  for(let i=0;i<50;i++){const a=-Math.PI/2+i*Math.PI*2/50;
    ctx.beginPath();ctx.moveTo(cx+R*0.86*Math.cos(a),cy+R*0.86*Math.sin(a));ctx.lineTo(cx+R*Math.cos(a),cy+R*Math.sin(a));ctx.stroke();}
  ctx.strokeStyle='#9fb6d4';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();
  // 800km 조각(1/50)
  ctx.fillStyle='#c0392b';ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,-Math.PI/2,-Math.PI/2+Math.PI*2/50);ctx.closePath();ctx.fill();
  ctx.fillStyle='#c0392b';ctx.font='bold 24px sans-serif';ctx.textAlign='center';
  ctx.fillText('800 km 조각',cx+R*0.55,cy-R*1.05);
  ctx.fillStyle='#26303f';ctx.font='bold 28px sans-serif';
  ctx.fillText('이 조각 50개 = 한 바퀴!',cx,cy+10);}
function e4pick1(el){const ok=el.dataset.ok==='1';plog(ok?'earthX50Ok':'earthX50Retry',{pick:el.textContent});
  if(ok){m4step=2;cClear();chime();
    banner('맞았어요! 50배 🎯','360 ÷ 7.2 = <b>50</b> — 한 바퀴는 7.2°의 딱 50배예요!',[['비례식 세우러 →',()=>{hideBanner();render();}]]);}
  else banner('다시 한번 도전해볼까요?','계산기로 <b>360 ÷ 7.2</b> 를 눌러 보세요. (C로 지우기)',[['다시',hideBanner]]);}
function e4pick2(el){const ok=el.dataset.ok==='1';plog(ok?'earthDone':'earthRetry',{pick:el.textContent});
  if(ok){m4step=3;try{parent.postMessage({type:'mapLabDone'},'*');}catch(e){}
    chime();banner('지구를 쟀어요!! 🌍',`7.2° : 360° = 800 : <b>40,000</b> — 실제 값 40,075 km, 오차 0.2%!`+'<br><div style="margin-top:10px;font-weight:800">📝 오늘 지도에서 찾은 <b>비의 비밀</b>을 한 문장으로 남겨 주세요!</div><input id="rfx" type="text" maxlength="100" placeholder="예: 지도는 실제를 같은 비로 줄인 것이다!" style="width:100%;max-width:430px;margin-top:6px;padding:10px;border:1.5px solid #bfe6cf;border-radius:10px;font-size:14px;font-weight:600">',[['한 문장 남기고 완성! 🌍',()=>{const _r=document.querySelector('#rfx');plog('reflection',{text:(_r&&_r.value||'').slice(0,100)});hideBanner();render();}]]);}
  else banner('다시 한번 도전해볼까요?','각도가 50배니까 거리도 50배 — <b>800 × 50</b> 을 계산해 보세요.',[['다시',hideBanner]]);}

/* ══════ 계산기 (공용) ══════ */
let cDisp='0', cAcc=null, cOp=null, cFresh=true;
function cShow(){const d=$('#cd');if(d)d.textContent=cDisp;}
function cD(d){if(cFresh){cDisp=String(d);cFresh=false;}else{cDisp=(cDisp==='0'?'':cDisp)+d;}cShow();}
function cDot(){if(cFresh){cDisp='0.';cFresh=false;}else if(!cDisp.includes('.'))cDisp+='.';cShow();}
function cCompute(){const y=parseFloat(cDisp);let r=cAcc;if(cOp==='×')r=cAcc*y;else if(cOp==='÷')r=cAcc/y;r=Math.round(r*10000)/10000;cDisp=String(r);cAcc=r;cShow();}
function cO(op){if(cOp!==null&&!cFresh)cCompute();cAcc=parseFloat(cDisp);cOp=op;cFresh=true;}
function cEq(){if(cOp!==null){cCompute();cOp=null;cFresh=true;}}
function cClear(){cDisp='0';cAcc=null;cOp=null;cFresh=true;cShow();}
function calcHTML(){const b=(t,f,c)=>`<button class="cbtn ${c||''}" onclick="${f}">${t}</button>`;
  return `<div class="calc"><div class="calcdisp" id="cd">${cDisp}</div><div class="calcgrid">
   ${b('7','cD(7)')}${b('8','cD(8)')}${b('9','cD(9)')}${b('÷',"cO('÷')",'op')}
   ${b('4','cD(4)')}${b('5','cD(5)')}${b('6','cD(6)')}${b('×',"cO('×')",'op')}
   ${b('1','cD(1)')}${b('2','cD(2)')}${b('3','cD(3)')}${b('C','cClear()','op')}
   ${b('0','cD(0)')}${b('.','cDot()')}${b('=','cEq()','op wide')}</div></div>`;}

function render(){renderStage();({1:renderScale,2:renderZoom,4:render4}[stage])();}
window.addEventListener('resize',()=>{if(stage===4&&m4step===1)draw4();if(stage===4&&m4step===2)drawPie();});
render();
/* 숨김 iframe으로 로드된 경우: 보이게 되면 1회 다시 그림 */
let _vchk=setInterval(()=>{
  if(document.body.getBoundingClientRect().width>8){ if(stage===4)render4(); clearInterval(_vchk); }},350);
</script>
