<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secret of Maps</title>
<style>
  :root{--bg:#f4f1ea;--card:#fff;--ink:#26303f;--sub:#6b7683;--line:#e6e1d6;--accent:#2e9e63;--gold:#e0a02a;--blue:#3b6db5;--red:#c0392b;--r:16px;--shadow:0 6px 20px rgba(0,0,0,.07)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  .wrap{max-width:700px;margin:0 auto;padding:12px 12px 40px}
  h1{font-size:19px;margin:4px 0 2px}.muted{color:var(--sub);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:13px;margin:10px 0}
  .lbl{font-size:12.5px;color:var(--sub);margin-bottom:6px}.lbl b{color:var(--ink)}
  .seg{display:flex;gap:6px}.seg button{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 3px;font-weight:700;font-size:11.5px;cursor:pointer}
  .seg button.active{border-color:var(--ink);background:#fbf6e8}
  .readout{background:#1f2a3d;color:#fff;border:none;text-align:center}
  .readout .big{font-size:20px;font-weight:800;margin:2px 0}.readout .big b{color:#ffd966}.readout .nm{font-size:13px;color:#cdd6e4}
  canvas{display:block;max-width:100%}
  input[type=range]{width:100%}
  .dialv{text-align:center;font-size:17px;font-weight:800;margin:2px 0}
  .btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 13px;font-weight:700;cursor:pointer;font-size:13.5px}
  .btn:active{transform:translateY(1px)}
  .btn.big{font-size:15px;padding:11px 20px;background:#eaf7ef;border-color:var(--accent);color:#136a3d;font-weight:800}
  .choice{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 13px;border:2px solid var(--line);border-radius:12px;background:#fff;font-weight:700;font-size:13.5px;cursor:pointer}
  .choice:active{background:#fbf6e8}
  .cap{font-size:12px;color:var(--sub);text-align:center;margin-top:8px}.cap b{color:var(--ink)}
  .status{text-align:center;font-size:16px;font-weight:800;margin-top:8px}
  /* 계산기 */
  .calc{max-width:280px;margin:10px auto 4px}
  .calcdisp{background:#1f2a3d;color:#fff;font-size:26px;font-weight:800;text-align:right;padding:9px 15px;border-radius:10px;font-variant-numeric:tabular-nums;min-height:46px}
  .calcgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:7px}
  .cbtn{padding:13px 0;font-size:18px;font-weight:800;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer}
  .cbtn:active{background:#f0ece2;transform:translateY(1px)}
  .cbtn.op{background:#f7f0dd;border-color:#e0c98a}.cbtn.wide{grid-column:span 2}
  /* 지도(2단계) */
  .mapbox{position:relative;overflow:hidden;border:2px solid #cdc6b8;border-radius:12px;background:#eef3e4}
  .mapgrid{position:absolute;inset:0;pointer-events:none;z-index:3;
    background-image:linear-gradient(rgba(60,90,140,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(60,90,140,.18) 1px,transparent 1px)}
  .mapcontent{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform .5s}
  .mobj{position:absolute;display:flex;align-items:center;justify-content:center;font-weight:800;border-radius:6px;font-size:12px}
  .scalebar{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;margin-top:8px}
  .scalebar .sc{background:#fbf6e8;border:1.5px solid var(--gold);border-radius:9px;padding:5px 11px}
  /* 복사기(3단계) */
  .copier{display:flex;gap:12px;align-items:stretch;justify-content:center;flex-wrap:wrap}
  .tray{flex:1;min-width:150px;border:2px dashed var(--line);border-radius:12px;padding:10px;text-align:center;background:#fbfaf6}
  .tray .tt{font-size:11px;color:var(--sub);font-weight:700;margin-bottom:6px}
  .pctrow{display:flex;gap:7px;justify-content:center;margin:10px 0 4px;flex-wrap:wrap}
  .pctbtn{border:2px solid var(--line);background:#fff;border-radius:11px;padding:9px 14px;font-weight:800;font-size:14px;cursor:pointer}
  .pctbtn.active{border-color:var(--accent);background:#eaf7ef;color:#136a3d}
  #banner{position:absolute;left:10px;right:10px;display:none;z-index:60;transform:translateY(-50%)}
  #banner .in{max-width:700px;margin:0 auto;padding:14px 16px;border-radius:16px;box-shadow:0 14px 44px rgba(0,0,0,.28);font-weight:700;background:#e7f7ee;color:#136a3d;border-top:3px solid var(--accent)}
  #banner.show{display:block}#banner .sub{font-weight:600;font-size:13px;margin-top:4px}#banner .acts{margin-top:10px}#banner .acts .btn{margin-right:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🗺️ Secret of Maps</h1>
  <div class="muted">From a tiny map to a <b>map of the Earth</b> — putting the world on paper with ratios, rates, and percent.</div>
  <div class="card"><div class="lbl">Steps</div><div class="seg" id="stageSeg"></div></div>
  <div class="card readout" id="readout"></div>
  <div id="body"></div>
  <div class="muted" style="text-align:center;font-size:11px">RatioSense — Secret of Maps</div>
</div>
<div id="banner"><div class="in"><div id="bT"></div><div class="sub" id="bS"></div><div class="acts" id="bA"></div></div></div>

<script>
const $=s=>document.querySelector(s);
let stage=1;
let _ac;function _a(){return _ac||(_ac=new(window.AudioContext||window.webkitAudioContext)());}
function chime(){try{const c=_a();[[523,0,.2],[659,.2,.2],[784,.4,.42]].forEach(([f,w,d])=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,c.currentTime+w);g.gain.linearRampToValueAtTime(.15,c.currentTime+w+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+w+d);o.start(c.currentTime+w);o.stop(c.currentTime+w+d+.05);});}catch(e){}}
function plog(ev,data){try{parent.postMessage({type:'pilotLog',lab:'map',event:ev,data:Object.assign({stage},data||{})},'*');}catch(e){}}
const STAGES=[['1 · Secret of Scale',1],['2 · Zoom the Map',2],['3 · Measure the Earth',4]];
function renderStage(){const el=$('#stageSeg');el.innerHTML='';STAGES.forEach(([t,s])=>{
  const b=document.createElement('button');b.className=stage===s?'active':'';b.textContent=t;b.onclick=()=>{stage=s;render();plog('enter');};el.appendChild(b);});}
function placeBanner(b){let y;try{const fe=window.frameElement;
  if(fe){const r=fe.getBoundingClientRect(),ph=window.parent.innerHeight;
    const vt=Math.max(0,-r.top),vb=Math.min(r.height,ph-r.top);y=vt+(vb-vt)*0.55;}
  else{y=window.scrollY+window.innerHeight*0.6;}}catch(e){y=window.scrollY+window.innerHeight*0.6;}
  b.style.top=Math.max(90,Math.round(y))+'px';}
function banner(t,s,acts){const b=$('#banner');b.className='show';placeBanner(b);$('#bT').innerHTML=t;$('#bS').innerHTML=s||'';const ae=$('#bA');ae.innerHTML='';(acts||[]).forEach(([x,fn])=>{const q=document.createElement('button');q.className='btn';q.textContent=x;q.onclick=fn;ae.appendChild(q);});}
function hideBanner(){$('#banner').className='';}
function reduce(a,b){const g=(x,y)=>y?g(y,x%y):x;const k=g(Math.round(a*2),Math.round(b*2));return [Math.round(a*2)/k,Math.round(b*2)/k];}

/* ══════ 1단계 · 축척의 비밀 — 실제를 비에 맞게 줄여 지도에 담기 ══════ */
const CELL2=34;
const SC1=[
 {em:'🌉',n:'Bridge',real:300,cells:3,x:2,y:4,color:'#9a7b4f'},
 {em:'🏫',n:'Schoolyard',real:100,cells:1,x:6,y:2,color:'#c96b6b'},
 {em:'🛣',n:'Main road',real:500,cells:5,x:1,y:6,color:'#8f9aa8'}
];
let s1done=[], s1idx=0;
function townMap(f){f=f||1;const C=CELL2*f;
  let objs='';
  // 강(다리 아래 배경)
  objs+=`<div style="position:absolute;left:0;top:${C*3.9}px;width:${C*8}px;height:${C*1.0}px;background:linear-gradient(#bcd9f0,#9ec4e4);opacity:.85"></div>`;
  SC1.forEach((o,i)=>{if(stage!==1||s1done.includes(i)){
    let shape='';
    if(o.n==='다리'){shape=`<div class="mobj" style="left:${C*o.x}px;top:${C*o.y}px;width:${C*o.cells}px;height:${C*0.8}px;background:${o.color};border-top:3px solid #6d5432;border-bottom:3px solid #6d5432;background-image:repeating-linear-gradient(90deg,transparent 0 ${C*0.28}px,rgba(255,255,255,.35) ${C*0.28}px ${C*0.33}px)"></div>`;}
    else if(o.n==='큰길'){shape=`<div class="mobj" style="left:${C*o.x}px;top:${C*o.y}px;width:${C*o.cells}px;height:${C*0.8}px;background:#8f9aa8;background-image:repeating-linear-gradient(90deg,transparent 0 ${C*0.35}px,#f4e37a ${C*0.35}px ${C*0.55}px);background-size:100% 3px;background-position:center;background-repeat:no-repeat"></div>`;}
    else {shape=`<div class="mobj" style="left:${C*o.x}px;top:${C*o.y}px;width:${C*o.cells}px;height:${C*0.8}px;background:${o.color};border-radius:50%;border:2.5px solid #a34d4d"></div>`;}
    const lb=(o.x>=4.5)?`right:${Math.max(2,C*(8-o.x-o.cells))}px`:`left:${C*o.x}px`;
    objs+=shape+`<div style="position:absolute;${lb};top:${C*(o.y-0.62)}px;background:rgba(255,255,255,.94);border:1px solid #cdc6b8;border-radius:8px;padding:1px 7px;font-size:${11.5*Math.min(f,1.4)}px;font-weight:800;white-space:nowrap;z-index:5">${o.em} ${o.n} · ${o.cells} cells</div>`;}});
  return `<div class="mapbox" style="width:${C*8+4}px;height:${C*8+4}px;margin:0 auto;max-width:100%;overflow:auto">
    <div class="mapgrid" style="background-size:${C}px ${C}px;width:${C*8}px;height:${C*8}px"></div>${objs}</div>`;}
function renderScale(){
  const done=s1done.length, cur=SC1[s1idx];
  $('#readout').innerHTML=`<div class="nm">Put the town on paper — the secret of scale! (${done}/${SC1.length})</div><div class="big">${cur?`How many <b>cells</b> does the ${cur.em} <b>${cur.n}</b> (really <b>${cur.real}m</b>) take on the map?`:'Scale map complete!'}</div>`;
  let body=`<div class="card">
    <div style="background:#fbf6e8;border:1.5px solid #e0c98a;border-radius:12px;padding:10px 14px;font-size:14.5px;line-height:1.9">
      We want to draw our town on paper. But the bridge alone is <b>300m</b> — no paper is that big!<br>
      So we make a deal: <b>100 real meters becomes 1 map cell</b>. Everything shrinks by <b>the same ratio (1:10,000)</b> — that deal is called <b>scale</b>.</div></div>
   <div class="card"><div class="lbl">🗺️ Our town map — answer correctly and it gets drawn!</div>
    ${townMap(1)}
    <div class="scalebar"><span class="sc">Scale 1 : 10,000</span><span>1 cell = 100 m</span></div></div>`;
  if(cur){
    const opts={300:[['3 cells',true],['30 cells',false],['5 cells',false]],100:[['1 cell',true],['10 cells',false],['2 cells',false]],500:[['5 cells',true],['50 cells',false],['4 cells',false]]}[cur.real];
    body+=`<div class="card"><div class="lbl">💡 ${cur.real}m ÷ 100m = ? — because 100m is one cell!</div>
      ${mc4(opts,'s1pick')}</div>`;
  } else {
    body+=`<div class="card" style="text-align:center"><div class="cap">Shrink everything by <b>the same ratio</b>, and the whole town fits on one sheet!</div>
      <button class="btn big" onclick="stage=2;render();plog('enter')" style="margin-top:6px">Step 2 — Zoom the Map →</button></div>`;
  }
  $('#body').innerHTML=body;
}
function s1pick(el){const ok=el.dataset.ok==='1';const cur=SC1[s1idx];
  plog(ok?'scaleOk':'scaleRetry',{obj:cur.n,pick:el.textContent});
  if(ok){s1done.push(s1idx);chime();
    banner(`Correct! ${cur.em} ${cur.n} = ${cur.cells} cells 🎯`,`${cur.real}m ÷ 100 = <b>${cur.cells} cells</b> — you shrank the real thing <b>by the ratio</b> and drew it on the map!`,
      [[s1done.length<SC1.length?'Next →':'Map complete!',()=>{hideBanner();s1idx++;render();}]]);}
  else banner('Try again!',`100m is one cell — think <b>${cur.real} ÷ 100</b>.`,[['Retry',hideBanner]]);}

/* ══════ 2단계 · 지도 확대해보기 — 비율로 확대 시뮬레이션 ══════ */
let z2=100, z2q=0;
function renderZoom(){
  const f=z2/100;
  const qs=[
   {q:'At <b>200%</b>, how long is the bridge on the map (now 3cm)?',opts:[['6cm',true],['3cm',false],['12cm',false]],
    ok:'200% = ×2 — map lengths <b>double</b>! 3cm → <b>6cm</b>.'},
   {q:'No matter how much you zoom, what <b>never changes</b>?',opts:[['The real length of the bridge',true],['The bridge length on the map',false],['The size of one map cell',false]],
    ok:'Zooming only enlarges the <b>picture</b> — the <b>real town</b> stays the same!'}
  ];
  const cur=qs[z2q];
  $('#readout').innerHTML=`<div class="nm">The map is too small to read — let's see it bigger!</div><div class="big">Press a zoom (%) to <b>enlarge the map</b></div>`;
  $('#body').innerHTML=`<div class="card"><div class="lbl">🔍 Pick a zoom and <b>every length grows by the same ratio</b></div>
    <div class="pctrow">${[100,200].map(p=>`<button class="pctbtn ${z2===p?'active':''}" onclick="z2=${p};render();plog('zoom',{p:${p}})">${p}%</button>`).join('')}</div>
    <div style="max-height:330px;overflow:auto;border-radius:12px">${townMap(f)}</div>
    <div class="scalebar"><span class="sc">Zoom ${z2}% = ×${f}</span><span>Bridge on map: 3cm × ${f} = <b>${3*f}cm</b></span></div>
    <div class="cap">On the bigger map the same 100m is drawn <b>longer</b> → the scale becomes 1 : ${(10000/f).toLocaleString('en-US')}</div></div>
   ${cur?`<div class="card"><div class="lbl">Ⓠ Question ${z2q+1}/2</div>
    <div style="font-size:16px;font-weight:800;margin:4px 0 2px">${cur.q}</div>
    ${mc4(cur.opts,'z2pick')}</div>`
   :`<div class="card" style="text-align:center"><div class="cap"><b>Percent (%)</b> is a deal that changes every length by the same factor — zoom all you like, <b>the real world stays the same</b>!</div>
    <button class="btn big" onclick="stage=4;render();plog('enter')" style="margin-top:6px">Step 3 — Measure the Earth! →</button></div>`}`;
}
function z2pick(el){const ok=el.dataset.ok==='1';
  const qs=['zoomLen','zoomInvariant'];
  plog(ok?qs[z2q]+'Ok':qs[z2q]+'Retry',{pick:el.textContent});
  const oks=['200% = ×2 — map lengths <b>double</b>! 3cm → <b>6cm</b>.','Zooming only enlarges the <b>picture</b> — the <b>real town</b> stays the same!'];
  if(ok){chime();const last=z2q>=1;
    banner('Correct! 🔍',oks[z2q],[[last?'Nice!':'Next question →',()=>{hideBanner();z2q++;render();}]]);}
  else banner('Try again!',z2q===0?'Press the zoom buttons and watch <b>the bridge length on the map</b>.':'Does the <b>real town</b> grow when you zoom the map? Think about it.',[['Retry',hideBanner]]);}

/* ══════ 4단계 · 지구를 재는 미션 (비례식) ══════ */
let m4step=0, eSt=0; // 0: 과학자 이야기, 1: 몇 배?, 2: 둘레, 3: 완성
function mc4(opts,fn){const o=opts.map(x=>x.slice());o.sort(()=>Math.random()-0.5);
  return `<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px">`+o.map(([lb,ok])=>
    `<button class="btn big" data-ok="${ok?1:0}" onclick="${fn}(this)" style="font-size:16px;font-weight:800;padding:11px 18px;min-width:104px">${lb}</button>`).join('')+`</div>`;}
function comicSVG(){return `
<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
 <svg viewBox="0 0 340 305" style="flex:1;min-width:270px;max-width:370px;background:#fffdf6;border:2.5px solid #26303f;border-radius:10px">
   <text x="12" y="24" font-size="15" font-weight="800" fill="#26303f">Panel 1 · Noon on the same day, two cities</text>
   <circle cx="302" cy="44" r="16" fill="#ffd34d"/>
   <line x1="278" y1="60" x2="292" y2="52" stroke="#e0a02a" stroke-width="3"/>
   <line x1="266" y1="76" x2="282" y2="66" stroke="#e0a02a" stroke-width="3"/>
   <rect x="42" y="196" width="44" height="56" fill="#8a6a34" rx="4"/>
   <rect x="50" y="204" width="28" height="40" fill="#3c2c14" rx="3"/>
   <line x1="64" y1="140" x2="64" y2="204" stroke="#e0a02a" stroke-width="3"/>
   <text x="64" y="272" text-anchor="middle" font-size="13" font-weight="800" fill="#26303f">Well in Syene</text>
   <text x="64" y="290" text-anchor="middle" font-size="12.5" font-weight="800" fill="#2e9e63">shadow 0°</text>
   <line x1="232" y1="158" x2="232" y2="252" stroke="#26303f" stroke-width="6"/>
   <line x1="232" y1="252" x2="196" y2="252" stroke="#c0392b" stroke-width="6"/>
   <line x1="232" y1="158" x2="196" y2="252" stroke="#e0a02a" stroke-width="2" stroke-dasharray="4 3"/>
   <text x="240" y="186" font-size="13.5" font-weight="800" fill="#c0392b">7.2°</text>
   <text x="232" y="272" text-anchor="middle" font-size="13" font-weight="800" fill="#26303f">Stick in Alexandria</text>
   <text x="232" y="290" text-anchor="middle" font-size="12.5" font-weight="800" fill="#c0392b">shadow 7.2°</text>
   <rect x="52" y="54" width="216" height="58" rx="12" fill="#fff" stroke="#26303f" stroke-width="2"/>
   <path d="M150 112 l10 16 l8 -16 Z" fill="#fff" stroke="#26303f" stroke-width="2"/>
   <rect x="151" y="108" width="16" height="5" fill="#fff"/>
   <text x="160" y="78" text-anchor="middle" font-size="13.5" font-weight="800" fill="#26303f">"Same moment, but</text>
   <text x="160" y="98" text-anchor="middle" font-size="13.5" font-weight="800" fill="#26303f">different shadows?!"</text>
 </svg>
 <svg viewBox="0 0 340 305" style="flex:1;min-width:270px;max-width:370px;background:#fffdf6;border:2.5px solid #26303f;border-radius:10px">
   <text x="12" y="24" font-size="15" font-weight="800" fill="#26303f">Panel 2 · Eratosthenes' insight</text>
   <circle cx="110" cy="215" r="68" fill="#bfe0c2" stroke="#7fae84" stroke-width="3"/>
   <path d="M110 215 L110 147 A68 68 0 0 0 78 155 Z" fill="rgba(224,160,42,.35)"/>
   <line x1="110" y1="215" x2="110" y2="147" stroke="#8a6a34" stroke-width="2.5" stroke-dasharray="6 4"/>
   <line x1="110" y1="215" x2="78" y2="155" stroke="#8a6a34" stroke-width="2.5" stroke-dasharray="6 4"/>
   <path d="M78 155 A68 68 0 0 1 110 147" fill="none" stroke="#c0392b" stroke-width="7"/>
   <text x="100" y="185" font-size="13" font-weight="800" fill="#8a6a34">7.2°</text>
   <text x="70" y="136" font-size="12.5" font-weight="800" fill="#c0392b">800km</text>
   <circle cx="110" cy="215" r="4" fill="#26303f"/>
   <text x="258" y="215" text-anchor="middle" font-size="46">🧔</text>
   <rect x="150" y="48" width="180" height="118" rx="12" fill="#fff" stroke="#26303f" stroke-width="2"/>
   <path d="M240 166 l8 18 l10 -16 Z" fill="#fff" stroke="#26303f" stroke-width="2"/>
   <rect x="241" y="162" width="18" height="5" fill="#fff"/>
   <text x="240" y="72" text-anchor="middle" font-size="13.5" font-weight="800" fill="#26303f">"Because Earth is round!</text>
   <text x="240" y="92" text-anchor="middle" font-size="13.5" font-weight="800" fill="#26303f">A full turn of 360° is</text>
   <text x="240" y="112" text-anchor="middle" font-size="13.5" font-weight="800" fill="#26303f">exactly 50 of these 7.2°!"</text>
   <text x="240" y="142" text-anchor="middle" font-size="15" font-weight="800" fill="#1a5fb4">360 ÷ 7.2 = 50</text>
 </svg>
</div>`;}
function render4(){
  if(m4step===0){
    $('#readout').innerHTML=`<div class="nm">🌍 2,200 years ago, Eratosthenes measured the Earth <b>with a single stick</b></div><div class="big">His discovery — <b>in a two-panel comic</b>!</div>`;
    $('#body').innerHTML=`<div class="card">
      <div style="background:#fbf6e8;border:1.5px solid #e0c98a;border-radius:12px;padding:10px 14px;font-size:14.5px;line-height:1.8;margin-bottom:8px">Long ago in Greece, <b>Eratosthenes</b> wondered — "How big is the Earth?" He used just two tools: <b>a shadow</b> and <b>a distance</b>!</div>
      ${comicSVG()}
      <div class="cap" style="margin-top:8px">The two cities are <b>800 km</b> apart — now we can find the whole circumference!</div>
      <div style="text-align:center;margin-top:10px">
        <button class="btn big" onclick="m4step=2;render();plog('storyDone',{})">Calculate it with a ratio! ✏️</button>
      </div></div>`;
    return;
  }
  if(m4step===2){
    $('#readout').innerHTML=`<div class="nm">If the angle is ×50, the distance is ×50 too!</div><div class="big">So what is the <b>Earth's circumference</b>?</div>`;
    $('#body').innerHTML=`<div class="card">
      <div class="lbl">🧮 Building the proportion — ratio of angles = ratio of distances</div>
      <div style="background:#eef4fb;border:1.5px solid #b8cfec;border-radius:12px;padding:14px;text-align:center">
        <table style="margin:0 auto;border-collapse:collapse;font-size:17px;font-weight:800">
          <tr><td style="padding:4px 10px;color:#6b7683;font-size:13px;font-weight:700">ratio of angles</td><td></td><td style="padding:4px 10px;color:#6b7683;font-size:13px;font-weight:700">ratio of distances</td></tr>
          <tr><td style="padding:4px 10px">7.2° : 360°</td><td style="padding:4px 6px">=</td><td style="padding:4px 10px">800 km : <span style="color:#c0392b">❓</span></td></tr>
          <tr><td style="padding:2px 10px;color:#2e9e63;font-size:14px">↓ ×50</td><td></td><td style="padding:2px 10px;color:#2e9e63;font-size:14px">↓ ×50</td></tr>
          <tr><td style="padding:4px 10px">360°</td><td></td><td style="padding:4px 10px;color:#c0392b">❓ km</td></tr>
        </table>
        <div class="cap" style="margin-top:8px">Multiply 7.2° <b>by 50</b> to get a full turn (360°) → <b>multiply 800 km by the same 50</b> to get the circumference!</div>
      </div>
      <canvas id="cvPie" style="width:100%;height:190px;margin-top:8px"></canvas></div>
     <div class="card"><div class="lbl">💡 Calculator: 800 × 50</div>${calcHTML()}
      <div class="cap">The Earth's circumference is…?</div>
      ${mc4([['40,000 km',true],['4,000 km',false],['400,000 km',false]],'e4pick2')}</div>`;
    drawPie(); cShow();
  } else if(m4step!==0&&m4step!==2){
    $('#readout').innerHTML=`<div class="nm">🎉 Secret of Maps — all solved!</div><div class="big">Earth's circumference = <b>40,000 km</b></div>`;
    $('#body').innerHTML=`<div class="card" style="text-align:center">
      <div style="font-size:64px;margin:6px">🌍</div>
      <div style="font-weight:800;font-size:17px">World map complete!</div>
      <div class="sc" style="display:inline-block;background:#fbf6e8;border:1.5px solid var(--gold);border-radius:9px;padding:6px 14px;margin:10px 0;font-weight:800">Scale 1 : 40,000,000</div>
      <div class="cap">The real circumference is 40,075 km — measured 2,200 years ago with one stick and <b>a ratio</b>.<br>
      Scale (1) → zooming (2) → the Earth (3)… all <b>the same secret of ratios</b>!</div>
      <button class="btn big" onclick="m4step=0;eSt=0;stage=1;s1done=[];s1idx=0;z2=100;z2q=0;cClear();render()" style="margin-top:8px">Explore again from the start</button></div>`;
  }
}
function drawPie(){const cv=$('#cvPie');if(!cv)return;const rect=cv.getBoundingClientRect();
  if(rect.width<8)return;
  const W=cv.width=Math.round(rect.width*2),H=cv.height=380;const ctx=cv.getContext('2d');ctx.clearRect(0,0,W,H);
  const cx=W/2,cy=H/2,R=H*0.40;
  ctx.fillStyle='#dfe9f5';ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();
  // 50조각 눈금
  ctx.strokeStyle='#b9c9de';ctx.lineWidth=2;
  for(let i=0;i<50;i++){const a=-Math.PI/2+i*Math.PI*2/50;
    ctx.beginPath();ctx.moveTo(cx+R*0.86*Math.cos(a),cy+R*0.86*Math.sin(a));ctx.lineTo(cx+R*Math.cos(a),cy+R*Math.sin(a));ctx.stroke();}
  ctx.strokeStyle='#9fb6d4';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();
  // 800km 조각(1/50)
  ctx.fillStyle='#c0392b';ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,-Math.PI/2,-Math.PI/2+Math.PI*2/50);ctx.closePath();ctx.fill();
  ctx.fillStyle='#c0392b';ctx.font='bold 24px sans-serif';ctx.textAlign='center';
  ctx.fillText('the 800 km slice',cx+R*0.55,cy-R*1.05);
  ctx.fillStyle='#26303f';ctx.font='bold 28px sans-serif';
  ctx.fillText('50 slices = one full turn!',cx,cy+10);}
function e4pick2(el){const ok=el.dataset.ok==='1';plog(ok?'earthDone':'earthRetry',{pick:el.textContent});
  if(ok){m4step=3;try{parent.postMessage({type:'mapLabDone'},'*');}catch(e){}
    chime();banner('You measured the Earth!! 🌍',`7.2° : 360° = 800 : <b>40,000</b> — the real value is 40,075 km, only 0.2% off!`+'<br><div style="margin-top:10px;font-weight:800">📝 Write one sentence about the <b>secret of ratios</b> you found in maps today!</div><input id="rfx" type="text" maxlength="100" placeholder="e.g., A map shrinks the real world by one ratio!" style="width:100%;max-width:430px;margin-top:6px;padding:10px;border:1.5px solid #bfe6cf;border-radius:10px;font-size:14px;font-weight:600">',[['Leave a sentence & finish! 🌍',()=>{const _r=document.querySelector('#rfx');plog('reflection',{text:(_r&&_r.value||'').slice(0,100)});hideBanner();render();}]]);}
  else banner('Try again!','The angle is ×50, so the distance is ×50 — calculate <b>800 × 50</b>.',[['Retry',hideBanner]]);}

/* ══════ 계산기 (공용) ══════ */
let cDisp='0', cAcc=null, cOp=null, cFresh=true;
function cShow(){const d=$('#cd');if(!d)return;
  let s;if(cOp&&cAcc!==null){s=cAcc+' '+cOp+(cFresh?'':' '+cDisp);}else s=cDisp;
  d.textContent=s;}
function cD(d){if(cFresh){cDisp=String(d);cFresh=false;}else{cDisp=(cDisp==='0'?'':cDisp)+d;}cShow();}
function cDot(){if(cFresh){cDisp='0.';cFresh=false;}else if(!cDisp.includes('.'))cDisp+='.';cShow();}
function cCompute(){const y=parseFloat(cDisp);let r=cAcc;if(cOp==='×')r=cAcc*y;else if(cOp==='÷')r=cAcc/y;r=Math.round(r*10000)/10000;cDisp=String(r);cAcc=r;cShow();}
function cO(op){if(cOp!==null&&!cFresh)cCompute();cAcc=parseFloat(cDisp);cOp=op;cFresh=true;cShow();}
function cEq(){if(cOp!==null){cCompute();cOp=null;cFresh=true;cShow();}}
function cClear(){cDisp='0';cAcc=null;cOp=null;cFresh=true;cShow();}
function calcHTML(){const b=(t,f,c)=>`<button class="cbtn ${c||''}" onclick="${f}">${t}</button>`;
  return `<div class="calc"><div class="calcdisp" id="cd">${cDisp}</div><div class="calcgrid">
   ${b('7','cD(7)')}${b('8','cD(8)')}${b('9','cD(9)')}${b('÷',"cO('÷')",'op')}
   ${b('4','cD(4)')}${b('5','cD(5)')}${b('6','cD(6)')}${b('×',"cO('×')",'op')}
   ${b('1','cD(1)')}${b('2','cD(2)')}${b('3','cD(3)')}${b('C','cClear()','op')}
   ${b('0','cD(0)')}${b('.','cDot()')}${b('=','cEq()','op wide')}</div></div>`;}

function render(){renderStage();({1:renderScale,2:renderZoom,4:render4}[stage])();}
window.addEventListener('resize',()=>{if(stage===4&&m4step===2)drawPie();});
render();
/* 숨김 iframe으로 로드된 경우: 보이게 되면 1회 다시 그림 */
let _vchk=setInterval(()=>{
  if(document.body.getBoundingClientRect().width>8){ if(stage===4)render4(); clearInterval(_vchk); }},350);
</script>
