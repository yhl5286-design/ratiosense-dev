<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RatioSense 심화 — 지도의 비밀</title>
<link rel="stylesheet" href="_ds/organic-3a905540-269d-4093-86d4-de60cd03c54c/styles.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* v5 심화판 허브 — 지도의 비밀 한 방만 둔다.
     사용성 평가(v4) 범위 밖이므로 식별 코드를 받지 않고 기록도 보내지 않는다.
     v4와 같은 사이트 주소를 쓰므로 localStorage의 rs3_user를 건드리지 않는다(v4 학생 코드 보호). */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}body{min-height:100dvh}
  body{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400;
    background:var(--color-bg);color:var(--color-text);display:flex;align-items:center;justify-content:center}
  b,strong{font-weight:700;color:var(--color-accent-700)}
  :focus-visible{outline:3px solid var(--color-accent);outline-offset:3px}
  .wrap{text-align:center;padding:var(--space-6) var(--space-3);max-width:980px;width:100%}
  h1{font-family:'Do Hyeon','Noto Sans KR',sans-serif;font-weight:400;font-size:42px;margin:0 0 4px;letter-spacing:0}
  .sub{font-size:18px;color:var(--color-neutral-700);font-weight:700;margin-bottom:var(--space-4)}
  .rooms{display:grid;grid-template-columns:minmax(200px,300px);justify-content:center;gap:var(--space-3);margin:0 auto}
  .room{display:block;position:relative;background:var(--color-neutral-100);border:3px solid var(--color-accent-2-500);
    border-radius:calc(var(--radius-lg) * 1.15);padding:var(--space-6) var(--space-3) var(--space-4);
    text-decoration:none;color:var(--color-text);transition:transform .15s ease,box-shadow .15s ease;box-shadow:var(--shadow-md)}
  a.room:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);color:var(--color-text)}
  .room .em{font-size:56px;line-height:1.2}
  .room .nm{font-family:'Do Hyeon','Noto Sans KR',sans-serif;font-size:21px;margin-top:8px}
  .room .ds{font-size:14px;color:var(--color-neutral-700);font-weight:700;margin-top:6px;line-height:1.6}
  .foot{margin-top:var(--space-6);font-size:13.5px;font-weight:700;color:var(--color-neutral-600)}
</style>
</head>
<body>
<div class="wrap">
  <h1>RatioSense 심화</h1>
  <div class="sub">비(比)의 비밀을 한 걸음 더 — <b>지도의 비밀</b></div>
  <div class="rooms">
    <a class="room" href="MapRoom.dc.html"><div class="em">🗺️</div><div class="nm">지도의 비밀</div><div class="ds">축척으로 마을을,<br>비로 지구를 재요</div></a>
  </div>
  <div class="foot">심화 학습판 — 활동 기록이 남지 않아요</div>
</div>
</body>
</html>
