<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RatioSense v3 — 지도의 비밀</title>
<style>
  :root{--bg:#f4f1ea;--ink:#26303f;--sub:#6b7683;--line:#e6e1d6;--accent:#2e9e63;--gold:#e0a02a;--red:#c0392b}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
  #top{position:fixed;left:0;right:0;top:0;height:64px;background:#fff;border-bottom:2px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 26px;z-index:10}
  #top .t{font-size:22px;font-weight:800;white-space:nowrap}
  #top a{color:var(--sub);text-decoration:none}
  #pbar{flex:1;height:14px;background:#ece8dd;border-radius:7px;overflow:hidden}
  #pfill{height:100%;width:0%;background:linear-gradient(90deg,#2e9e63,#5cc98d);transition:width .4s}
  #pnum{font-size:19px;font-weight:800;color:var(--sub)}
  #stage{position:absolute;inset:64px 0 0 0;display:flex;align-items:center;justify-content:center;overflow:auto}
  .slide{width:min(980px,94vw);padding:20px 10px 40px;text-align:center;animation:in .35s ease both}
  @keyframes in{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
  .q{font-size:clamp(23px,3.2vw,32px);font-weight:800;line-height:1.55;margin:6px 0 8px}
  .q b{color:#b3541e}
  .sub{font-size:clamp(17px,2vw,21px);color:var(--sub);font-weight:700;margin-bottom:12px}
  .btn{border:2.5px solid var(--line);background:#fff;border-radius:16px;padding:15px 28px;font-weight:800;font-size:21px;cursor:pointer;margin:6px}
  .btn:hover{background:#fbf6e8}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-size:23px;padding:18px 44px}
  .btn.pri:hover{background:#288a56}
  .choices{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .choices .btn{min-width:150px;font-size:23px}
  .pctbtn{border:3px solid var(--line);background:#fff;border-radius:14px;padding:12px 24px;font-weight:800;font-size:22px;cursor:pointer;margin:4px}
  .pctbtn.on{border-color:var(--accent);background:#eaf7ef;color:#136a3d}
  .mapbox{position:relative;border:3px solid #cdc6b8;border-radius:14px;background:#eef3e4;margin:10px auto;overflow:auto;max-width:94%}
  .mapgrid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(60,90,140,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(60,90,140,.18) 1px,transparent 1px)}
  .lbl-chip{position:absolute;background:rgba(255,255,255,.94);border:1.5px solid #cdc6b8;border-radius:10px;padding:3px 12px;font-size:17px;font-weight:800;white-space:nowrap;z-index:5}
  .scaleinfo{font-size:19px;font-weight:800;margin-top:8px}
  .scaleinfo .sc{background:#fbf6e8;border:2px solid var(--gold);border-radius:10px;padding:5px 14px;margin-right:10px}
  .hintbox{font-size:19px;color:var(--sub);font-weight:700;background:#fbf6e8;border:2px solid #e0c98a;border-radius:14px;padding:10px 18px;display:inline-block;margin-top:8px}
  .prop{background:#eef4fb;border:2.5px solid #b8cfec;border-radius:16px;padding:16px;display:inline-block;margin:8px 0}
  .prop table{border-collapse:collapse;font-size:24px;font-weight:800}
  .prop td{padding:6px 14px}
  .prop .small{font-size:16px;color:var(--sub)}
  .prop .x50{color:var(--accent);font-size:19px}
  .nav{position:fixed;top:50%;transform:translateY(-50%);width:64px;height:64px;border-radius:50%;border:3px solid var(--line);background:#fff;font-size:34px;font-weight:800;color:var(--sub);cursor:pointer;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center}
  .nav:hover{background:#fbf6e8;color:var(--ink)}
  #navL{left:14px}#navR{right:14px}.nav.off{opacity:.25;pointer-events:none}
  #fb{position:fixed;inset:0;background:rgba(38,48,63,.45);display:none;align-items:center;justify-content:center;z-index:50}
  #fb.show{display:flex}
  #fb .in{background:#fff;border-radius:26px;max-width:620px;width:92vw;padding:38px 34px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.35);border-top:8px solid var(--accent);animation:pop .3s ease}
  #fb.help .in{border-top-color:var(--gold)}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
  #fbT{font-size:30px;font-weight:800;margin-bottom:10px}
  #fbS{font-size:21px;line-height:1.8;color:#41506b;font-weight:600}
  #fbA{margin-top:22px}
  .dz{display:inline-block;min-width:92px;min-height:34px;border-bottom:4px solid var(--gold);background:#fffbef;border-radius:10px 10px 0 0;padding:3px 12px;text-align:center;font-weight:800;color:#b3541e;vertical-align:bottom;cursor:pointer;font-size:21px}
  .dz.sel{background:#ffe9a8;outline:3px dashed var(--gold)}
  .dz.okk{border-color:var(--accent);background:#eaf7ef;color:#136a3d}
  .dz.bad{border-color:var(--red);background:#fdeeec;color:var(--red)}
  .bank{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  .chip{border:3px solid var(--gold);background:#fff;border-radius:16px;padding:11px 20px;font-size:21px;font-weight:800;cursor:grab;user-select:none;touch-action:none}
  .chip:hover{background:#fffbef}
  .chip.used{visibility:hidden}
  #ghost{position:fixed;pointer-events:none;z-index:99;opacity:.9}
  .sumbox{background:#fff;border:3px solid var(--line);border-radius:20px;padding:20px 24px;display:inline-block;text-align:left;margin:8px 0;max-width:780px}
  .sumbox .row{font-size:21px;font-weight:800;line-height:2.6}
  .dz{transition:transform .15s,background .15s}
  .dz.hov{background:#ffe9a8;transform:scale(1.12);outline:3px dashed var(--gold)}
  .dz.snap{animation:snapIn .3s}
  @keyframes snapIn{0%{transform:scale(1.35)}60%{transform:scale(.94)}100%{transform:none}}
  .dz.shake{animation:shk .45s}
  @keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  .cfp{position:fixed;top:-16px;width:12px;height:18px;z-index:120;border-radius:3px;pointer-events:none;animation:cfall linear forwards}
  @keyframes cfall{to{transform:translateY(108vh) rotate(560deg)}}
  .stampb{display:inline-block;animation:stampIn .55s cubic-bezier(.2,1.4,.4,1)}
  @keyframes stampIn{0%{transform:scale(3) rotate(-25deg);opacity:0}70%{transform:scale(.92) rotate(3deg);opacity:1}100%{transform:none}}
  .home{display:inline-flex;align-items:center;gap:8px;font-size:21px;font-weight:800;color:var(--ink);text-decoration:none;border:3px solid var(--line);border-radius:14px;padding:9px 18px;background:#fff;white-space:nowrap}
  .home:hover{background:#fbf6e8;border-color:var(--gold)}
</style>
</head>
<body>
<div id="top"><a class="home" href="index.html">🏠 홈</a><div class="t">🗺️ 지도의 비밀 <span style="color:#b3541e">v3</span></div><div id="pbar"><div id="pfill"></div></div><div id="pnum"></div></div>
<div id="stage"><div class="slide" id="slide"></div></div>
<button class="nav" id="navL">‹</button><button class="nav" id="navR">›</button>
<div id="fb"><div class="in"><div id="fbT"></div><div id="fbS"></div><div id="fbA"></div></div></div>
<script>
const $=s=>document.querySelector(s);
/* ── 로그: GAS 직접 전송 (v2와 같은 시트) ── */
const LOG_EP='https://script.google.com/macros/s/AKfycbw_-WjYHiIiDEGX_F0eLEfIn14iY-GIWr6NTcZbpMlIlp-7hTc6CFDAA848NdprWKw7/exec';
const LOG_TK='ratiosense-2026',LAB='mapV3';
let RS3U='';try{RS3U=(JSON.parse(localStorage.getItem('rs3_user')||'null')||{}).code||'';}catch(e){}
if(!RS3U&&window===window.parent){try{location.replace('index.html');}catch(e){}}
const SESS3='x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
let SEQ3=0,LQ3=[];
function luid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function lsend(bea){try{
  if(!LQ3.length)return;
  const batch=LQ3.splice(0),body=JSON.stringify({token:LOG_TK,records:batch});
  if(bea&&navigator.sendBeacon){
    if(!navigator.sendBeacon(LOG_EP,new Blob([body],{type:'text/plain'})))LQ3.unshift(...batch);
    return;}
  fetch(LOG_EP,{method:'POST',headers:{'Content-Type':'text/plain'},body})
    .catch(()=>{LQ3.unshift(...batch);});
}catch(e){}}
setInterval(()=>lsend(),5000);
addEventListener('pagehide',()=>lsend(true));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')lsend(true);});
function plog(ev,data){
  try{if(window!==window.parent)parent.postMessage({type:'pilotLog',lab:LAB,event:ev,data:data||{}},'*');}catch(e){}
  try{if(RS3U==='guest')return;
    LQ3.push({_t:'events',schemaVersion:'1',sessionId:SESS3,userCode:RS3U,userName:'',seq:++SEQ3,
      clientTs:new Date().toISOString(),eventId:luid(),tab:LAB,
      eventType:'pilot.'+LAB+'.'+ev,payload:JSON.stringify(data||{})});
    if(LQ3.length>=10)lsend();}catch(e){}}
plog('enter',{ua:navigator.userAgent.slice(0,80)});
function addCards(ids){try{const a=JSON.parse(localStorage.getItem('rs3_cards')||'[]');
  ids.forEach(i=>{if(!a.includes(i))a.push(i);});localStorage.setItem('rs3_cards',JSON.stringify(a));}catch(e){}}
function confetti(){try{
  for(let i=0;i<28;i++){const s=document.createElement('div');s.className='cfp';
    s.style.left=(4+Math.random()*92)+'vw';
    s.style.background=['#e76f51','#e9c46a','#2a9d8f','#7b6cff','#e63980','#2e9e63'][i%6];
    s.style.animationDelay=(Math.random()*0.5)+'s';s.style.animationDuration=(1.2+Math.random()*1.2)+'s';
    document.body.appendChild(s);setTimeout(()=>s.remove(),3400);}}catch(e){}}
function markDone(r){try{const a=JSON.parse(localStorage.getItem('rs3_done')||'[]');if(!a.includes(r))a.push(r);localStorage.setItem('rs3_done',JSON.stringify(a));}catch(e){}}

let AC;const ac=()=>AC||(AC=new(window.AudioContext||window.webkitAudioContext)());
function tone(f,w,d){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,c.currentTime+w);g.gain.linearRampToValueAtTime(.15,c.currentTime+w+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+w+d);o.start(c.currentTime+w);o.stop(c.currentTime+w+d);}catch(e){}}
function jga(w){const c=w.charCodeAt(w.length-1);return ((c-0xAC00)%28>0)?'이':'가';}
function jzz(w){const c=w.charCodeAt(w.length-1);return ((c-0xAC00)%28>0)?'은':'는';}
function chime(ok){ok?(tone(523,0,.2),tone(659,.2,.2),tone(784,.4,.42)):(tone(392,0,.16),tone(349,.16,.2));}

const OBJS=[
 {em:'🌉',n:'다리',shape:'직사각형',dim:'길이',real:300,cells:3,x:2,y:4},
 {em:'💧',n:'호수',shape:'원',dim:'지름',real:100,cells:1,x:6,y:1.6},
 {em:'🌳',n:'공원',shape:'삼각형',dim:'밑변',real:500,cells:5,x:1,y:5.6}];
let placed=0;
function townMap(f){f=f||1;const C=50*f;
  let o=`<div style="position:absolute;left:0;top:${C*3.9}px;width:${C*8}px;height:${C}px;background:linear-gradient(#bcd9f0,#9ec4e4);opacity:.85"></div>`;
  OBJS.forEach((ob,i)=>{if(i>=placed)return;
    let shape='';
    if(ob.shape==='직사각형')shape=`<div style="position:absolute;left:${C*ob.x}px;top:${C*ob.y}px;width:${C*ob.cells}px;height:${C*0.8}px;background:#9a7b4f;border:3px solid #6d5432;background-image:repeating-linear-gradient(90deg,transparent 0 ${C*0.28}px,rgba(255,255,255,.35) ${C*0.28}px ${C*0.33}px)"></div>`;
    else if(ob.shape==='원')shape=`<div style="position:absolute;left:${C*ob.x}px;top:${C*ob.y}px;width:${C*ob.cells}px;height:${C*ob.cells}px;background:radial-gradient(circle at 35% 30%,#9ecbee,#5b93c9);border-radius:50%;border:3px solid #3e6f9e"></div>`;
    else shape=`<div style="position:absolute;left:${C*ob.x}px;top:${C*(ob.y-1.1)}px;width:0;height:0;border-left:${C*ob.cells/2}px solid transparent;border-right:${C*ob.cells/2}px solid transparent;border-bottom:${C*1.5}px solid #5e9a5e;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))"></div>
      <div style="position:absolute;left:${C*ob.x}px;top:${C*(ob.y+0.36)}px;width:${C*ob.cells}px;border-bottom:3.5px solid #2e5c2e"></div>`;
    const lb=(ob.x>=4.5)?`right:${Math.max(2,C*(8-ob.x-ob.cells))}px`:`left:${C*ob.x}px`;
    o+=shape+`<div class="lbl-chip" style="${lb};top:${C*(ob.y-(ob.shape==='삼각형'?1.65:0.62))}px">${ob.em} ${ob.shape} ${ob.n} · ${ob.cells}칸</div>`;});
  return `<div class="mapbox" style="width:${C*8+4}px;height:${C*8+4}px;max-height:min(62vh,${C*8+4}px)">
    <div class="mapgrid" style="background-size:${C}px ${C}px;width:${C*8}px;height:${C*8}px"></div>${o}</div>`;}
function comicSVG(){
 const panel=(title,body,caption)=>`
 <div style="flex:1;min-width:280px;max-width:430px">
  <svg viewBox="0 0 340 280" style="width:100%;background:#fffdf6;border:2.5px solid #26303f;border-radius:10px">${
   `<text x="12" y="24" font-size="15" font-weight="800" fill="#26303f">${title}</text>`+body}</svg>
  <div style="font-size:14.5px;font-weight:700;color:#6b7683;margin-top:3px;text-align:center">${caption}</div>
 </div>`;
 const bubble=(x,y,w,h,lines,tailX)=>`
  <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="#fff" stroke="#26303f" stroke-width="2"/>
  <path d="M${tailX} ${y+h} l9 16 l9 -16 Z" fill="#fff" stroke="#26303f" stroke-width="2"/>
  <rect x="${tailX+1}" y="${y+h-4}" width="16" height="5" fill="#fff"/>
  ${lines.map((l,i)=>`<text x="${x+w/2}" y="${y+22+i*20}" text-anchor="middle" font-size="13.5" font-weight="800" fill="#26303f">${l}</text>`).join('')}`;
 const c1=panel('컷 1 · 궁금한 학자',
  `<text x="95" y="215" text-anchor="middle" font-size="72">🧔</text>
   <text x="95" y="245" text-anchor="middle" font-size="14" font-weight="800" fill="#6b7683">에라토스테네스</text>
   <text x="255" y="220" text-anchor="middle" font-size="40" fill="#8a6a34">❓🌍</text>
   ${bubble(30,46,280,84,['"지구 한 바퀴는 얼마나 될까?','내가 가진 건','그림자와 거리뿐인데…"'],140)}`,
  '2200년 전 그리스, 한 학자가 지구의 크기를 궁금해했어요');
 const c2=panel('컷 2 · 시에네의 우물 (여름 낮 12시)',
  `<circle cx="300" cy="46" r="17" fill="#ffd34d"/>
   <line x1="300" y1="66" x2="300" y2="96" stroke="#e0a02a" stroke-width="3"/>
   <rect x="120" y="170" width="66" height="76" fill="#8a6a34" rx="5"/>
   <rect x="131" y="180" width="44" height="58" fill="#3c2c14" rx="4"/>
   <line x1="153" y1="96" x2="153" y2="232" stroke="#e0a02a" stroke-width="4"/>
   <text x="153" y="265" text-anchor="middle" font-size="13.5" font-weight="800">우물 바닥까지 햇빛이 쏙!</text>
   ${bubble(30,44,240,64,['"그림자가 하나도 없네?','해가 바로 머리 위라는 뜻!"'],120)}`,
  '시에네에서는 그림자 0° — 해가 정확히 머리 위!');
 const c3=panel('컷 3 · 같은 시각, 알렉산드리아',
  `<rect x="216" y="30" width="112" height="26" rx="13" fill="#c0392b"/>
   <text x="272" y="48" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">같은 날 같은 시각!</text>
   <line x1="150" y1="120" x2="150" y2="235" stroke="#26303f" stroke-width="7"/>
   <line x1="150" y1="235" x2="103" y2="235" stroke="#c0392b" stroke-width="7"/>
   <line x1="150" y1="120" x2="103" y2="235" stroke="#e0a02a" stroke-width="2.5" stroke-dasharray="5 4"/>
   <text x="163" y="158" font-size="15" font-weight="800" fill="#c0392b">7.2°</text>
   <text x="126" y="260" text-anchor="middle" font-size="13.5" font-weight="800">막대의 그림자</text>
   ${bubble(28,60,180,64,['"여긴 그림자가 생겼어!','재보니 7.2도!"'],100)}`,
  '북쪽 도시 알렉산드리아에서는 그림자가 7.2° 기울었어요');
 const c4=panel('컷 4 · 둥근 지구의 깨달음',
  `<circle cx="105" cy="190" r="62" fill="#bfe0c2" stroke="#7fae84" stroke-width="3"/>
   <path d="M105 190 L105 128 A62 62 0 0 0 76 135 Z" fill="rgba(224,160,42,.35)"/>
   <line x1="105" y1="190" x2="105" y2="128" stroke="#8a6a34" stroke-width="2.5" stroke-dasharray="6 4"/>
   <line x1="105" y1="190" x2="76" y2="135" stroke="#8a6a34" stroke-width="2.5" stroke-dasharray="6 4"/>
   <path d="M76 135 A62 62 0 0 1 105 128" fill="none" stroke="#c0392b" stroke-width="7"/>
   <text x="97" y="163" font-size="12.5" font-weight="800" fill="#8a6a34">7.2°</text>
   <text x="66" y="118" font-size="12.5" font-weight="800" fill="#c0392b">800km</text>
   <circle cx="105" cy="190" r="4" fill="#26303f"/>
   ${bubble(150,44,182,120,['"지구가 둥글기 때문이야!','두 도시가 벌어진 각 7.2°는','한 바퀴 360°의 딱 50분의 1!','360 ÷ 7.2 = 50"'],230)}`,
  '각도가 50분의 1이면, 두 도시 사이 거리도 지구 둘레의 50분의 1!');
 return `<div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">${c1}${c2}${c3}${c4}</div>`;}
const DECK=[
 {t:'intro'},
 {t:'scale',i:0,opts:[['3칸',1],['30칸',0],['5칸',0]]},
 {t:'scale',i:1,opts:[['1칸',1],['10칸',0],['2칸',0]]},
 {t:'scale',i:2,opts:[['5칸',1],['50칸',0],['4칸',0]]},
 {t:'zoom'},
 {t:'invar'},
 {t:'comic'},
 {t:'prop'},
 {t:'done'}];
let idx=0,z2=100;
function prog(){$('#pfill').style.width=(idx/(DECK.length-1)*100)+'%';$('#pnum').textContent=(idx+1)+' / '+DECK.length;
  $('#navL').className='nav'+(idx<=0?' off':'');$('#navR').className='nav'+(idx>=DECK.length-1?' off':'');}
function fb(cls,t,s,btnText,after){const b=$('#fb');b.className='show '+cls;
  $('#fbT').innerHTML=t;$('#fbS').innerHTML=s||'';
  $('#fbA').innerHTML=`<button class="btn pri" id="fbBtn">${btnText}</button>`;
  $('#fbBtn').onclick=()=>{b.className='';if(after)after();};}
function next(){idx=Math.min(idx+1,DECK.length-1);render();}
function success(t,s,after){chime(true);plog('success',{slide:idx});fb('','✅ '+t,s,'다음 →',after||next);}
function retry(s){chime(false);plog('retry',{slide:idx});fb('help','🤔 다시 한번!',s,'도전!',null);}
function mountDrag(el,onAll){
  let sel=null,drag=null;
  const dzs=[...el.querySelectorAll('.dz')],chips=[...el.querySelectorAll('.chip')];
  function allDone(){if(dzs.every(z=>z.classList.contains('okk')))setTimeout(onAll,380);}
  function judge(dz,ch){
    if(dz.classList.contains('okk')||ch.classList.contains('used'))return;
    if(ch.dataset.w===dz.dataset.a){
      dz.textContent=ch.dataset.w;ch.classList.add('used');
      dz.classList.remove('sel','hov');dz.classList.add('okk','snap');
      try{tone(880,0,.09);}catch(e){}
      setTimeout(()=>dz.classList.remove('snap'),320);
      if(sel===dz)sel=null;allDone();}
    else{dz.classList.remove('hov');dz.classList.add('bad','shake');
      try{tone(180,0,.2);}catch(e){}
      setTimeout(()=>dz.classList.remove('bad','shake'),480);}}
  dzs.forEach(dz=>{dz.onclick=()=>{if(dz.classList.contains('okk'))return;
    dzs.forEach(x=>x.classList.remove('sel'));dz.classList.add('sel');sel=dz;};});
  chips.forEach(ch=>{
    ch.onclick=()=>{if(ch.classList.contains('used'))return;
      const dz=(sel&&!sel.classList.contains('okk'))?sel:dzs.find(x=>!x.classList.contains('okk'));
      if(dz)judge(dz,ch);};
    ch.onpointerdown=e=>{if(ch.classList.contains('used'))return;e.preventDefault();
      const g=document.createElement('span');g.id='ghost';g.className='chip';g.textContent=ch.dataset.w;
      document.body.appendChild(g);drag={ch,g};
      g.style.left=(e.clientX-40)+'px';g.style.top=(e.clientY-24)+'px';};});
  document.onpointermove=e=>{if(!drag)return;
    drag.g.style.left=(e.clientX-40)+'px';drag.g.style.top=(e.clientY-24)+'px';
    dzs.forEach(z=>z.classList.remove('hov'));
    const under=document.elementFromPoint(e.clientX,e.clientY);
    const dz=under&&under.closest?under.closest('.dz'):null;
    if(dz&&!dz.classList.contains('okk'))dz.classList.add('hov');};
  document.onpointerup=e=>{if(!drag)return;
    const under=document.elementFromPoint(e.clientX,e.clientY);
    const dz=under&&under.closest?under.closest('.dz'):null;
    dzs.forEach(z=>z.classList.remove('hov'));
    if(dz)judge(dz,drag.ch);
    drag.g.remove();drag=null;};
  return {};}
function render(){prog();const d=DECK[idx];const el=$('#slide');
  if(d.t==='intro'){el.innerHTML=`<div style="font-size:90px">🗺️</div>

    el.innerHTML=`<div class="q">${ob.em} <b>${ob.shape} 모양의 ${ob.n}</b> — ${ob.dim}${jga(ob.dim)} 실제 <b>${ob.real}m</b>라면<br>지도에서 <b>몇 칸</b>일까요?</div>
      <div class="sub">축척의 비밀 ${d.i+1}/3 — 정답을 맞히면 지도에 그려져요!</div>
      ${townMap(1)}
      <div class="scaleinfo"><span class="sc">축척 1 : 10,000</span> 1칸 = 100m</div>
      <div class="hintbox">💡 ${ob.real}m ÷ 100m = ?</div>
      <div class="choices">${d.opts.slice().sort(()=>Math.random()-.5).map(o=>`<button class="btn" data-ok="${o[1]}">${o[0]}</button>`).join('')}</div>`;
    el.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{
      if(b.dataset.ok==='1'){placed=d.i+1;
        success(`맞았어요! ${ob.em} ${ob.n} = ${ob.cells}칸`,`${ob.real}m ÷ 100 = <b>${ob.cells}칸</b>.<br>지도 위 ${ob.shape}${jzz(ob.shape)} 실제 ${ob.n}와 <b>모양은 같고 크기만 줄인 닮은 도형</b>이에요!`);}
      else retry(`100m가 1칸 — <b>${ob.real} ÷ 100</b>을 생각해 보세요.`);});return;}
  if(d.t==='zoom'){placed=3;const f=z2/100;
    el.innerHTML=`<div class="q">배율을 눌러 <b>지도를 확대</b>해 보세요!<br><b>200%</b>로 확대하면, 지도 위 다리(3cm)는 <b>몇 cm</b>?</div>
      <div class="sub">모든 길이가 <b>같은 비</b>로 커져요</div>
      <div><button class="pctbtn ${z2===100?'on':''}" onclick="z2=100;render()">100%</button>
      <button class="pctbtn ${z2===200?'on':''}" onclick="z2=200;render()">200%</button></div>
      ${townMap(f)}
      <div class="scaleinfo"><span class="sc">배율 ${z2}% = ×${f}</span> 지도 위 다리: 3cm × ${f} = <b>${3*f}cm</b> · 축척 1 : ${(10000/f).toLocaleString()}</div>
      <div class="choices">${[['6cm',1],['3cm',0],['12cm',0]].sort(()=>Math.random()-.5).map(o=>`<button class="btn" data-ok="${o[1]}">${o[0]}</button>`).join('')}</div>`;
    el.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{
      b.dataset.ok==='1'?success('맞았어요! 6cm','200% = ×2 — 지도 위 길이가 <b>2배</b>! 3cm → <b>6cm</b>.')
        :retry('배율 버튼을 눌러 <b>지도 위 다리 길이</b>가 어떻게 변하는지 관찰해 보세요.');});return;}
  if(d.t==='invar'){
    el.innerHTML=`<div class="q">축척이 <b>1 : 10,000</b>인 지도에서<br>지도 위 길이 <b>10cm</b>는 실제로 얼마일까요?</div>
      <div class="sub">진짜 지도에 나오는 문제! — 실제 길이는 지도 길이의 10,000배예요</div>
      <div class="choices">${[['1km',1],['100m',0],['10km',0]].sort(()=>Math.random()-.5).map(o=>`<button class="btn" data-ok="${o[1]}">${o[0]}</button>`).join('')}</div>`;
    el.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{
      b.dataset.ok==='1'?success('맞았어요! 1km!','10cm × 10,000 = 100,000cm = 1,000m = <b>1km</b>.<br>지도 10cm가 실제로는 <b>걸어서 15분</b> 거리예요!')
        :retry('10cm의 <b>10,000배</b>를 구한 뒤, cm → m → km로 단위를 바꿔 보세요.<br>(100cm = 1m, 1,000m = 1km)');});return;}
  if(d.t==='comic'){el.innerHTML=`<div class="q">🌍 2200년 전, 에라토스테네스는<br><b>막대기 하나</b>로 지구를 쟀어요!</div>

      <button class="btn pri" onclick="next()">비로 계산해 보기! ✏️</button>`;return;}
  if(d.t==='prop'){el.innerHTML=`<div class="q">각도가 50배면, 거리도 50배!<br>그럼 <b>지구 둘레</b>는 몇 km?</div>
      <div class="prop"><table>
        <tr><td class="small">각도의 비</td><td></td><td class="small">거리의 비</td></tr>
        <tr><td>7.2° : 360°</td><td>=</td><td>800km : <span style="color:var(--red)">❓</span></td></tr>
        <tr><td class="x50">↓ ×50</td><td></td><td class="x50">↓ ×50</td></tr>
        <tr><td>360°</td><td></td><td style="color:var(--red)">❓ km</td></tr>
      </table></div>
      <div class="hintbox">💡 800 × 50</div>
      <div class="choices">${[['40,000 km',1],['4,000 km',0],['400,000 km',0]].sort(()=>Math.random()-.5).map(o=>`<button class="btn" data-ok="${o[1]}">${o[0]}</button>`).join('')}</div>`;
    el.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{
      b.dataset.ok==='1'?success('지구를 쟀어요!! 🌍','7.2° : 360° = 800 : <b>40,000</b> — 실제 값 40,075km, 오차 0.2%!<br>막대기 하나와 <b>비</b>만으로 지구를 쟀어요!')
        :retry('각도가 50배니까 거리도 50배 — <b>800 × 50</b>!');});return;}
  if(d.t==='done'){
    const WORDS=["비율", "100", "닮은", "차이", "비"].sort(()=>Math.random()-.5);
    el.innerHTML=`<div style="font-size:80px">🎉</div>
    <div class="q">지도의 비밀을 모두 찾아냈군요! 대단해요!</div>
    <div class="sub"><b>지도의 비밀은 무엇인가요?</b> 아래 <b>낱말 카드</b>를 빈칸에 끌어다 놓아(또는 눌러서) 문장을 완성하세요!</div>
    <div class="sumbox"><div class="row">지도는 실제를 같은 (<span class="dz" data-a="비율"></span>)로 줄인 것이다.</div><div class="row">축척 1:10,000에서 지도 1cm는 실제 (<span class="dz" data-a="100"></span>)m이다.</div><div class="row">지도 위 도형은 실제와 모양이 같은 (<span class="dz" data-a="닮은"></span>) 도형이다.</div></div>
    <div class="bank">${WORDS.map((w,i)=>`<span class="chip" data-w="${w}" data-c="${i}">${w}</span>`).join('')}</div>`;
    mountDrag(el,()=>{plog('summary',{a:[...el.querySelectorAll('.dz')].map(z=>z.textContent)});markDone('map');addCards(['map0','map1','map2']);confetti();chime(true);
      fb('','🏆 지도의 비밀 완주!','<div style="margin-bottom:6px"><span class="stampb" style="font-size:52px">🗺️</span></div>🃏 비밀 카드 3장 획득! — 마지막 탐험은 <b>🛒 마트의 비밀</b>!','다음 방으로 →',()=>{location.href='mart.html';});});

}
