<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RatioSense v3 — 지도의 비밀</title>
<style>
  :root{--bg:#f4f1ea;--ink:#26303f;--sub:#6b7683;--line:#e6e1d6;--accent:#2e9e63;--gold:#e0a02a;--red:#c0392b}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
  #top{position:fixed;left:0;right:0;top:0;height:64px;background:#fff;border-bottom:2px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 26px;z-index:10}
  #top .t{font-size:22px;font-weight:800;white-space:nowrap}
  #top a{color:var(--sub);text-decoration:none}
  #pbar{flex:1;height:14px;background:#ece8dd;border-radius:7px;overflow:hidden}
  #pfill{height:100%;width:0%;background:linear-gradient(90deg,#2e9e63,#5cc98d);transition:width .4s}
  #pnum{font-size:19px;font-weight:800;color:var(--sub)}
  #stage{position:absolute;inset:64px 0 0 0;display:flex;align-items:center;justify-content:center;overflow:auto}
  .slide{width:min(980px,94vw);padding:20px 10px 40px;text-align:center;animation:in .35s ease both}
  @keyframes in{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
  .q{font-size:clamp(23px,3.2vw,32px);font-weight:800;line-height:1.55;margin:6px 0 8px}
  .q b{color:#b3541e}
  .sub{font-size:clamp(17px,2vw,21px);color:var(--sub);font-weight:700;margin-bottom:12px}
  .btn{border:2.5px solid var(--line);background:#fff;border-radius:16px;padding:15px 28px;font-weight:800;font-size:21px;cursor:pointer;margin:6px}
  .btn:hover{background:#fbf6e8}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-size:23px;padding:18px 44px}
  .btn.pri:hover{background:#288a56}
  .choices{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .choices .btn{min-width:150px;font-size:23px}
  .pctbtn{border:3px solid var(--line);background:#fff;border-radius:14px;padding:12px 24px;font-weight:800;font-size:22px;cursor:pointer;margin:4px}
  .pctbtn.on{border-color:var(--accent);background:#eaf7ef;color:#136a3d}
  .mapbox{position:relative;border:3px solid #cdc6b8;border-radius:14px;background:#eef3e4;margin:10px auto;overflow:auto;max-width:94%}
  .mapgrid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(60,90,140,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(60,90,140,.18) 1px,transparent 1px)}
  .lbl-chip{position:absolute;background:rgba(255,255,255,.94);border:1px solid #cdc6b8;border-radius:8px;padding:2px 9px;font-size:14px;font-weight:800;white-space:nowrap;z-index:5}
  .scaleinfo{font-size:19px;font-weight:800;margin-top:8px}
  .scaleinfo .sc{background:#fbf6e8;border:2px solid var(--gold);border-radius:10px;padding:5px 14px;margin-right:10px}
  .hintbox{font-size:19px;color:var(--sub);font-weight:700;background:#fbf6e8;border:2px solid #e0c98a;border-radius:14px;padding:10px 18px;display:inline-block;margin-top:8px}
  .prop{background:#eef4fb;border:2.5px solid #b8cfec;border-radius:16px;padding:16px;display:inline-block;margin:8px 0}
  .prop table{border-collapse:collapse;font-size:24px;font-weight:800}
  .prop td{padding:6px 14px}
  .prop .small{font-size:16px;color:var(--sub)}
  .prop .x50{color:var(--accent);font-size:19px}
  .nav{position:fixed;top:50%;transform:translateY(-50%);width:64px;height:64px;border-radius:50%;border:3px solid var(--line);background:#fff;font-size:34px;font-weight:800;color:var(--sub);cursor:pointer;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center}
  .nav:hover{background:#fbf6e8;color:var(--ink)}
  #navL{left:14px}#navR{right:14px}.nav.off{opacity:.25;pointer-events:none}
  #fb{position:fixed;inset:0;background:rgba(38,48,63,.45);display:none;align-items:center;justify-content:center;z-index:50}
  #fb.show{display:flex}
  #fb .in{background:#fff;border-radius:26px;max-width:620px;width:92vw;padding:38px 34px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.35);border-top:8px solid var(--accent);animation:pop .3s ease}
  #fb.help .in{border-top-color:var(--gold)}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
  #fbT{font-size:30px;font-weight:800;margin-bottom:10px}
  #fbS{font-size:21px;line-height:1.8;color:#41506b;font-weight:600}
  #fbA{margin-top:22px}
</style>
</head>
<body>
<div id="top"><div class="t"><a href="index.html">🏠</a> 🗺️ 지도의 비밀 <span style="color:#b3541e">v3</span></div><div id="pbar"><div id="pfill"></div></div><div id="pnum"></div></div>
<div id="stage"><div class="slide" id="slide"></div></div>
<button class="nav" id="navL">‹</button><button class="nav" id="navR">›</button>
<div id="fb"><div class="in"><div id="fbT"></div><div id="fbS"></div><div id="fbA"></div></div></div>
<script>
const $=s=>document.querySelector(s);
function plog(ev,data){try{parent.postMessage({type:'pilotLog',lab:'mapV3',event:ev,data:data||{}},'*');}catch(e){}}
let AC;const ac=()=>AC||(AC=new(window.AudioContext||window.webkitAudioContext)());
function tone(f,w,d){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,c.currentTime+w);g.gain.linearRampToValueAtTime(.15,c.currentTime+w+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+w+d);o.start(c.currentTime+w);o.stop(c.currentTime+w+d);}catch(e){}}
function chime(ok){ok?(tone(523,0,.2),tone(659,.2,.2),tone(784,.4,.42)):(tone(392,0,.16),tone(349,.16,.2));}

const OBJS=[
 {em:'🌉',n:'다리',real:300,cells:3,x:2,y:4},
 {em:'🏫',n:'학교 운동장',real:100,cells:1,x:6,y:2},
 {em:'🛣',n:'큰길',real:500,cells:5,x:1,y:6}];
let placed=0;
function townMap(f){f=f||1;const C=34*f;
  let o=`<div style="position:absolute;left:0;top:${C*3.9}px;width:${C*8}px;height:${C}px;background:linear-gradient(#bcd9f0,#9ec4e4);opacity:.85"></div>`;
  OBJS.forEach((ob,i)=>{if(i>=placed)return;
    let shape='';
    if(ob.n==='다리')shape=`<div style="position:absolute;left:${C*ob.x}px;top:${C*ob.y}px;width:${C*ob.cells}px;height:${C*0.8}px;background:#9a7b4f;border-top:3px solid #6d5432;border-bottom:3px solid #6d5432;background-image:repeating-linear-gradient(90deg,transparent 0 ${C*0.28}px,rgba(255,255,255,.35) ${C*0.28}px ${C*0.33}px)"></div>`;
    else if(ob.n==='큰길')shape=`<div style="position:absolute;left:${C*ob.x}px;top:${C*ob.y}px;width:${C*ob.cells}px;height:${C*0.8}px;background:#8f9aa8;background-image:repeating-linear-gradient(90deg,transparent 0 ${C*0.35}px,#f4e37a ${C*0.35}px ${C*0.55}px);background-size:100% 3px;background-position:center;background-repeat:no-repeat"></div>`;
    else shape=`<div style="position:absolute;left:${C*ob.x}px;top:${C*ob.y}px;width:${C*ob.cells}px;height:${C*0.8}px;background:#c96b6b;border-radius:50%;border:2.5px solid #a34d4d"></div>`;
    const lb=(ob.x>=4.5)?`right:${Math.max(2,C*(8-ob.x-ob.cells))}px`:`left:${C*ob.x}px`;
    o+=shape+`<div class="lbl-chip" style="${lb};top:${C*(ob.y-0.62)}px">${ob.em} ${ob.n} · ${ob.cells}칸</div>`;});
  return `<div class="mapbox" style="width:${C*8+4}px;height:${Math.min(C*8+4,340)}px">
    <div class="mapgrid" style="background-size:${C}px ${C}px;width:${C*8}px;height:${C*8}px"></div>${o}</div>`;}
function comicSVG(){return `
<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
 <svg viewBox="0 0 340 305" style="flex:1;min-width:260px;max-width:400px;background:#fffdf6;border:2.5px solid #26303f;border-radius:10px">
   <text x="12" y="24" font-size="15" font-weight="800" fill="#26303f">컷 1 · 같은 날 정오, 두 도시</text>
   <circle cx="302" cy="44" r="16" fill="#ffd34d"/>
   <rect x="42" y="196" width="44" height="56" fill="#8a6a34" rx="4"/><rect x="50" y="204" width="28" height="40" fill="#3c2c14" rx="3"/>
   <line x1="64" y1="140" x2="64" y2="204" stroke="#e0a02a" stroke-width="3"/>
   <text x="64" y="272" text-anchor="middle" font-size="13" font-weight="800">시에네 우물</text>
   <text x="64" y="290" text-anchor="middle" font-size="12.5" font-weight="800" fill="#2e9e63">그림자 0°</text>
   <line x1="232" y1="158" x2="232" y2="252" stroke="#26303f" stroke-width="6"/>
   <line x1="232" y1="252" x2="196" y2="252" stroke="#c0392b" stroke-width="6"/>
   <line x1="232" y1="158" x2="196" y2="252" stroke="#e0a02a" stroke-width="2" stroke-dasharray="4 3"/>
   <text x="240" y="186" font-size="13.5" font-weight="800" fill="#c0392b">7.2°</text>
   <text x="232" y="272" text-anchor="middle" font-size="13" font-weight="800">알렉산드리아 막대</text>
   <text x="232" y="290" text-anchor="middle" font-size="12.5" font-weight="800" fill="#c0392b">그림자 7.2°</text>
   <rect x="52" y="54" width="216" height="58" rx="12" fill="#fff" stroke="#26303f" stroke-width="2"/>
   <path d="M150 112 l10 16 l8 -16 Z" fill="#fff" stroke="#26303f" stroke-width="2"/><rect x="151" y="108" width="16" height="5" fill="#fff"/>
   <text x="160" y="78" text-anchor="middle" font-size="13.5" font-weight="800">"같은 시각인데</text>
   <text x="160" y="98" text-anchor="middle" font-size="13.5" font-weight="800">그림자가 다르다고?!"</text>
 </svg>
 <svg viewBox="0 0 340 305" style="flex:1;min-width:260px;max-width:400px;background:#fffdf6;border:2.5px solid #26303f;border-radius:10px">
   <text x="12" y="24" font-size="15" font-weight="800" fill="#26303f">컷 2 · 에라토스테네스의 깨달음</text>
   <circle cx="110" cy="215" r="68" fill="#bfe0c2" stroke="#7fae84" stroke-width="3"/>
   <path d="M110 215 L110 147 A68 68 0 0 0 78 155 Z" fill="rgba(224,160,42,.35)"/>
   <line x1="110" y1="215" x2="110" y2="147" stroke="#8a6a34" stroke-width="2.5" stroke-dasharray="6 4"/>
   <line x1="110" y1="215" x2="78" y2="155" stroke="#8a6a34" stroke-width="2.5" stroke-dasharray="6 4"/>
   <path d="M78 155 A68 68 0 0 1 110 147" fill="none" stroke="#c0392b" stroke-width="7"/>
   <text x="100" y="185" font-size="13" font-weight="800" fill="#8a6a34">7.2°</text>
   <text x="70" y="136" font-size="12.5" font-weight="800" fill="#c0392b">800km</text>
   <circle cx="110" cy="215" r="4" fill="#26303f"/>
   <text x="258" y="215" text-anchor="middle" font-size="46">🧔</text>
   <rect x="150" y="48" width="180" height="118" rx="12" fill="#fff" stroke="#26303f" stroke-width="2"/>
   <path d="M240 166 l8 18 l10 -16 Z" fill="#fff" stroke="#26303f" stroke-width="2"/><rect x="241" y="162" width="18" height="5" fill="#fff"/>
   <text x="240" y="72" text-anchor="middle" font-size="13.5" font-weight="800">"지구가 둥글어서야!</text>
   <text x="240" y="92" text-anchor="middle" font-size="13.5" font-weight="800">한 바퀴 360°는</text>
   <text x="240" y="112" text-anchor="middle" font-size="13.5" font-weight="800">7.2°의 딱 50배!"</text>
   <text x="240" y="142" text-anchor="middle" font-size="15" font-weight="800" fill="#1a5fb4">360 ÷ 7.2 = 50</text>
 </svg>
</div>`;}

const DECK=[
 {t:'intro'},
 {t:'scale',i:0,opts:[['3칸',1],['30칸',0],['5칸',0]]},
 {t:'scale',i:1,opts:[['1칸',1],['10칸',0],['2칸',0]]},
 {t:'scale',i:2,opts:[['5칸',1],['50칸',0],['4칸',0]]},
 {t:'zoom'},
 {t:'invar'},
 {t:'comic'},
 {t:'prop'},
 {t:'done'}];
let idx=0,z2=100;
function prog(){$('#pfill').style.width=(idx/(DECK.length-1)*100)+'%';$('#pnum').textContent=(idx+1)+' / '+DECK.length;
  $('#navL').className='nav'+(idx<=0?' off':'');$('#navR').className='nav'+(idx>=DECK.length-1?' off':'');}
function fb(cls,t,s,btnText,after){const b=$('#fb');b.className='show '+cls;
  $('#fbT').innerHTML=t;$('#fbS').innerHTML=s||'';
  $('#fbA').innerHTML=`<button class="btn pri" id="fbBtn">${btnText}</button>`;
  $('#fbBtn').onclick=()=>{b.className='';if(after)after();};}
function next(){idx=Math.min(idx+1,DECK.length-1);render();}
function success(t,s,after){chime(true);plog('success',{slide:idx});fb('','✅ '+t,s,'다음 →',after||next);}
function retry(s){chime(false);plog('retry',{slide:idx});fb('help','🤔 다시 한번!',s,'도전!',null);}
function render(){prog();const d=DECK[idx];const el=$('#slide');
  if(d.t==='intro'){el.innerHTML=`<div style="font-size:90px">🗺️</div>
    <div class="q">지도의 비밀에 온 걸 환영해요!</div>
    <div class="sub">마을은 너무 커서 종이에 못 그려요. 그래서 약속해요 —<br><b>실제 100m = 지도 1칸</b>. 무엇이든 <b>같은 비(1:10,000)</b>로 줄이는 이 약속이 <b>축척</b>!</div>
    <button class="btn pri" onclick="next()">시작하기 →</button>`;return;}
  if(d.t==='scale'){const ob=OBJS[d.i];placed=d.i;
    el.innerHTML=`<div class="q">${ob.em} <b>${ob.n}</b>(실제 <b>${ob.real}m</b>)는<br>지도에서 <b>몇 칸</b>일까요?</div>
      <div class="sub">축척의 비밀 ${d.i+1}/3 — 정답을 맞히면 지도에 그려져요!</div>
      ${townMap(1)}
      <div class="scaleinfo"><span class="sc">축척 1 : 10,000</span> 1칸 = 100m</div>
      <div class="hintbox">💡 ${ob.real}m ÷ 100m = ?</div>
      <div class="choices">${d.opts.slice().sort(()=>Math.random()-.5).map(o=>`<button class="btn" data-ok="${o[1]}">${o[0]}</button>`).join('')}</div>`;
    el.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{
      if(b.dataset.ok==='1'){placed=d.i+1;
        success(`맞았어요! ${ob.em} ${ob.n} = ${ob.cells}칸`,`${ob.real}m ÷ 100 = <b>${ob.cells}칸</b> — 실제를 <b>비에 맞게 줄여서</b> 지도에 그렸어요!`);}
      else retry(`100m가 1칸 — <b>${ob.real} ÷ 100</b>을 생각해 보세요.`);});return;}
  if(d.t==='zoom'){placed=3;const f=z2/100;
    el.innerHTML=`<div class="q">배율을 눌러 <b>지도를 확대</b>해 보세요!<br><b>200%</b>로 확대하면, 지도 위 다리(3cm)는 <b>몇 cm</b>?</div>
      <div class="sub">모든 길이가 <b>같은 비</b>로 커져요</div>
      <div><button class="pctbtn ${z2===100?'on':''}" onclick="z2=100;render()">100%</button>
      <button class="pctbtn ${z2===200?'on':''}" onclick="z2=200;render()">200%</button></div>
      ${townMap(f)}
      <div class="scaleinfo"><span class="sc">배율 ${z2}% = ×${f}</span> 지도 위 다리: 3cm × ${f} = <b>${3*f}cm</b> · 축척 1 : ${(10000/f).toLocaleString()}</div>
      <div class="choices">${[['6cm',1],['3cm',0],['12cm',0]].sort(()=>Math.random()-.5).map(o=>`<button class="btn" data-ok="${o[1]}">${o[0]}</button>`).join('')}</div>`;
    el.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{
      b.dataset.ok==='1'?success('맞았어요! 6cm','200% = ×2 — 지도 위 길이가 <b>2배</b>! 3cm → <b>6cm</b>.')
        :retry('배율 버튼을 눌러 <b>지도 위 다리 길이</b>가 어떻게 변하는지 관찰해 보세요.');});return;}
  if(d.t==='invar'){el.innerHTML=`<div class="q">지도를 아무리 확대해도<br><b>변하지 않는 것</b>은 무엇일까요?</div>
      <div class="choices" style="flex-direction:column;align-items:center">
        ${[['다리의 실제 길이',1],['지도 위 다리의 길이',0],['지도 1칸의 크기',0]].sort(()=>Math.random()-.5).map(o=>`<button class="btn" style="min-width:340px" data-ok="${o[1]}">${o[0]}</button>`).join('')}
      </div>`;
    el.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{
      b.dataset.ok==='1'?success('맞았어요!','확대는 <b>그림</b>만 커지는 것 — <b>실제 마을</b>은 그대로예요!')
        :retry('확대했을 때 <b>진짜 마을</b>도 커질까요? 생각해 보세요.');});return;}
  if(d.t==='comic'){el.innerHTML=`<div class="q">🌍 2200년 전, 에라토스테네스는<br><b>막대기 하나</b>로 지구를 쟀어요!</div>
      <div class="sub">그가 쓴 도구는 단 두 가지 — <b>그림자</b>와 <b>거리</b>. 두 컷 만화로 만나요!</div>
      ${comicSVG()}
      <div class="sub" style="margin-top:10px">두 도시 사이의 거리는 <b>800km</b> — 이제 지구 한 바퀴를 구할 수 있어요!</div>
      <button class="btn pri" onclick="next()">비로 계산해 보기! ✏️</button>`;return;}
  if(d.t==='prop'){el.innerHTML=`<div class="q">각도가 50배면, 거리도 50배!<br>그럼 <b>지구 둘레</b>는 몇 km?</div>
      <div class="prop"><table>
        <tr><td class="small">각도의 비</td><td></td><td class="small">거리의 비</td></tr>
        <tr><td>7.2° : 360°</td><td>=</td><td>800km : <span style="color:var(--red)">❓</span></td></tr>
        <tr><td class="x50">↓ ×50</td><td></td><td class="x50">↓ ×50</td></tr>
        <tr><td>360°</td><td></td><td style="color:var(--red)">❓ km</td></tr>
      </table></div>
      <div class="hintbox">💡 800 × 50</div>
      <div class="choices">${[['40,000 km',1],['4,000 km',0],['400,000 km',0]].sort(()=>Math.random()-.5).map(o=>`<button class="btn" data-ok="${o[1]}">${o[0]}</button>`).join('')}</div>`;
    el.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{
      b.dataset.ok==='1'?success('지구를 쟀어요!! 🌍','7.2° : 360° = 800 : <b>40,000</b> — 실제 값 40,075km, 오차 0.2%!<br>막대기 하나와 <b>비</b>만으로 지구를 쟀어요!')
        :retry('각도가 50배니까 거리도 50배 — <b>800 × 50</b>!');});return;}
  if(d.t==='done'){el.innerHTML=`<div style="font-size:90px">🎉</div>
    <div class="q">지도의 비밀 완주!</div>
    <div class="sub">축척 → 확대 → 지구… 전부 <b>같은 비의 비밀</b>이었죠!<br>📝 오늘 지도에서 찾은 비의 비밀을 한 문장으로!</div>
    <div style="margin:10px 0"><input id="rfx" type="text" maxlength="100" placeholder="예: 지도는 실제를 같은 비로 줄인 것이다!"
      style="width:min(560px,90vw);font-size:21px;font-weight:700;border:3px solid var(--line);border-radius:16px;padding:16px;outline:none"></div>
    <button class="btn pri" id="go">남기고 완성! 🌍</button>`;
    $('#go').onclick=()=>{plog('reflection',{text:($('#rfx').value||'').slice(0,100)});chime(true);
      fb('','🏆 모두 끝!','대단해요 — 다른 방도 탐험해 보세요!','처음으로',()=>{location.href='index.html';});};return;}
}
$('#navL').onclick=()=>{if(idx>0){idx--;render();plog('nav',{to:idx});}};
$('#navR').onclick=()=>{if(idx<DECK.length-1){idx++;render();plog('nav',{to:idx});}};
render();
</script>
