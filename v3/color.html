<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RatioSense v3 — 색깔의 비밀</title>
<style>
  :root{--bg:#f4f1ea;--ink:#26303f;--sub:#6b7683;--line:#e6e1d6;--accent:#2e9e63;--gold:#e0a02a;--red:#c0392b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
  /* 상단 진행 바 */
  #top{position:fixed;left:0;right:0;top:0;height:64px;background:#fff;border-bottom:2px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 26px;z-index:10}
  #top .t{font-size:22px;font-weight:800;white-space:nowrap}
  #pbar{flex:1;height:14px;background:#ece8dd;border-radius:7px;overflow:hidden}
  #pfill{height:100%;width:0%;background:linear-gradient(90deg,#2e9e63,#5cc98d);transition:width .4s}
  #pnum{font-size:19px;font-weight:800;color:var(--sub);white-space:nowrap}
  /* 슬라이드 */
  #stage{position:absolute;inset:64px 0 0 0;display:flex;align-items:center;justify-content:center;overflow:auto}
  .slide{width:min(960px,94vw);padding:20px 10px 40px;text-align:center;animation:in .35s ease}
  @keyframes in{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
  .q{font-size:clamp(24px,3.4vw,34px);font-weight:800;line-height:1.55;margin:6px 0 8px}
  .q b{color:#b3541e}
  .sub{font-size:clamp(17px,2vw,21px);color:var(--sub);font-weight:700;margin-bottom:14px}
  /* 비커 */
  .pair{display:flex;gap:46px;justify-content:center;align-items:flex-end;margin:14px 0}
  .bk{width:150px;height:190px;border:5px solid #26303f;border-top-width:3px;border-radius:0 0 26px 26px;position:relative;overflow:hidden;background:#fbfaf6}
  .bk .fill{position:absolute;bottom:0;left:0;right:0;height:0%;transition:height .25s,background .25s}
  .bk .fill.full{height:92%}
  .bklab{font-size:20px;font-weight:800;margin-top:10px}
  /* 물감 조작 */
  .paints{display:flex;gap:56px;justify-content:center;margin:10px 0}
  .pcol .nm{font-size:22px;font-weight:800;margin-bottom:8px}
  .tubes{display:flex;gap:12px;align-items:flex-end;justify-content:center}
  .tube{border:none;background:none;cursor:pointer;text-align:center;padding:0}
  .tube svg{width:52px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}
  .tube:hover svg{transform:translateY(-3px)}
  .tube .amtl{font-size:17px;font-weight:800}
  .minus{display:flex;gap:10px;justify-content:center;margin-top:10px}
  .mb{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 16px;font-weight:800;font-size:19px;color:var(--red);cursor:pointer;min-width:64px}
  .mb:hover{background:#fdeeec}
  .amtnow{font-size:21px;font-weight:800;margin-top:10px}
  /* 버튼 */
  .btn{border:2.5px solid var(--line);background:#fff;border-radius:16px;padding:16px 30px;font-weight:800;font-size:21px;cursor:pointer;margin:6px}
  .btn:hover{background:#fbf6e8}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-size:23px;padding:18px 44px}
  .btn.pri:hover{background:#27video8a56}.btn.pri:hover{background:#288a56}
  .btn.ghost{border-color:transparent;color:var(--sub);font-size:17px}
  .choices{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  .choices .btn{min-width:150px;font-size:24px}
  /* 숫자 입력 */
  .numrow{display:flex;gap:26px;justify-content:center;align-items:flex-end;margin:14px 0}
  .nf{display:flex;flex-direction:column;align-items:center;gap:6px}
  .nf input{width:170px;font-size:34px;font-weight:800;border:3px solid var(--line);border-radius:16px;padding:12px;text-align:center;outline:none}
  .nf input:focus{border-color:var(--accent)}
  .nf .u{font-size:19px;font-weight:800;color:var(--sub)}
  /* 100칸 */
  .grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:560px;margin:14px auto;border:3px solid #cdc6b8;border-radius:14px;padding:8px;background:#fff}
  .cell{aspect-ratio:1;border-radius:4px;background:#edeae2;transition:background .25s}
  /* 분수 */
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 4px}
  .frac .fn{border-bottom:3.5px solid currentColor;padding:0 10px}
  .frac .fd{padding:0 10px}
  /* 피드백 오버레이 */
  #fb{position:fixed;inset:0;background:rgba(38,48,63,.45);display:none;align-items:center;justify-content:center;z-index:50}
  #fb.show{display:flex}
  #fb .in{background:#fff;border-radius:26px;max-width:620px;width:92vw;padding:38px 34px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.35);border-top:8px solid var(--accent);animation:pop .3s ease}
  #fb.help .in{border-top-color:var(--gold)}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
  #fbT{font-size:30px;font-weight:800;margin-bottom:10px}
  #fbS{font-size:21px;line-height:1.8;color:#41506b;font-weight:600}
  #fbA{margin-top:22px}
  .prog-chips{display:flex;gap:8px;justify-content:center;margin-top:6px}
  .prog-chips .c{width:14px;height:14px;border-radius:50%;background:#ddd8ca}
  .prog-chips .c.on{background:var(--accent)}
  .liquid{width:150px;height:200px;border:5px solid #26303f;border-top-width:3px;border-radius:0 0 24px 24px;margin:14px auto;position:relative;overflow:hidden;background:#fbfaf6}
  .liquid .mf{position:absolute;bottom:0;left:0;right:0;height:88%}

  .nav{position:fixed;top:50%;transform:translateY(-50%);width:64px;height:64px;border-radius:50%;
    border:3px solid var(--line);background:#fff;font-size:34px;font-weight:800;color:var(--sub);
    cursor:pointer;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center}
  .nav:hover{background:#fbf6e8;color:var(--ink)}
  #navL{left:14px}#navR{right:14px}
  .nav.off{opacity:.25;pointer-events:none}
  /* 붓 색칠 */
  .pots{display:flex;gap:22px;justify-content:center;margin:8px 0 4px}
  .pot{border:4px solid var(--line);background:#fff;border-radius:18px;padding:12px 22px;cursor:pointer;
    font-size:21px;font-weight:800;display:flex;align-items:center;gap:10px}
  .pot .sw{width:34px;height:34px;border-radius:50%}
  .pot.on{border-color:var(--accent);background:#eaf7ef;box-shadow:0 0 0 3px #bfe6cf}
  .grid.brushing .cell{cursor:crosshair}
  .cnt{font-size:20px;font-weight:800;margin-top:6px}
  .sumbox{background:#fff;border:3px solid var(--line);border-radius:20px;padding:20px 24px;display:inline-block;text-align:left;margin:8px 0;max-width:760px}
  .sumbox .row{font-size:21px;font-weight:800;line-height:2.3}
  .sumbox input{width:130px;font-size:20px;font-weight:800;border:none;border-bottom:3.5px solid var(--gold);background:#fffbef;text-align:center;outline:none;padding:2px 6px}
  .sumbox input.okk{border-color:var(--accent);background:#eaf7ef;color:#136a3d}
  .sumbox input.bad{border-color:var(--red);background:#fdeeec}
  .home{display:inline-flex;align-items:center;gap:8px;font-size:21px;font-weight:800;color:var(--ink);text-decoration:none;border:3px solid var(--line);border-radius:14px;padding:9px 18px;background:#fff;white-space:nowrap}
  .home:hover{background:#fbf6e8;border-color:var(--gold)}
</style>
</head>
<body>
<div id="top"><a class="home" href="index.html">🏠 홈</a>
  <div class="t">🎨 색깔의 비밀 <span style="color:#b3541e">v3</span></div>
  <div id="pbar"><div id="pfill"></div></div>
  <div id="pnum">1 / 1</div>
</div>
<div id="stage"><div class="slide" id="slide"></div></div>
<button class="nav" id="navL">‹</button>
<button class="nav" id="navR">›</button>
<div id="fb"><div class="in"><div id="fbT"></div><div id="fbS"></div><div id="fbA"></div></div></div>

<script>
const $=s=>document.querySelector(s);
function plog(ev,data){try{parent.postMessage({type:'pilotLog',lab:'colorV3',event:ev,data:data||{}},'*');}catch(e){}}
/* ── 색 엔진 ── */
const PRIM={빨강:[230,40,55],노랑:[250,215,45],파랑:[45,100,205]};
function mix(c){const ks=Object.keys(c).filter(k=>c[k]>0),t=ks.reduce((s,k)=>s+c[k],0);if(!t)return[252,250,245];
  let o=[1,1,1];for(const k of ks){const w=c[k]/t,p=PRIM[k];for(let i=0;i<3;i++)o[i]*=Math.pow(Math.max(p[i]/255,.02),w);}
  let out=o.map(v=>Math.round(v*255));
  if(ks.length===2&&ks.includes('노랑')&&ks.includes('파랑')){out[1]=Math.min(255,Math.round(out[1]*1.35+18));out[2]=Math.round(out[2]*0.88);}
  return out;}
const rgb=a=>`rgb(${a[0]},${a[1]},${a[2]})`;
function gcd(a,b){return b?gcd(b,a%b):a;}
function fracHTML(n,d){return `<span class="frac"><span class="fn">${n}</span><span class="fd">${d}</span></span>`;}
function jz(w,a,b){const c=w.charCodeAt(w.length-1);return ((c-0xAC00)%28>0)?a:b;}
/* ── 소리 ── */
let AC;const ac=()=>AC||(AC=new(window.AudioContext||window.webkitAudioContext)());
function tone(f,w,d){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,c.currentTime+w);g.gain.linearRampToValueAtTime(.15,c.currentTime+w+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+w+d);o.start(c.currentTime+w);o.stop(c.currentTime+w+d);}catch(e){}}
function chime(ok){ok?(tone(523,0,.2),tone(659,.2,.2),tone(784,.4,.42)):(tone(392,0,.16),tone(349,.16,.2));}
/* ── 덱 구성 ── */
const FAM=[
 {id:'주황',emoji:'🟠',paints:['빨강','노랑'],r:[1,2]},
 {id:'보라',emoji:'🟣',paints:['빨강','파랑'],r:[2,1]},
 {id:'초록',emoji:'🟢',paints:['노랑','파랑'],r:[2,5]}];
const MAKE=[{r:[2,3],b:200},{r:[1,2],b:100},{r:[2,3],b:40}]; // 빨강:노랑, 기준=빨강
const R3=[{a:100,b:200,dir:'ab',type:'ratio'},{a:100,b:200,dir:'ab',type:'frac'},
          {a:100,b:200,dir:'ba',type:'ratio'},{a:100,b:200,dir:'ba',type:'frac'},
          {a:40,b:60,dir:'ab',type:'ratio'},{a:40,b:60,dir:'ab',type:'frac'}];
let DECK=[{t:'title'}];
FAM.forEach((f,fi)=>{for(let k=0;k<3;k++)DECK.push({t:'sense',fi,k});});
MAKE.forEach((m,i)=>{DECK.push({t:'make',i});DECK.push({t:'concept',i});});
R3.forEach((q,i)=>DECK.push({t:'rate',i}));
DECK.push({t:'paint',n:10},{t:'paint',n:50},{t:'paint',n:100},{t:'cells'},{t:'pct'},{t:'done'});
let idx=0, S={};
/* ── 프레임워크 ── */
function prog(){
  const L=$('#navL'),R=$('#navR');
  if(L){L.className='nav'+(idx<=0?' off':'');R.className='nav'+(idx>=DECK.length-1?' off':'');}
$('#pfill').style.width=(idx/(DECK.length-1)*100)+'%';$('#pnum').textContent=(idx+1)+' / '+DECK.length;}
function fb(cls,t,s,btnText,after){const b=$('#fb');b.className='show '+cls;
  $('#fbT').innerHTML=t;$('#fbS').innerHTML=s||'';
  $('#fbA').innerHTML=`<button class="btn pri" id="fbBtn">${btnText}</button>`;
  $('#fbBtn').onclick=()=>{b.className='';if(after)after();};}
function next(){idx=Math.min(idx+1,DECK.length-1);render();}
function success(t,s){chime(true);plog('success',{slide:idx});fb('','✅ '+t,s,'다음 →',next);}
function retry(s){chime(false);plog('retry',{slide:idx});fb('help','🤔 다시 한번!',s,'도전!',null);}
/* ── 튜브 ── */
function tubeSVG(c){return `<svg viewBox="0 0 60 118"><rect x="20" y="2" width="20" height="15" rx="3" fill="#e9e6df" stroke="#b9b4a8" stroke-width="1.5"/><rect x="24" y="17" width="12" height="6" fill="#d8d4c9"/><path d="M14 27 L46 27 L50 108 Q50 114 44 114 L16 114 Q10 114 10 108 Z" fill="#fdfcf8" stroke="#b9b4a8" stroke-width="2"/><rect x="12" y="46" width="36" height="26" rx="4" fill="${rgb(PRIM[c])}"/><text x="30" y="98" text-anchor="middle" font-size="13" font-weight="800" fill="#6b7683">${c}</text></svg>`;}
function tubes(color,vals,cb){return `<div class="tubes">`+vals.map(v=>
  `<button class="tube" data-c="${color}" data-v="${v}"><div>${tubeSVG(color)}</div><div class="amtl">+${v}</div></button>`).join('')+`</div>
  <div class="minus">${[10,50].map(v=>`<button class="mb" data-c="${color}" data-m="${v}">−${v}</button>`).join('')}</div>`;}
function wireTubes(el,cb){el.querySelectorAll('.tube').forEach(b=>b.onclick=()=>{const c=b.dataset.c;S.amt[c]=(S.amt[c]||0)+(+b.dataset.v);cb();});
  el.querySelectorAll('.mb').forEach(b=>b.onclick=()=>{const c=b.dataset.c;S.amt[c]=Math.max(0,(S.amt[c]||0)-(+b.dataset.m));cb();});}
/* ── 슬라이드 렌더러 ── */
function render(){prog();const d=DECK[idx];const el=$('#slide');S={amt:{}};
  if(d.t==='title'){
    el.innerHTML=`<div style="font-size:90px">🎨</div>
      <div class="q">색깔의 비밀에 온 걸 환영해요!</div>
      <div class="sub">물감을 섞어 <b>비의 비밀</b>을 찾아요 — 한 화면에 한 문제씩, 차근차근!</div>
      <button class="btn pri" onclick="next()">시작하기 →</button>`;return;}
  if(d.t==='sense'){
    const f=FAM[d.fi],[r0,r1]=f.r,p0=f.paints[0],p1=f.paints[1];
    const tgt=mix({[p0]:r0,[p1]:r1});
    const qs=[`${f.emoji} <b>${f.id} 만들기!</b><br>${p0} : ${p1} = <b>${r0} : ${r1}</b>이 되도록 물감을 짜 보세요`,
              `${p0} : ${p1} = <b>${r0} : ${r1}</b><br>같은 ${f.id}을 <b>다른 양</b>으로 만들어 봅시다`,
              `${p0} : ${p1} = <b>${r0} : ${r1}</b><br><b>또 다른 양</b>으로 한 번 더!`][d.k];
    el.innerHTML=`<div class="q">${qs}</div>
      <div class="sub">${f.id} 만들기 ${d.k+1}번째 <span class="prog-chips" style="display:inline-flex;vertical-align:middle">${[0,1,2].map(i=>`<span class="c ${i<d.k?'on':''}"></span>`).join('')}</span></div>
      <div class="pair">
        <div><div class="bk"><div class="fill full" style="background:${rgb(tgt)}"></div></div><div class="bklab">Ⓐ 목표</div></div>
        <div><div class="bk"><div class="fill" id="my"></div></div><div class="bklab">Ⓑ 내가 만든 색</div></div>
      </div>
      <div class="paints">
        <div class="pcol"><div class="nm" style="color:${rgb(PRIM[p0])}">${p0} <span id="a0">0</span>mL</div>${tubes(p0,[10,25,50])}</div>
        <div class="pcol"><div class="nm" style="color:${rgb(PRIM[p1])}">${p1} <span id="a1">0</span>mL</div>${tubes(p1,[10,25,50])}</div>
      </div>
      <button class="btn ghost" id="clr">🗑 비우기</button>`;
    const used=d._used||(d._used=[]);
    const upd=()=>{const a=S.amt[p0]||0,b=S.amt[p1]||0,tot=a+b;
      $('#a0').textContent=a;$('#a1').textContent=b;
      const my=$('#my');my.style.background=rgb(mix(S.amt));my.style.height=Math.min(92,tot/170*92)+'%';
      if(a>0&&b>0&&a*r1===b*r0){
        const key=a+':'+b;
        if(used.includes(key)){retry('아까와 <b>같은 양</b>이에요 — 다른 양으로 만들어 보세요!');S.amt={};upd();return;}
        used.push(key);const g=gcd(a,b);
        success('맞았어요! 양은 달라도 비는 같아요!',`${p0} ${a} : ${p1} ${b} = <b>${a/g} : ${b/g}</b>`);}};
    wireTubes(el,upd);$('#clr').onclick=()=>{S.amt={};upd();};upd();return;}
  if(d.t==='make'){
    const m=MAKE[d.i],BASE=m.b,ans=BASE*m.r[1]/m.r[0];
    const tgt=mix({빨강:m.r[0],노랑:m.r[1]});
    el.innerHTML=`<div class="q">(빨강 물감의 양) : (노랑 물감의 양) = <b>${m.r[0]} : ${m.r[1]}</b>이 되도록<br>주황을 만들려고 해요.<br>빨강이 <b>${BASE}mL</b> 들어 있다면, 노랑은 <b>몇 mL</b>?</div>
      <div class="sub">(비에 맞는 색 만들기 ${d.i+1}/3)</div>
      <div class="pair">
        <div><div class="bk"><div class="fill full" style="background:${rgb(tgt)}"></div></div><div class="bklab">Ⓐ 목표</div></div>
        <div><div class="bk"><div class="fill" id="my"></div></div><div class="bklab">Ⓑ 내가 만든 색</div></div>
      </div>
      <div class="numrow"><div class="nf"><input id="inp" type="number" inputmode="numeric" min="0" placeholder="?"><div class="u" style="color:${rgb(PRIM['노랑'])}">● 노랑 mL</div></div></div>
      <button class="btn pri" id="go">답 제출!</button>`;
    const upd=()=>{const v=Math.max(0,parseInt($('#inp').value||'0',10)||0);
      S.amt={빨강:BASE,노랑:v};
      const my=$('#my');my.style.background=rgb(mix(S.amt));my.style.height=Math.min(92,(BASE+v)/(BASE+ans+60)*92)+'%';};
    $('#inp').oninput=upd;upd();
    $('#go').onclick=()=>{const v=parseInt($('#inp').value||'0',10);
      if(v===ans){S._made=v;success('맞았어요! 🎨',`빨강 ${BASE}mL : 노랑 ${v}mL = <b>${m.r[0]} : ${m.r[1]}</b>`);}
      else retry(`빨강이 <b>${BASE}mL</b>일 때, 노랑이 몇 mL여야 빨강 : 노랑 = <b>${m.r[0]} : ${m.r[1]}</b>이 될까요?`);};return;}
  if(d.t==='concept'){
    const m=MAKE[d.i],BASE=m.b,cv=BASE*m.r[1]/m.r[0];
    const askBase=(d.i!==1);
    el.innerHTML=`<div class="q">색 완성! 이 문제에서 <b>${askBase?'기준량':'비교하는 양'}</b>은 무엇일까요?</div>
      <div class="sub">빨강 ${BASE}mL는 처음부터 들어 있었고, 내가 노랑 ${cv}mL를 넣어 맞췄어요</div>
      <div class="choices">
        <button class="btn" data-ok="${askBase?1:0}">빨강</button>
        <button class="btn" data-ok="${askBase?0:1}">노랑</button>
      </div>`;
    el.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{
      if(b.dataset.ok==='1'){
        success('맞아요!',askBase
          ?`처음부터 들어 있던 <b>빨강</b>에 맞춰 노랑을 넣었죠?<br><b>빨강은 기준량, 노랑이 비교하는 양</b>이 됩니다.`
          :`기준량 빨강에 맞춰 내가 넣은 <b>노랑이 비교하는 양</b>이에요.`);}
      else retry('처음부터 <b>정해져 있던 쪽</b>이 기준량, 그에 <b>맞춰 넣은 쪽</b>이 비교하는 양이에요.');});return;}
  if(d.t==='rate'){
    const q=R3[d.i],g=gcd(q.a,q.b),ra=q.a/g,rb=q.b/g;
    const abFront=(q.dir==='ab');
    const F=abFront?'노랑':'빨강', K=abFront?'빨강':'노랑';
    const fV=abFront?rb:ra, kV=abFront?ra:rb;
    const kmL=abFront?q.a:q.b, fmL=abFront?q.b:q.a;
    const mixCol=rgb(mix({빨강:q.a,노랑:q.b}));
    let opts;
    if(q.type==='ratio')opts=[[`${fV} : ${kV}`,1],[`${kV} : ${fV}`,0],[`${fV} : ${fV+kV}`,0]];
    else opts=[[fracHTML(fV,kV),1],[fracHTML(kV,fV),0],[fracHTML(fV,fV+kV),0]];
    opts.sort(()=>Math.random()-.5);
    el.innerHTML=`<div class="q">${q.type==='ratio'
        ?`'<b>${K} ${kmL}mL에 대한 ${F} ${fmL}mL의 비</b>'는<br>몇 대 몇일까요?`
        :`방금 구한 그 비!<br>'<b>${K}에 대한 ${F}의 비율</b>'을 <b>분수</b>로 나타내면?`}</div>
      <div class="sub">(비와 비율 ${d.i+1}/6)</div>
      <div style="font-size:21px;font-weight:800;margin:4px 0">주황 액체 — <span style="color:${rgb(PRIM['빨강'])}">빨강 ${q.a}mL</span> + <span style="color:#b3921e">노랑 ${q.b}mL</span></div>
      <div class="liquid"><div class="mf" style="background:${mixCol}"></div></div>
      <div class="choices">${opts.map((o,i)=>`<button class="btn" data-ok="${o[1]}" id="op${i}">${o[0]}</button>`).join('')}</div>`;
    el.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{
      if(b.dataset.ok==='1'){
        const flip=(d.i===2);
        success('맞아요!',q.type==='ratio'
          ?`${flip?'같은 액체여도 <b>기준이 다르니 비가 바뀌었죠?</b><br>':''}'${K}에 대한 ${F}의 비'는 <b>${F} : ${K}</b> — ${F}${jz(F,'은','는')} 비교하는 양, ${K}${jz(K,'은','는')} 기준량!`
          :`${F} ÷ ${K} = <b>${fV}/${kV}</b> — 기준량(${K})이 아래, 비교하는 양(${F})이 위!`);}
      else retry(`'<b>${K}에 대한 ${F}의 비</b>'는 <b>${F} : ${K}</b>예요.`);});return;}
  if(d.t==='paint'){
    const n=d.n, needR=n*2/5, needY=n*3/5, cols=(n===10?5:10);
    if(!d._cells||d._cells.length!==n)d._cells=Array(n).fill('');
    const cells=d._cells;let brush=d._brush||null;
    el.innerHTML=`<div class="q">${n===10?'먼저 <b>10칸</b>으로 연습!':(n===50?'이번엔 <b>50칸</b>!':'진짜 도전 — <b>100칸</b>!')}<br>빨강 : 노랑 = <b>2 : 3</b>이 되려면 어떻게 색칠해야 할까요?</div>
      <div class="sub">물감을 눌러 <b>붓</b>을 만들고, 칸을 하나씩 눌러(또는 드래그해서) 색칠해요</div>
      <div class="pots">
        <button class="pot" id="potR"><span class="sw" style="background:${rgb(PRIM['빨강'])}"></span>빨강 물감</button>
        <button class="pot" id="potY"><span class="sw" style="background:${rgb(PRIM['노랑'])}"></span>노랑 물감</button>
        <button class="btn ghost" id="clr">🗑 모두 지우기</button>
      </div>
      <div class="cnt" id="cnt"></div>
      <div class="grid" id="gr" style="grid-template-columns:repeat(${cols},1fr);max-width:${n===10?420:560}px">
        ${Array.from({length:n},(_,i)=>`<div class="cell" data-i="${i}" style="${n===10?'border:1.5px solid #ddd8ca;':''}"></div>`).join('')}
      </div>`;
    const gr=$('#gr');
    const paintIt=(cell)=>{if(!brush)return;const i=+cell.dataset.i;cells[i]=brush;
      cell.style.background=brush==='r'?rgb(PRIM['빨강']):rgb(PRIM['노랑']);upd();};
    const upd=()=>{const r=cells.filter(c=>c==='r').length,y=cells.filter(c=>c==='y').length,left=n-r-y;
      $('#cnt').innerHTML=`<span style="color:${rgb(PRIM['빨강'])}">빨강 ${r}칸</span> · <span style="color:#b3921e">노랑 ${y}칸</span> · 남은 ${left}칸`;
      $('#potR').className='pot'+(brush==='r'?' on':'');$('#potY').className='pot'+(brush==='y'?' on':'');
      gr.className='grid'+(brush?' brushing':'');
      if(left===0&&!d._fbLock){d._fbLock=true;
        setTimeout(()=>{d._fbLock=false;
          if(r*3===y*2){d._ok=true;success('잘 색칠했어요!',`빨강 ${r}칸 : 노랑 ${y}칸 = <b>2 : 3</b>${n<100?' — 다음은 더 큰 판!':''}`);}
          else retry(`${n}칸을 다 칠했지만 빨강 ${r} : 노랑 ${y} — <b>2 : 3</b>이 아니에요.<br>붓으로 다시 칠하거나 🗑 모두 지우기!`);},350);}};
    $('#potR').onclick=()=>{brush=d._brush='r';upd();};
    $('#potY').onclick=()=>{brush=d._brush='y';upd();};
    $('#clr').onclick=()=>{cells.fill('');gr.querySelectorAll('.cell').forEach(c=>c.style.background='#edeae2');upd();};
    let down=false;
    gr.onpointerdown=e=>{const c=e.target.closest('.cell');if(c){down=true;if(!brush){retry('먼저 <b>물감을 눌러 붓</b>을 만드세요!');return;}paintIt(c);}};
    gr.onpointerover=e=>{if(!down)return;const c=e.target.closest('.cell');if(c)paintIt(c);};
    document.onpointerup=()=>{down=false;};
    // 기존 칠 복원
    gr.querySelectorAll('.cell').forEach((c,i)=>{if(cells[i])c.style.background=cells[i]==='r'?rgb(PRIM['빨강']):rgb(PRIM['노랑']);});
    upd();return;}
  if(d.t==='cells'){
    el.innerHTML=`<div class="q">이 <b>100칸</b> 중에 <b>빨강</b>은 몇 칸인가요?</div>
      <div class="grid">${Array.from({length:100},(_,i)=>`<div class="cell" style="background:${i<40?rgb(PRIM['빨강']):rgb(PRIM['노랑'])}"></div>`).join('')}</div>
      <div class="numrow"><div class="nf"><input id="inp" type="number" min="0" max="100" placeholder="?"><div class="u">칸</div></div></div>
      <button class="btn pri" id="go">확인</button>`;
    $('#go').onclick=()=>{const v=parseInt($('#inp').value||'0',10);
      v===40?success('맞았어요! 빨강 40칸!','100칸 중 <b>40칸</b>이 빨강이에요.')
            :retry('빨간 칸을 세어 보거나, 내가 칠한 수를 떠올려 보세요.');};return;}
  if(d.t==='pct'){
    const mixCol=rgb(mix({빨강:40,노랑:60}));
    el.innerHTML=`<div class="q">빨강 <b>40mL</b>, 노랑 <b>60mL</b>를 넣어<br>주황 물감 <b>100mL</b>를 만들었습니다.<br>이 물감 100mL에서 <b>빨강은 몇 %</b>인가요?</div>
      <div class="liquid"><div class="mf" style="background:${mixCol}"></div></div>
      <div class="numrow"><div class="nf"><input id="inp" type="number" min="0" max="100" placeholder="?"><div class="u">%</div></div></div>
      <button class="btn pri" id="go">확인</button>`;
    $('#go').onclick=()=>{const v=parseInt($('#inp').value||'0',10);
      v===40?success('맞았어요! 빨강은 전체의 40%!','전체 100mL 중 빨강 40mL — 전체를 100으로 보면 <b>40%</b>. 백분율은 <b>전체를 100으로 볼 때의 비</b>예요!')
            :retry('전체는 40+60 = <b>100mL</b> — 그중 빨강 <b>40mL</b>를 100 기준으로!');};return;}
  if(d.t==='done'){
    el.innerHTML=`<div style="font-size:80px">🎉</div>
    <div class="q">색깔의 비밀을 모두 찾아냈군요! 대단해요!</div>
    <div class="sub">색깔의 비밀 찾기에서 알게 된 것을 <b>빈칸에 직접 써서</b> 정리해 봅시다</div>
    <div class="sumbox"><div class="row">양이 달라도 (<input class="sq" data-i="0" autocomplete="off">)가 같으면 <b>같은 색</b>이다.</div><div class="row">처음부터 정해져 있던 쪽은 (<input class="sq" data-i="1" autocomplete="off">), 맞춰 넣은 쪽은 비교하는 양이다.</div><div class="row">백분율은 전체를 (<input class="sq" data-i="2" autocomplete="off">)으로 볼 때의 비이다.</div></div>
    <div><button class="btn pri" id="ck">정리 확인!</button></div>
    <div id="freeQ" style="display:none;margin-top:14px">
      <div class="sub" style="font-size:22px;color:var(--ink)">💭 마지막 질문 — <b>여러분이 생각하는 '비'는 무엇인가요?</b></div>
      <div style="margin:8px 0"><input id="rfx" type="text" maxlength="100"
        style="width:min(560px,90vw);font-size:21px;font-weight:700;border:3px solid var(--line);border-radius:16px;padding:16px;outline:none"></div>
      <button class="btn pri" id="go">남기고 완성! 🎨</button>
    </div>`;
    const ANS=[["비"], ["기준량", "기준"], ["100", "백"]];
    const norm=s=>(s||'').replace(/\s/g,'');
    $('#ck').onclick=()=>{
      let all=true;
      el.querySelectorAll('.sq').forEach(inp=>{
        const ok=ANS[+inp.dataset.i].some(a=>norm(inp.value).includes(norm(a)));
        inp.className='sq '+(ok?'okk':'bad');if(!ok)all=false;});
      if(all){plog('summary',{a:[...el.querySelectorAll('.sq')].map(i=>i.value)});
        chime(true);fb('','✅ 정리 완벽!','오늘 배운 비밀이 머릿속에 쏙 정리됐어요!','마지막 질문으로 →',()=>{$('#freeQ').style.display='block';$('#rfx').focus();});}
      else{chime(false);fb('help','🤔 빨간 칸을 다시!','오늘 활동에서 나왔던 말을 떠올려 보세요.','도전!',null);}};
    $('#go')?null:null;
    el.addEventListener('click',e=>{if(e.target&&e.target.id==='go'){
      plog('reflection',{text:($('#rfx').value||'').slice(0,100)});chime(true);
      fb('','🏆 모두 끝!','대단해요 — 다른 방도 탐험해 보세요!','처음으로',()=>{location.href='index.html';});}});
    
    return;}
}
$('#navL').onclick=()=>{if(idx>0){idx--;render();plog('nav',{to:idx});}};
$('#navR').onclick=()=>{if(idx<DECK.length-1){idx++;render();plog('nav',{to:idx});}};
render();
</script>
</body>
</html>
