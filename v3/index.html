<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RatioSense v3 — 비율 탐험</title>
<style>
  :root{--bg:#f4f1ea;--ink:#26303f;--sub:#6b7683;--line:#e6e1d6;--accent:#2e9e63}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center}
  .wrap{text-align:center;padding:30px 16px;max-width:1000px}
  h1{font-size:clamp(30px,4.5vw,44px);margin:0 0 6px}
  .sub{font-size:clamp(18px,2.2vw,22px);color:var(--sub);font-weight:700;margin-bottom:30px}
  .rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
  a.room{display:block;background:#fff;border:3px solid var(--line);border-radius:24px;padding:30px 18px;text-decoration:none;color:var(--ink);transition:.15s;box-shadow:0 6px 20px rgba(0,0,0,.06)}
  a.room:hover{transform:translateY(-6px);border-color:var(--accent);box-shadow:0 14px 34px rgba(0,0,0,.13)}
  .room .em{font-size:64px}
  .room .nm{font-size:24px;font-weight:800;margin-top:10px}
  .room .ds{font-size:16px;color:var(--sub);font-weight:700;margin-top:6px;line-height:1.6}
  .foot{margin-top:34px;font-size:14px;color:var(--sub)}
  .foot a{color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔢 RatioSense <span style="color:#b3541e">v3</span></h1>
  <div class="sub">한 화면에 한 문제씩 — 슬라이드로 떠나는 <b>비의 비밀</b> 탐험!</div>
  <div class="rooms">
    <a class="room" href="color.html"><div class="em">🎨</div><div class="nm">색상 실험실</div><div class="ds">물감을 섞어 만드는<br>같은 비, 같은 색</div></a>
    <a class="room" href="sound.html"><div class="em">🎼</div><div class="nm">소리의 비밀</div><div class="ds">떨림의 비가 만드는<br>화음과 하프</div></a>
    <a class="room" href="map.html"><div class="em">🗺️</div><div class="nm">지도의 비밀</div><div class="ds">축척으로 마을을,<br>비로 지구를 재요</div></a>
    <a class="room" href="mart.html"><div class="em">🛒</div><div class="nm">마트의 비밀</div><div class="ds">하나에 얼마?<br>할인의 비밀까지</div></a>
  </div>
  <div class="foot">순서 추천: 색상 → 소리 → 지도 → 마트 · <a href="../">기존 버전(v2)으로</a></div>
</div>
</body>
</html>
