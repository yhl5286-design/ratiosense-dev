<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RatioSense v3 — 소리의 비밀</title>
<style>
  :root{--bg:#f4f1ea;--ink:#26303f;--sub:#6b7683;--line:#e6e1d6;--accent:#2e9e63;--gold:#e0a02a;--red:#c0392b}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
  #top{position:fixed;left:0;right:0;top:0;height:64px;background:#fff;border-bottom:2px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 26px;z-index:10}
  #top .t{font-size:22px;font-weight:800;white-space:nowrap}
  #top a{color:var(--sub);text-decoration:none}
  #pbar{flex:1;height:14px;background:#ece8dd;border-radius:7px;overflow:hidden}
  #pfill{height:100%;width:0%;background:linear-gradient(90deg,#2e9e63,#5cc98d);transition:width .4s}
  #pnum{font-size:19px;font-weight:800;color:var(--sub)}
  #stage{position:absolute;inset:64px 0 0 0;display:flex;align-items:center;justify-content:center;overflow:auto}
  .slide{width:min(960px,94vw);padding:20px 18px 44px;margin:auto;text-align:center;animation:in .35s ease both}
  @keyframes in{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
  .q{font-size:clamp(23px,3.2vw,32px);font-weight:800;line-height:1.55;margin:6px 0 8px}
  .q b{color:#b3541e}
  .sub{font-size:clamp(17px,2vw,21px);color:var(--sub);font-weight:700;margin-bottom:12px}
  .btn{border:2.5px solid var(--line);background:#fff;border-radius:16px;padding:15px 28px;font-weight:800;font-size:21px;cursor:pointer;margin:6px}
  .btn:hover{background:#fbf6e8}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-size:23px;padding:18px 44px}
  .btn.pri:hover{background:#288a56}
  /* 피아노 */
  .pianoWrap{display:inline-block;max-width:94vw;overflow-x:auto;overflow-y:hidden}
  .piano{display:flex;gap:6px;justify-content:center;margin:0 auto;position:relative;width:634px;padding-bottom:5px}
  .key{width:74px;height:150px;background:linear-gradient(#ffffff,#f0ede5);border:3px solid #1c2430;border-top:none;border-radius:0 0 12px 12px;cursor:pointer;
    display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;font-size:22px;font-weight:800;
    box-shadow:inset 0 -7px 0 rgba(0,0,0,.10)}
  .key:hover{background:#fff7dd}
  .key.play{background:#ffe9a8;transform:translateY(2px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14)}
  .key.base{background:#eaf7ef;border-color:var(--accent)}
  .bkey{position:absolute;top:0;width:44px;height:92px;background:linear-gradient(#2a2a30,#000);border-radius:0 0 8px 8px;z-index:2;pointer-events:none;box-shadow:0 4px 6px rgba(0,0,0,.4)}
  canvas{background:#fff;border:2.5px solid var(--line);border-radius:14px;max-width:100%}
  .dial{font-size:24px;font-weight:800;margin-top:8px}
  .verdict{font-size:26px;font-weight:800;margin-top:6px;min-height:38px}
  /* 하프 */
  .harp{background:#241a10;border-radius:16px;padding:16px 12px 12px;display:inline-block}
  .hbeam{height:14px;background:linear-gradient(#d9b26a,#8a6a34);border-radius:7px}
  .hrow{display:flex;justify-content:space-around;align-items:flex-start;gap:6px;padding:0 8px}
  .hcol{display:flex;flex-direction:column;align-items:center;width:72px}
  .hs{width:16px;background:linear-gradient(#fff6dd,#c9b98a);border-radius:5px;cursor:pointer;box-shadow:0 0 5px rgba(255,240,200,.4)}
  .hs.ghost{background:none;border-left:6px dashed #5a4a30;cursor:default;box-shadow:none}
    .hs.pluckA{animation:wig 1.25s ease-out}
  @keyframes wig{8%{transform:translateX(6px)}20%{transform:translateX(-5px)}33%{transform:translateX(4px)}46%{transform:translateX(-3px)}60%{transform:translateX(2px)}75%{transform:translateX(-1px)}100%{transform:none}}
  .hlab{margin-top:8px;font-size:19px;font-weight:800;color:#f0e9d8;text-align:center;line-height:1.3}
  .hlab span{font-size:14px;color:#cbbfa8}
  .hlab.ghost{color:#6a583a}
  .nf{display:inline-flex;flex-direction:column;align-items:center;gap:6px;margin:8px 0}
  .nf input{width:180px;font-size:32px;font-weight:800;border:3px solid var(--line);border-radius:16px;padding:12px;text-align:center;outline:none}
  .nf input:focus{border-color:var(--accent)}
  .nf .u{font-size:19px;font-weight:800;color:var(--sub)}
  .hintbox{font-size:20px;color:var(--sub);font-weight:700;background:#fbf6e8;border:2px solid #e0c98a;border-radius:14px;padding:10px 18px;display:inline-block;margin:8px 0}
  .nav{position:fixed;top:50%;transform:translateY(-50%);width:64px;height:64px;border-radius:50%;border:3px solid var(--line);background:#fff;font-size:34px;font-weight:800;color:var(--sub);cursor:pointer;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center}
  .nav:hover{background:#fbf6e8;color:var(--ink)}
  #navL{left:14px}#navR{right:14px}.nav.off{opacity:.25;pointer-events:none}
  #fb{position:fixed;inset:0;background:rgba(38,48,63,.45);display:none;align-items:center;justify-content:center;z-index:50}
  #fb.show{display:flex}
  #fb .in{background:#fff;border-radius:26px;max-width:620px;width:92vw;padding:38px 34px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.35);border-top:8px solid var(--accent);animation:pop .3s ease}
  #fb.help .in{border-top-color:var(--gold)}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
  #fbT{font-size:30px;font-weight:800;margin-bottom:10px}
  #fbS{font-size:21px;line-height:1.8;color:#41506b;font-weight:600}
  #fbA{margin-top:22px}
  .goal{display:inline-block;background:#fbf6e8;border:2.5px solid var(--gold);border-radius:16px;padding:12px 22px;font-size:22px;font-weight:800;margin-bottom:14px;line-height:1.7}
  .goal .gt{font-size:15px;color:#8a6a34;display:block;margin-bottom:2px}
  .blank{display:inline-block;min-width:74px;border-bottom:3.5px solid var(--gold);color:#b3541e;cursor:pointer;text-align:center;padding:0 6px}
  .blank.hid{color:transparent}
  .blank.hid:hover{background:#fff3d6}
  .sumbox{background:#fff;border:3px solid var(--line);border-radius:20px;padding:20px 24px;display:inline-block;text-align:left;margin:8px 0;max-width:760px}
  .sumbox .row{font-size:21px;font-weight:800;line-height:2.3}
  .sumbox input{width:130px;font-size:20px;font-weight:800;border:none;border-bottom:3.5px solid var(--gold);background:#fffbef;text-align:center;outline:none;padding:2px 6px}
  .sumbox input.okk{border-color:var(--accent);background:#eaf7ef;color:#136a3d}
  .sumbox input.bad{border-color:var(--red);background:#fdeeec}
  .dz{display:inline-block;min-width:78px;min-height:36px;border-bottom:4px solid var(--gold);background:#fffbef;border-radius:10px 10px 0 0;padding:3px 12px;text-align:center;font-weight:800;color:#b3541e;vertical-align:middle;cursor:pointer;font-size:24px}
  .dz.sel{background:#ffe9a8;outline:3px dashed var(--gold)}
  .dz.okk{border-color:var(--accent);background:#eaf7ef;color:#136a3d}
  .dz.bad{border-color:var(--red);background:#fdeeec;color:var(--red)}
  .bank{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .chip{border:3px solid var(--gold);background:#fff;border-radius:16px;padding:10px 20px;font-size:23px;font-weight:800;cursor:grab;user-select:none;touch-action:none}
  .chip:hover{background:#fffbef}
  .chip.used{visibility:hidden}
  #ghost{position:fixed;pointer-events:none;z-index:99;opacity:.9}
  .eq{background:#fff;border:3px solid var(--line);border-radius:20px;padding:18px 26px;display:inline-block;text-align:left;margin:8px 0}
  .eq .row{font-size:25px;font-weight:800;line-height:2.5}
  .dz{transition:transform .15s,background .15s}
  .dz.hov{background:#ffe9a8;transform:scale(1.12);outline:3px dashed var(--gold)}
  .dz.snap{animation:snapIn .3s}
  @keyframes snapIn{0%{transform:scale(1.35)}60%{transform:scale(.94)}100%{transform:none}}
  .dz.shake{animation:shk .45s}
  @keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  .hviz{background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px 18px;display:inline-block;margin:6px 0}
  .hvrow{display:flex;align-items:center;gap:10px;margin:6px 0}
  .hvlab{width:160px;text-align:right;font-weight:800;font-size:18px;white-space:nowrap}
  .hvbar{display:flex;height:26px;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(38,48,63,.15)}
  .hvseg{flex:1;border-right:2px solid #fff}
  .hvseg:last-child{border-right:none}
  .hvseg.c1{background:#e9c46a}
  .hvseg.c2{background:#7fae84}
  .hvend{font-size:15px;font-weight:700;color:var(--sub);white-space:nowrap}
  .hvcap{font-size:16.5px;font-weight:700;color:var(--sub);margin-top:8px;line-height:1.65;text-align:left}
  .vfr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 8px}
  .vfr .dz{min-width:60px;min-height:34px;border-radius:10px}
  .vfr .fbar{width:100%;min-width:60px;height:3.5px;background:#26303f;margin:4px 0;border-radius:2px}
  .cback{position:relative;border-radius:14px;border:4px solid #c9a227;
    background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 9px,transparent 9px 18px),
      radial-gradient(circle at 50% 40%,#3d5a80 0 30%,#2b4570 62%,#1b2c49 100%);
    box-shadow:0 8px 22px rgba(0,0,0,.35)}
  .cback::before{content:'';position:absolute;inset:6px;border:2px solid rgba(233,196,106,.55);border-radius:9px;pointer-events:none}
  .cback .emb{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:44%;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(#f2d488,#e9c46a 70%);display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 4px #c9a227,0 0 0 7px rgba(233,196,106,.35);font-size:200%}
  .cback .bnm{position:absolute;bottom:8%;width:100%;text-align:center;color:#e9c46a;font-weight:800;letter-spacing:2px;font-size:75%}
  .gcards{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;align-items:stretch;margin:8px 0}
  .gcard{position:relative;width:min(430px,92vw);border-radius:18px;padding:9px;display:inline-block;vertical-align:top;margin:6px;text-align:left;
    background:linear-gradient(160deg,#e3bf62,#8a6a1e 55%,#d9b455);box-shadow:0 10px 26px rgba(0,0,0,.35);animation:flipin .45s ease both}
  .gcard .gc-in{background:#20304a;border-radius:12px;overflow:hidden;border:2px solid #5d4310;height:100%;display:flex;flex-direction:column}
  .gc-art{position:relative;height:195px;flex:none;background:radial-gradient(circle at 50% 26%,#41628c,#233a5e 55%,#16233c);display:flex;align-items:flex-end;justify-content:center}
  .gc-art svg{width:88%;height:auto;display:block;margin-bottom:2px}
  .gc-name{background:linear-gradient(#f2d488,#d9a83f);color:#5d4310;font-weight:800;text-align:center;padding:10px 4px;font-size:19px;letter-spacing:.5px;border-top:2px solid #5d4310;border-bottom:2px solid #5d4310;flex:none}
  .gc-txt{background:linear-gradient(#fffdf4,#f3e9cc);padding:16px 20px;font-size:21px;font-weight:800;line-height:2.3;flex:1;display:flex;align-items:center}
  .gc-txt .row{font-size:21px;font-weight:800;line-height:2.3}
  .gc-txt .dz{min-width:88px;min-height:36px;font-size:20px;padding:3px 10px}
  .bigcard{position:relative;border:4px solid #c9a227;border-radius:16px;background:linear-gradient(#fffdf4,#fff3d6);
    box-shadow:0 8px 22px rgba(224,160,42,.4);max-width:820px;margin:10px auto;overflow:hidden;animation:flipin .45s ease both;text-align:left}
  .bigcard .pcf-top{font-size:15px}
  .bc-txt{padding:12px 22px}
  .bc-txt .row{font-size:21px;font-weight:800;line-height:2.5}
  .pcards{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:6px 0 12px}
  .pcard{width:170px;height:230px;perspective:900px;font-size:15px}
  .pcard .pc-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s}
  .pcard.flip .pc-in{transform:rotateY(180deg)}
  .pc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px}
  .pc-front{transform:rotateY(180deg);border:4px solid #c9a227;background:linear-gradient(#fffdf4,#fff3d6);
    box-shadow:0 8px 22px rgba(224,160,42,.4);display:flex;flex-direction:column;overflow:hidden}
  .pcf-top{background:linear-gradient(#e9c46a,#d9a83f);color:#5d4310;font-weight:800;font-size:13.5px;padding:6px;text-align:center;letter-spacing:1px}
  .pcf-txt{flex:1;display:flex;align-items:center;padding:8px 12px;font-size:13.5px;font-weight:800;line-height:1.6;text-align:left}
  #wpk{position:fixed;right:26px;top:50%;transform:translateY(-50%);width:200px;height:258px;z-index:101;animation:wpkIn .4s ease both}
  @keyframes wpkIn{from{transform:translateY(-50%) translateX(240px);opacity:0}to{transform:translateY(-50%);opacity:1}}
  #wpk .wpk-back{position:absolute;inset:0;border-radius:18px;background:linear-gradient(#8a5a2b,#6f4518);border:4px solid #c9a227;box-shadow:0 10px 26px rgba(0,0,0,.4)}
  #wpk .wpk-front{position:absolute;left:0;right:0;bottom:0;height:60%;border-radius:12px 12px 18px 18px;
    background:linear-gradient(#a9713a,#7d5020);border:4px solid #c9a227;border-top:5px solid #e9c46a;z-index:103}
  #wpk .wpk-label{position:absolute;bottom:16px;width:100%;text-align:center;z-index:104;color:#f2d488;font-weight:800;font-size:16px;letter-spacing:2px}
  #wpk.bump{animation:wpkBump .45s}
  @keyframes wpkBump{50%{transform:translateY(-50%) scale(1.12) rotate(-4deg)}}
  #wpk.wout{animation:wpkOut .45s both}
  @keyframes wpkOut{to{transform:translateY(-50%) translateX(260px);opacity:0}}
  .pfly{position:fixed;z-index:102;margin:0;transition:transform .7s cubic-bezier(.45,-0.05,.6,.35)}
  .qcard{display:block;position:relative;border:3.5px solid var(--gold);background:linear-gradient(#fffdf4,#fff3d6);border-radius:18px;padding:16px 22px 16px 52px;margin:10px auto;max-width:780px;box-shadow:0 7px 20px rgba(224,160,42,.3)}
  .qcard::before{content:'';position:absolute;left:14px;top:12px;font-size:24px}
  #walletFx{position:fixed;right:26px;top:50%;font-size:88px;z-index:110;filter:drop-shadow(0 8px 16px rgba(0,0,0,.3));animation:walIn .4s ease both}
  @keyframes walIn{from{transform:translateY(-50%) translateX(150px);opacity:0}to{transform:translateY(-50%);opacity:1}}
  #walletFx.bump{animation:walBump .45s ease both}
  @keyframes walBump{0%{transform:translateY(-50%) scale(1)}50%{transform:translateY(-50%) scale(1.35) rotate(-10deg)}100%{transform:translateY(-50%)}}
  #walletFx.wout{animation:walOut .45s ease both}
  @keyframes walOut{from{transform:translateY(-50%)}to{transform:translateY(-50%) translateX(170px);opacity:0}}
  .flycard{position:fixed;z-index:105;margin:0;transition:transform .6s cubic-bezier(.5,-0.1,.75,.35),opacity .6s}
  #walOv{position:fixed;inset:0;background:rgba(38,48,63,.45);display:none;align-items:center;justify-content:center;z-index:115}
  #walOv.show{display:flex}
  .walBox{background:#fff;border-radius:22px;padding:22px 28px;width:min(640px,94vw);max-height:82vh;overflow:auto;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.3)}
  .flyback.holdfx{animation:holdF 1.05s ease-in-out}
  @keyframes holdF{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.06)}}
  #cbook{position:fixed;inset:0;background:rgba(38,48,63,.5);display:flex;align-items:center;justify-content:center;z-index:110;animation:cbIn .3s ease}
  @keyframes cbIn{from{opacity:0}to{opacity:1}}
  #cbook.out{animation:cbOut .3s ease both}
  @keyframes cbOut{to{opacity:0}}
  .cb-in{background:linear-gradient(#8a5a2b,#6f4518);border:5px solid #c9a227;border-radius:20px;padding:18px 22px;box-shadow:0 24px 70px rgba(0,0,0,.5)}
  .cb-title{text-align:center;color:#f2d488;font-weight:800;font-size:20px;letter-spacing:1px;margin-bottom:12px}
  .cb-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;background:#f3e2b4;border-radius:12px;padding:14px;border:2.5px solid #5d4310}
  .cb-slot{width:86px;height:116px;border-radius:10px;position:relative;background:#1b2c49;border:2.5px solid #33456b;box-shadow:inset 0 3px 8px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
  .cb-slot .cb-q{color:#41547e;font-size:30px;font-weight:800}
  .cb-slot.has{background:linear-gradient(#fffdf4,#fff3d6);border:3px solid #c9a227;box-shadow:0 3px 8px rgba(0,0,0,.3)}
  .cb-slot.has .cb-em{font-size:38px}
  .cb-slot .cb-chk{position:absolute;right:5px;bottom:3px;color:#2e9e63;font-weight:800;font-size:16px}
  .cb-slot.new{animation:cbGlow 1s ease 2}
  @keyframes cbGlow{0%,100%{box-shadow:0 0 0 0 rgba(233,196,106,0)}50%{box-shadow:0 0 0 9px rgba(233,196,106,.75)}}
  .cb-fly{position:fixed;z-index:120;width:86px;height:116px;font-size:15px;transition:transform .6s cubic-bezier(.45,-0.05,.6,.4)}
  @media (max-height:760px){.cb-slot{width:66px;height:90px}.cb-slot.has .cb-em{font-size:29px}}
  #wal{font-size:18px;font-weight:800;color:#8a6a34;background:#fff6de;border:2.5px solid var(--gold);border-radius:999px;padding:6px 16px;white-space:nowrap}
  #wal.pulse{animation:walP .6s}
  @keyframes walP{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:none}}
  .mini-card{border:3px solid var(--gold);background:#fffdf4;border-radius:12px;padding:9px 15px;margin:7px auto;font-size:17px;font-weight:800;max-width:520px;text-align:left;animation:stampIn .5s;box-shadow:0 3px 10px rgba(224,160,42,.25)}
  .cardbn{display:inline-block;background:#fff6de;border:2.5px solid var(--gold);border-radius:999px;padding:8px 22px;font-size:17.5px;font-weight:800;color:#8a6a34;margin:2px 0 10px;animation:bnPulse 1.6s ease-in-out infinite}
  @keyframes bnPulse{0%,100%{transform:none}50%{transform:scale(1.05)}}
  .cfp{position:fixed;top:-16px;width:12px;height:18px;z-index:120;border-radius:3px;pointer-events:none;animation:cfall linear forwards}
  @keyframes cfall{to{transform:translateY(108vh) rotate(560deg)}}
  .stampb{display:inline-block;animation:stampIn .55s cubic-bezier(.2,1.4,.4,1)}
  @keyframes stampIn{0%{transform:scale(3) rotate(-25deg);opacity:0}70%{transform:scale(.92) rotate(3deg);opacity:1}100%{transform:none}}
  button,.chip,.dz,.cell,.key,.tube,.mb,.pot,.pick,.symchip{touch-action:manipulation}
  .home{display:inline-flex;align-items:center;gap:8px;font-size:21px;font-weight:800;color:var(--ink);text-decoration:none;border:3px solid var(--line);border-radius:14px;padding:9px 18px;background:#fff;white-space:nowrap}
  .home:hover{background:#fbf6e8;border-color:var(--gold)}
  @media (max-height:860px){#stage .slide{zoom:.85}.harp{zoom:.72}}
  @media (max-height:740px){#stage .slide{zoom:.72}}
  @media (max-height:620px){#stage .slide{zoom:.6}}
  .itvT{margin:10px auto 0;border-collapse:collapse;background:#fff;font-size:21px}
  .itvT th{background:#f3ead8;padding:11px 24px;border-bottom:2.5px solid var(--line);color:#7a6f58}
  .itvT td{padding:9px 24px;border-bottom:1px solid #eee}
  .itvT tr.pf td{background:#fff7dd;font-weight:700}
  .itvT tr.pf:hover td{background:#ffefc2}
  .itvWrap{display:inline-block;border:3px solid var(--line);border-radius:14px;overflow:hidden}
  /* 모바일(폭 기준) 반응형 */
  @media (max-width:720px){#stage .slide{zoom:.78}}
  @media (max-width:560px){#stage .slide{zoom:.62}}
  @media (max-width:430px){#stage .slide{zoom:.52}}
  .pianoWrap{max-width:100%;overflow-x:auto}
  .toastN{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border:4px solid #2e9e63;border-radius:22px;padding:26px 42px;z-index:120;box-shadow:0 18px 50px rgba(0,0,0,.28);font-weight:800;font-size:27px;text-align:center;max-width:88vw;animation:tIn .25s ease}

function tone(f,w,d){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,c.currentTime+w);g.gain.linearRampToValueAtTime(.15,c.currentTime+w+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+w+d);o.start(c.currentTime+w);o.stop(c.currentTime+w+d);}catch(e){}}

  const o=c.createOscillator(),g=c.createGain();o.type='sine';
  o.frequency.setValueAtTime(420,t0);o.frequency.exponentialRampToValueAtTime(920,t0+0.22);

function gcd(a,b){return b?gcd(b,a%b):a;}

/* 순정률 */
const ITV=['완전1도(같은 음)','장2도','장3도','완전4도','완전5도','장6도','장7도','완전8도(옥타브)'];const PERF=[0,3,4,7];
const NOTES=[['도',264,1,1],['레',297,9,8],['미',330,5,4],['파',352,4,3],['솔',396,3,2],['라',440,5,3],['시',495,15,8],['도′',528,2,1]];
const INTV={'1:1':'유니즌','1:2':'옥타브','2:3':'완전5도','3:4':'완전4도','4:5':'장3도','5:6':'단3도','3:5':'장6도','8:9':'장2도','8:15':'장7도'};
/* 하프 — 화음 단계의 순정률 비 그대로(도:음 = a:b), 길이는 81×a/b */
const HBASE=72;
const HP=[{n:'시',a:8,b:9},{n:'도′',a:5,b:6},{n:'레′',a:3,b:4},{n:'미′',a:2,b:3},{n:'파′',a:5,b:8},{n:'솔′',a:5,b:9}]; // 라:음 진동수 비 — 라보다 점점 높은 음

const hFreq=L=>Math.round(440*HBASE/L);
let hDone=0; // 0~7
function harpHTML(){
  const hp=HP.map((p,i)=>({n:p.n,L:hLen(i),made:i<hDone,frac:p.a+':'+p.b}));

      :`<div class="hs ghost" style="height:${Math.round(it.L*3.6)}px"></div><div class="hlab ghost">?<br><span>${it.frac}</span></div>`}</div>`).join('')+
  `</div></div>`;}

const DECK=[{t:'intro'},{t:'vib'}];for(let __i=1;__i<=7;__i++)DECK.push({t:'harmx',ni:__i});DECK.push({t:'itv2'});

let idx=0,w1env=0,f1=264,s1T=0,animReq=null,plucks=[0,0,0,0,0,0,0,0];
const GOAL_OPEN={};

function drawStrings(){const cv=$('#hc');if(!cv)return;
  const W=cv.width=cv.clientWidth*2,H=cv.height=340;const ctx=cv.getContext('2d');ctx.clearRect(0,0,W,H);
  const yBot=H-16,maxLen=H-34,step=W/8;
  ctx.fillStyle='#6b4a2a';ctx.fillRect(0,yBot,W,H-yBot);
  NOTES.forEach((n,i)=>{const f=n[1],cx=step*i+step/2,len=maxLen*(264/f),yTop=yBot-len;
    const amp=step*0.30*plucks[i],vf=f/45,ph=2*Math.PI*vf*(s1T/60),active=plucks[i]>.03;
    ctx.beginPath();ctx.lineWidth=active?5:3;ctx.strokeStyle=active?'#ffd24a':'#9c8557';
    for(let y=yTop;y<=yBot;y+=2){const dx=amp*Math.sin(Math.PI*(y-yTop)/len)*Math.cos(ph);(y===yTop)?ctx.moveTo(cx+dx,y):ctx.lineTo(cx+dx,y);}
    ctx.stroke();
    ctx.fillStyle='#cdb98a';ctx.beginPath();ctx.arc(cx,yTop,5,0,7);ctx.fill();});}
function drawWave(){const cv=$('#wv');if(!cv)return;
  const W=cv.width=cv.clientWidth*2,H=cv.height=280;const ctx=cv.getContext('2d');ctx.clearRect(0,0,W,H);
  const mid=H/2,pad=24,L=W-pad*2;
  ctx.strokeStyle='#d8d2c4';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(pad,mid);ctx.lineTo(pad+L,mid);ctx.stroke();
  ctx.fillStyle='#8a8577';ctx.font='bold 20px sans-serif';ctx.textAlign='left';ctx.fillText('↕ 공기의 떨림',pad+2,28);
  ctx.textAlign='right';ctx.fillText('시간 →',pad+L,H-12);
  // 도(264) 기준 파동을 회색 점선으로 항상 깔아 비교
  const cyc=f=>f/88; // 도=3물결, 도′=6물결
  ctx.beginPath();ctx.lineWidth=2.5;ctx.strokeStyle='#cfc8b8';ctx.setLineDash([9,8]);
  for(let x=0;x<=L;x++){const y=mid-H*0.30*Math.sin(x/L*cyc(264)*2*Math.PI);x?ctx.lineTo(pad+x,y):ctx.moveTo(pad+x,y);}
  ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#a89f8d';ctx.font='bold 17px sans-serif';ctx.textAlign='left';
  ctx.fillText('┄ 도(264번)의 파동',pad+2,H-12);
  if(w1env<.02){ctx.fillStyle='#a89f8d';ctx.font='bold 22px sans-serif';ctx.textAlign='center';
    ctx.fillText('건반을 누르면 파동이 나타나요!',W/2,36);return;}
  const amp=H*0.33*w1env,c2=cyc(f1),shift=(s1T*2.4)%(L/c2);
  ctx.beginPath();ctx.lineWidth=5;ctx.strokeStyle=f1>400?'#c0392b':(f1>290?'#e0a02a':'#3b6db5');
  for(let x=0;x<=L;x++){const y=mid-amp*Math.sin((x-shift)/L*c2*2*Math.PI);x?ctx.lineTo(pad+x,y):ctx.moveTo(pad+x,y);}ctx.stroke();}
function loopWave(){s1T++;if(w1env>.001)w1env*=DECAY;for(let i=0;i<8;i++)if(plucks[i]>.001)plucks[i]*=DECAY;drawStrings();drawWave();animReq=requestAnimationFrame(loopWave);}

function fx(s){return String(s).replace(/([0-9][0-9,]*)\/([0-9][0-9,]*)/g,'<span class="fr"><span>$1</span><span class="d">$2</span></span>');}
function mountDrag(el,onAll){
  let sel=null,drag=null;

  function allDone(){if(dzs.every(z=>z.classList.contains('okk')))setTimeout(onAll,380);}

    if(ch.dataset.w===dz.dataset.a){
      dz.innerHTML=fx(ch.dataset.w);ch.classList.add('used');

      try{tone(180,0,.2);}catch(e){}
      setTimeout(()=>dz.classList.remove('bad','shake'),480);}}
