<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RatioSense v3 — 소리의 비밀</title>
<style>
  :root{--bg:#f4f1ea;--ink:#26303f;--sub:#6b7683;--line:#e6e1d6;--accent:#2e9e63;--gold:#e0a02a;--red:#c0392b}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
  #top{position:fixed;left:0;right:0;top:0;height:64px;background:#fff;border-bottom:2px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 26px;z-index:10}
  #top .t{font-size:22px;font-weight:800;white-space:nowrap}
  #top a{color:var(--sub);text-decoration:none}
  #pbar{flex:1;height:14px;background:#ece8dd;border-radius:7px;overflow:hidden}
  #pfill{height:100%;width:0%;background:linear-gradient(90deg,#2e9e63,#5cc98d);transition:width .4s}
  #pnum{font-size:19px;font-weight:800;color:var(--sub)}
  #stage{position:absolute;inset:64px 0 0 0;display:flex;align-items:center;justify-content:center;overflow:auto}
  .slide{width:min(960px,94vw);padding:20px 10px 40px;text-align:center;animation:in .35s ease both}
  @keyframes in{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
  .q{font-size:clamp(23px,3.2vw,32px);font-weight:800;line-height:1.55;margin:6px 0 8px}
  .q b{color:#b3541e}
  .sub{font-size:clamp(17px,2vw,21px);color:var(--sub);font-weight:700;margin-bottom:12px}
  .btn{border:2.5px solid var(--line);background:#fff;border-radius:16px;padding:15px 28px;font-weight:800;font-size:21px;cursor:pointer;margin:6px}
  .btn:hover{background:#fbf6e8}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-size:23px;padding:18px 44px}
  .btn.pri:hover{background:#288a56}
  /* 피아노 */
  .pianoWrap{display:inline-block;max-width:94vw;overflow-x:auto}
  .piano{display:flex;gap:6px;justify-content:center;margin:0 auto;position:relative;width:634px}
  .key{width:74px;height:150px;background:linear-gradient(#ffffff,#f0ede5);border:3px solid #1c2430;border-top:none;border-radius:0 0 12px 12px;cursor:pointer;
    display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;font-size:22px;font-weight:800;
    box-shadow:inset 0 -7px 0 rgba(0,0,0,.10)}
  .key:hover{background:#fff7dd}
  .key.play{background:#ffe9a8;transform:translateY(2px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14)}
  .key.base{background:#eaf7ef;border-color:var(--accent)}
  .bkey{position:absolute;top:0;width:44px;height:92px;background:linear-gradient(#2a2a30,#000);border-radius:0 0 8px 8px;z-index:2;pointer-events:none;box-shadow:0 4px 6px rgba(0,0,0,.4)}
  canvas{background:#fff;border:2.5px solid var(--line);border-radius:14px;max-width:100%}
  .dial{font-size:24px;font-weight:800;margin-top:8px}
  .verdict{font-size:26px;font-weight:800;margin-top:6px;min-height:38px}
  /* 하프 */
  .harp{background:#241a10;border-radius:16px;padding:16px 12px 12px;display:inline-block}
  .hbeam{height:14px;background:linear-gradient(#d9b26a,#8a6a34);border-radius:7px}
  .hrow{display:flex;justify-content:space-around;align-items:flex-start;gap:6px;padding:0 8px}
  .hcol{display:flex;flex-direction:column;align-items:center;width:56px}
  .hs{width:12px;background:linear-gradient(#fff6dd,#c9b98a);border-radius:5px;cursor:pointer;box-shadow:0 0 5px rgba(255,240,200,.4)}
  .hs.ghost{background:none;border-left:6px dashed #5a4a30;cursor:default;box-shadow:none}
    .hs.pluckA{animation:wig 1.25s ease-out}
  @keyframes wig{8%{transform:translateX(6px)}20%{transform:translateX(-5px)}33%{transform:translateX(4px)}46%{transform:translateX(-3px)}60%{transform:translateX(2px)}75%{transform:translateX(-1px)}100%{transform:none}}
  .hlab{margin-top:8px;font-size:16px;font-weight:800;color:#f0e9d8;text-align:center;line-height:1.3}
  .hlab span{font-size:14px;color:#cbbfa8}
  .hlab.ghost{color:#6a583a}
  .nf{display:inline-flex;flex-direction:column;align-items:center;gap:6px;margin:8px 0}
  .nf input{width:180px;font-size:32px;font-weight:800;border:3px solid var(--line);border-radius:16px;padding:12px;text-align:center;outline:none}
  .nf input:focus{border-color:var(--accent)}
  .nf .u{font-size:19px;font-weight:800;color:var(--sub)}
  .hintbox{font-size:20px;color:var(--sub);font-weight:700;background:#fbf6e8;border:2px solid #e0c98a;border-radius:14px;padding:10px 18px;display:inline-block;margin:8px 0}
  .nav{position:fixed;top:50%;transform:translateY(-50%);width:64px;height:64px;border-radius:50%;border:3px solid var(--line);background:#fff;font-size:34px;font-weight:800;color:var(--sub);cursor:pointer;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center}
  .nav:hover{background:#fbf6e8;color:var(--ink)}
  #navL{left:14px}#navR{right:14px}.nav.off{opacity:.25;pointer-events:none}
  #fb{position:fixed;inset:0;background:rgba(38,48,63,.45);display:none;align-items:center;justify-content:center;z-index:50}
  #fb.show{display:flex}
  #fb .in{background:#fff;border-radius:26px;max-width:620px;width:92vw;padding:38px 34px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.35);border-top:8px solid var(--accent);animation:pop .3s ease}
  #fb.help .in{border-top-color:var(--gold)}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
  #fbT{font-size:30px;font-weight:800;margin-bottom:10px}
  #fbS{font-size:21px;line-height:1.8;color:#41506b;font-weight:600}
  #fbA{margin-top:22px}
  .home{display:inline-flex;align-items:center;gap:8px;font-size:21px;font-weight:800;color:var(--ink);text-decoration:none;border:3px solid var(--line);border-radius:14px;padding:9px 18px;background:#fff;white-space:nowrap}
  .home:hover{background:#fbf6e8;border-color:var(--gold)}
</style>
</head>
<body>
<div id="top"><a class="home" href="index.html">🏠 홈</a><div class="t">🎼 소리의 비밀 <span style="color:#b3541e">v3</span></div><div id="pbar"><div id="pfill"></div></div><div id="pnum"></div></div>
<div id="stage"><div class="slide" id="slide"></div></div>
<button class="nav" id="navL">‹</button><button class="nav" id="navR">›</button>
<div id="fb"><div class="in"><div id="fbT"></div><div id="fbS"></div><div id="fbA"></div></div></div>
<script>
const $=s=>document.querySelector(s);
function plog(ev,data){try{parent.postMessage({type:'pilotLog',lab:'soundV3',event:ev,data:data||{}},'*');}catch(e){}}
let AC;const ac=()=>AC||(AC=new(window.AudioContext||window.webkitAudioContext)());
function tone(f,w,d){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,c.currentTime+w);g.gain.linearRampToValueAtTime(.15,c.currentTime+w+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+w+d);o.start(c.currentTime+w);o.stop(c.currentTime+w+d);}catch(e){}}
function chord(fA,fB,d){tone(fA,0,d||1.4);tone(fB,0,d||1.4);}
function pluckT(f,w){[[f,.2],[f*2,.06],[f*3,.03]].forEach(([ff,v])=>{try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=ff;o.connect(g);g.connect(c.destination);const t0=c.currentTime+(w||0);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.008);g.gain.exponentialRampToValueAtTime(.001,t0+1.3);o.start(t0);o.stop(t0+1.35);}catch(e){}});}
function chime(ok){ok?(tone(523,0,.2),tone(659,.2,.2),tone(784,.4,.42)):(tone(392,0,.16),tone(349,.16,.2));}
function gcd(a,b){return b?gcd(b,a%b):a;}
function jz(w,a,b){const c=w.charCodeAt(w.length-1);return ((c-0xAC00)%28>0)?a:b;}

/* 순정률 */
const NOTES=[['도',262,1,1],['레',295,9,8],['미',328,5,4],['파',349,4,3],['솔',393,3,2],['라',437,5,3],['시',491,15,8],['도′',524,2,1]];
const INTV={'1:1':'유니즌','1:2':'옥타브','2:3':'완전5도','3:4':'완전4도','4:5':'장3도','5:6':'단3도','3:5':'장6도','8:9':'장2도','8:15':'장7도'};
/* 하프(피타고라스 5음계) */
const HBASE=81;
const HP=[{n:'레',a:8,b:9},{n:'미',a:64,b:81},{n:'솔',a:2,b:3},{n:'라',a:16,b:27},{n:'도′',a:1,b:2}];
const hLen=i=>HBASE*HP[i].a/HP[i].b;
const hFreq=L=>Math.round(262*HBASE/L);
let hDone=0;
function harpHTML(){
  const items=[{n:'도',L:81,made:true,frac:'1'}].concat(HP.map((p,i)=>({n:p.n,L:hLen(i),made:i<hDone,frac:p.a+'/'+p.b})));
  return `<div class="harp"><div class="hbeam"></div><div class="hrow">`+
    items.map((it,ix)=>`<div class="hcol">${it.made
      ?`<div class="hs" style="height:${Math.round(it.L*2.4)}px" onclick="pluckT(${hFreq(it.L)});this.classList.remove('pluckA');void this.offsetWidth;this.classList.add('pluckA')"></div><div class="hlab">${it.n}<br><span>${Math.round(it.L*10)/10}cm</span></div>`
      :`<div class="hs ghost" style="height:${Math.round(it.L*2.4)}px"></div><div class="hlab ghost">?<br><span>${it.frac}</span></div>`}</div>`).join('')+
  `</div></div>`;}

const DECK=[{t:'intro'},{t:'vib'},{t:'chordQ'}];
HP.forEach((p,i)=>DECK.push({t:'harp',i}));
DECK.push({t:'done'});
let idx=0,w1env=0,f1=262,s1T=0,animReq=null,plucks=[0,0,0,0,0,0,0,0];
const SND_DUR=1.6, DECAY=Math.pow(0.02,1/(60*SND_DUR));
function prog(){$('#pfill').style.width=(idx/(DECK.length-1)*100)+'%';$('#pnum').textContent=(idx+1)+' / '+DECK.length;
  $('#navL').className='nav'+(idx<=0?' off':'');$('#navR').className='nav'+(idx>=DECK.length-1?' off':'');}
function fb(cls,t,s,btnText,after){const b=$('#fb');b.className='show '+cls;
  $('#fbT').innerHTML=t;$('#fbS').innerHTML=s||'';
  $('#fbA').innerHTML=`<button class="btn pri" id="fbBtn">${btnText}</button>`;
  $('#fbBtn').onclick=()=>{b.className='';if(after)after();};}
function next(){if(animReq){cancelAnimationFrame(animReq);animReq=null;}idx=Math.min(idx+1,DECK.length-1);render();}
function success(t,s,after){chime(true);plog('success',{slide:idx});fb('','✅ '+t,s,'다음 →',after||next);}
function retry(s){chime(false);plog('retry',{slide:idx});fb('help','🤔 다시 한번!',s,'도전!',null);}

function drawStrings(){const cv=$('#hc');if(!cv)return;
  const W=cv.width=cv.clientWidth*2,H=cv.height=340;const ctx=cv.getContext('2d');ctx.clearRect(0,0,W,H);
  const yBot=H-16,maxLen=H-34,step=W/8;
  ctx.fillStyle='#6b4a2a';ctx.fillRect(0,yBot,W,H-yBot);
  NOTES.forEach((n,i)=>{const f=n[1],cx=step*i+step/2,len=maxLen*(262/f),yTop=yBot-len;
    const amp=step*0.30*plucks[i],vf=f/45,ph=2*Math.PI*vf*(s1T/60),active=plucks[i]>.03;
    ctx.beginPath();ctx.lineWidth=active?5:3;ctx.strokeStyle=active?'#ffd24a':'#9c8557';
    for(let y=yTop;y<=yBot;y+=2){const dx=amp*Math.sin(Math.PI*(y-yTop)/len)*Math.cos(ph);(y===yTop)?ctx.moveTo(cx+dx,y):ctx.lineTo(cx+dx,y);}
    ctx.stroke();
    ctx.fillStyle='#cdb98a';ctx.beginPath();ctx.arc(cx,yTop,5,0,7);ctx.fill();});}
function drawWave(){const cv=$('#wv');if(!cv)return;
  const W=cv.width=cv.clientWidth*2,H=cv.height=280;const ctx=cv.getContext('2d');ctx.clearRect(0,0,W,H);
  const mid=H/2,pad=24,L=W-pad*2,cycles=Math.max(3,Math.round(f1/45));
  ctx.strokeStyle='#d8d2c4';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(pad,mid);ctx.lineTo(pad+L,mid);ctx.stroke();
  ctx.fillStyle='#8a8577';ctx.font='bold 20px sans-serif';ctx.textAlign='left';ctx.fillText('↕ 공기의 떨림',pad+2,28);
  ctx.textAlign='right';ctx.fillText('시간 →',pad+L,H-12);
  if(w1env<.02){ctx.fillStyle='#a89f8d';ctx.font='bold 22px sans-serif';ctx.textAlign='center';
    ctx.fillText('건반을 누르면 파동이 나타나요!',W/2,mid-22);return;}
  const amp=H*0.33*w1env,shift=(s1T*2.4)%(L/cycles);
  ctx.beginPath();ctx.lineWidth=5;ctx.strokeStyle=f1>360?'#c0392b':(f1>240?'#e0a02a':'#3b6db5');
  for(let x=0;x<=L;x++){const y=mid-amp*Math.sin((x-shift)/L*cycles*2*Math.PI);x?ctx.lineTo(pad+x,y):ctx.moveTo(pad+x,y);}ctx.stroke();}
function loopWave(){s1T++;if(w1env>.001)w1env*=DECAY;for(let i=0;i<8;i++)if(plucks[i]>.001)plucks[i]*=DECAY;drawStrings();drawWave();animReq=requestAnimationFrame(loopWave);}

function render(){prog();const d=DECK[idx];const el=$('#slide');
  if(animReq){cancelAnimationFrame(animReq);animReq=null;}
  if(d.t==='intro'){el.innerHTML=`<div style="font-size:90px">🎼</div>
    <div class="q">소리의 비밀에 온 걸 환영해요!</div>
    <div class="sub">소리는 <b>떨림(진동)</b>이에요. 떨림의 <b>비</b>가 아름다운 화음과 음계를 만들어요!</div>
    <button class="btn pri" onclick="next()">시작하기 →</button>`;return;}
  if(d.t==='vib'){
    plucks=[0,0,0,0,0,0,0,0];w1env=0;
    el.innerHTML=`<div class="q">건반을 눌러 <b>진동수</b>를 느껴 보세요!</div>
      <div class="sub">건반을 누르면 <b>뒤쪽 현이 떨려요</b> — 높은 음일수록 현이 짧고 빨리! (실제보다 천천히 보여드려요)</div>
      <div class="pianoWrap">
        <canvas id="hc" style="width:634px;height:170px;display:block;background:#241610;border:none;border-radius:14px 14px 0 0"></canvas>
        <div class="piano">
          ${NOTES.map((n,i)=>`<div class="key" data-i="${i}">${n[0]}</div>`).join('')}
          ${[0,1,3,4,5].map(i=>`<div class="bkey" style="left:${i*80+55}px"></div>`).join('')}
        </div>
      </div>
      <div><canvas id="wv" style="width:min(860px,90vw);height:130px;margin-top:12px"></canvas></div>
      <div class="dial" id="hz">건반을 눌러 보세요</div>
      <div style="margin-top:10px"><button class="btn pri" onclick="next()">다 들어봤어요 →</button></div>`;
    el.querySelectorAll('.key').forEach(k=>k.onclick=()=>{const i=+k.dataset.i;f1=NOTES[i][1];w1env=1;plucks[i]=1;
      tone(f1,0,SND_DUR);plog('key',{n:NOTES[i][0]});
      $('#hz').innerHTML=`<b>${NOTES[i][0]}</b> — 1초에 <b>${NOTES[i][1]}번</b> 떨려요`;
      k.classList.add('play');setTimeout(()=>k.classList.remove('play'),180);});
    loopWave();return;}
  if(d.t==='chordQ'){
    el.innerHTML=`<div class="q">Ⓠ <b>도</b>와 함께 눌렀을 때, 진동수의 비가<br><b>2 : 3</b>이 되는 음을 찾아 보세요!</div>
      <div class="sub">건반을 누르면 도와 함께 울려요 — 비가 간단할수록 잘 어울려요</div>
      <div class="piano">${NOTES.map((n,i)=>`<div class="key ${i===0?'base':''}" data-i="${i}">${n[0]}${i===0?'<br>★':''}</div>`).join('')}</div>
      <div class="dial" id="ratio">&nbsp;</div>
      <div class="verdict" id="vd"></div>`;
    el.querySelectorAll('.key').forEach(k=>k.onclick=()=>{const i=+k.dataset.i;const n=NOTES[i];
      chord(262,n[1],1.4);plog('chord',{n:n[0]});
      k.classList.add('play');setTimeout(()=>k.classList.remove('play'),180);
      const a=n[3],b=n[2];const key=`${Math.min(a,b)}:${Math.max(a,b)}`;
      $('#ratio').innerHTML=`도 262Hz : ${n[0]} ${n[1]}Hz = <b>${a} : ${b}</b>${INTV[key]?' · '+INTV[key]:''}`;
      const nice=(a*b<=6);
      $('#vd').innerHTML=nice?'😍 아주 잘 어울려요!':(a*b<=20?'😊 잘 어울려요':'😐 조금 거칠어요');
      if(a===2&&b===3)setTimeout(()=>success('찾았다! 솔 🎵','도 : 솔 = <b>2 : 3</b> — <b>완전5도</b>! 간단한 정수비일수록 아름다운 화음이 돼요.'),600);});
    return;}
  if(d.t==='harp'){const p=HP[d.i],ex=hLen(d.i);hDone=d.i;
    el.innerHTML=`<div class="q">🪕 <b>${p.n}</b> 줄은 도 줄(<b>81cm</b>)의 <b>${p.a}/${p.b}</b> —<br><b>몇 cm</b>로 만들어야 할까요?</div>
      <div class="sub">하프 공방 ${d.i+1}/5 — 완성된 줄은 눌러서 소리 확인! (짧을수록 높은 음)</div>
      ${harpHTML()}
      <div class="nf"><input id="inp" type="number" step="0.1" placeholder="?"><div class="u">cm</div></div>
      <div><button class="btn pri" id="go">🪕 이 길이로 줄 매달기</button></div>`;
    $('#go').onclick=()=>{const v=parseFloat($('#inp').value||'0');
      if(Math.abs(v-ex)<=0.3){hDone=d.i+1;pluckT(hFreq(ex));
        success(`${p.n} 줄 완성! ${Math.round(ex*100)/100}cm`,`81cm의 ${p.a}/${p.b} = <b>${Math.round(ex*100)/100}cm</b> — 뜯으면 딱 ${p.n}!`);}
      else retry(`도 줄 <b>81cm</b>의 <b>${p.a}/${p.b}</b>이 몇 cm인지 다시 구해 보세요.`);};return;}
  if(d.t==='done'){hDone=5;
    el.innerHTML=`<div style="font-size:80px">🎉</div>
    <div class="q">5음계 하프 완성! 자유롭게 연주해 보세요</div>
    ${harpHTML()}
    <div class="sub" style="margin-top:12px">📝 오늘 소리에서 찾은 <b>비의 비밀</b>을 한 문장으로!</div>
    <div style="margin:8px 0"><input id="rfx" type="text" maxlength="100" placeholder="예: 줄이 짧을수록 빨리 떨려서 높은 소리가 난다!"
      style="width:min(560px,90vw);font-size:21px;font-weight:700;border:3px solid var(--line);border-radius:16px;padding:16px;outline:none"></div>
    <button class="btn pri" id="go">남기고 완성! 🪕</button>`;
    $('#go').onclick=()=>{plog('reflection',{text:($('#rfx').value||'').slice(0,100)});chime(true);
      fb('','🏆 모두 끝!','대단해요 — 다른 방도 탐험해 보세요!','처음으로',()=>{location.href='index.html';});};return;}
}
$('#navL').onclick=()=>{if(idx>0){if(animReq){cancelAnimationFrame(animReq);animReq=null;}idx--;render();plog('nav',{to:idx});}};
$('#navR').onclick=()=>{if(idx<DECK.length-1){if(animReq){cancelAnimationFrame(animReq);animReq=null;}idx++;render();plog('nav',{to:idx});}};
render();
</script>
</body>
</html>
